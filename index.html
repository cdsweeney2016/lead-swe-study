<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--text:#1d2330;--muted:#5b6474;--line:#dde1e7;
  --accent:#1f5fbf;--accent-ink:#ffffff;--ok:#1d7a46;--ok-bg:#e5f4ea;--bad:#b3261e;--bad-bg:#fbe9e7;
  --warn:#8a5a00;--warn-bg:#fff4dc;--code:#f0f2f5;--focus:#ffbf47;
  --m0:#e3e6eb;--m1:#f6d5cf;--m2:#fbe7b5;--m3:#cfe8d6;--m4:#8fd1a6;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11141a;--panel:#1a1f27;--text:#e7eaf0;--muted:#a3abb9;--line:#2c3340;
    --accent:#6ea8ff;--accent-ink:#0b1220;--ok:#6fd39a;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1c1a;
    --warn:#ffd27a;--warn-bg:#3a2e12;--code:#232a35;
    --m0:#2a313d;--m1:#5a2d29;--m2:#5c4a1c;--m3:#245236;--m4:#2f7d4f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:flex;min-height:100vh}
nav.side{display:none}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:650}
header.top .sub{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
[hidden]{display:none!important}
#updatebar{bottom:76px}
@media (min-width:900px){#updatebar{bottom:24px}}
@media (display-mode: standalone){header.top{padding-top:max(10px,env(safe-area-inset-top))}}
main{flex:1;min-width:0;padding:16px 16px 96px;max-width:980px;margin:0 auto;width:100%}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a,nav.side a{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:56px;text-decoration:none;color:var(--muted);font-size:12px;gap:2px}
nav a .ic{font-size:18px;line-height:1}
nav a.active{color:var(--accent);font-weight:650}
@media (min-width:900px){
  nav.bottom{display:none}
  nav.side{display:flex;flex-direction:column;width:210px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:12px 8px}
  nav.side .brand{font-weight:700;padding:8px 12px 16px;font-size:17px}
  nav.side a{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px;min-height:44px;border-radius:8px;font-size:15px}
  nav.side a.active{background:var(--bg)}
  nav.side .foot{margin-top:auto;color:var(--muted);font-size:12px;padding:12px}
  header.top{display:none}
  main{padding:24px 32px 48px}
}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:17px;margin:20px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
button,.btn{font:inherit;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
button.link{border:none;background:none;color:var(--accent);padding:4px 6px;min-height:32px}
input[type=text],input[type=date],select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:120px;resize:vertical}
textarea.code,pre,code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:13.5px}
textarea.code{min-height:240px;white-space:pre;tab-size:2;background:var(--code)}
pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto;margin:8px 0;white-space:pre}
code{background:var(--code);padding:1px 5px;border-radius:4px}
label{display:block}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--panel)}
.opt input{margin-top:4px;width:18px;height:18px;flex-shrink:0}
.opt.sel{border-color:var(--accent)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.checks{list-style:none;padding:0;margin:8px 0}
.checks li{padding:6px 0 6px 28px;position:relative;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:none}
.checks li::before{position:absolute;left:4px;top:6px;font-weight:700}
.checks li.ok::before{content:"\2713";color:var(--ok)}
.checks li.bad::before{content:"\2717";color:var(--bad)}
.result{border-radius:8px;padding:12px;margin-top:12px}
.result.ok{background:var(--ok-bg)}
.result.bad{background:var(--bad-bg)}
.hint{background:var(--warn-bg);color:var(--text);border-radius:8px;padding:8px 12px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cell{display:block;text-decoration:none;color:var(--text);border-radius:8px;padding:10px;background:var(--m0);min-height:74px;border:1px solid transparent}
.cell .id{font-weight:700;font-size:13px}
.cell .t{font-size:12.5px;line-height:1.3;margin-top:2px}
.cell .pct{font-size:12px;margin-top:4px;color:var(--muted)}
.cell.m1{background:var(--m1)}.cell.m2{background:var(--m2)}.cell.m3{background:var(--m3)}.cell.m4{background:var(--m4)}
.cell.ready{border-color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--m0);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
.tablewrap{overflow-x:auto}
.stat{display:flex;flex-direction:column;padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:0;flex:1 1 0}
.stat b{font-size:20px}
@media (max-width:520px){.stat{padding:8px}.stat b{font-size:17px}.stat .small{font-size:11.5px;line-height:1.25}}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-size:14px;max-width:90vw}
@media (min-width:900px){.flash{bottom:24px}}
.term{background:#0f1419;color:#d6dde6;border-radius:8px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap;max-height:260px;overflow:auto}
.restrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
@media (min-width:700px){.restrow{grid-template-columns:2fr 110px 2fr 110px;align-items:center}}
.kbd{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-bg);padding:10px 12px;border-radius:8px;margin-bottom:12px}
.tasklist a{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.tasklist a:last-child{border-bottom:none}
.flipq{font-size:18px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

 {id:"K7",g:"Knowledge",t:"Azure cloud infrastructure",obj:["Resource groups, App Service, Functions, SQL, Storage, VNets","Key Vault, managed identity, RBAC","Monitoring and cost"],res:["R4","R5","R7","R8","R9","R10","R12"],sum:"Secrets belong in Key Vault, read by a managed identity, never in app settings or code. Know App Service plans, deployment slots and Application Insights."},
 {id:"K8",g:"Knowledge",t:"IIS administration, configuration, management",obj:["Sites, bindings, app pools and identities","applicationHost.config and web.config","URL Rewrite, request filtering, logs, appcmd and PowerShell"],res:["R13","R14"],sum:"A binding is protocol + IP:port:host. Several HTTPS sites on one IP need SNI (sslFlags=1) and a host name. 500.19 means a config error; 503 often means the app pool stopped."},
 {id:"K9",g:"Knowledge",t:"HTTP methods for data retrieval and manipulation",obj:["GET, POST, PUT, PATCH, DELETE semantics","Safe and idempotent methods; status codes","Headers, caching, CORS"],res:["R31"],sum:"GET reads; POST creates (201 + Location); PUT replaces; PATCH changes part; DELETE removes (204). GET, PUT and DELETE are idempotent; GET and HEAD are safe."},
 {id:"K10",g:"Knowledge",t:"Angular or JS frameworks for responsive UIs",obj:["Components, signals, routing, forms, HttpClient","Responsive layout","Accessibility (WCAG 2.2)"],res:["R19","R21","R22","R55b"],sum:"Know signals and OnPush change detection, standalone components, reactive or signal forms, and HttpClient (returns Observables). Public-facing sites must meet accessibility standards."},
 {id:"S1",g:"Skill",t:"Consuming and producing RESTful APIs",obj:["Design resources, URIs, versions, pagination and errors","Consume APIs with timeouts and retries"],res:["R3","R31","R37"],sum:"Plural nouns, no verbs in paths, correct status codes, RFC 9457 problem details for errors. Clients retry only safe or idempotent calls on 429/503, with backoff."},
 {id:"S2",g:"Skill",t:"Technical expertise, direction and support to a team",obj:["Unblock others by teaching","Run design reviews","Set team standards"],res:["R47","R49"],sum:"Lead by asking good questions, pairing and writing things down. Standards should be short, agreed by the team and enforced by tools where possible."},
 {id:"S3",g:"Skill",t:"Project management principles in IT",obj:["Scope, estimates, risk register, RAID log","Status reporting and change control","Stakeholder mapping"],res:["R42","R51","R55"],sum:"When a date moves, present options (scope, people, date) with impacts instead of saying yes. Keep a RAID log (risks, assumptions, issues, dependencies) with owners and dates."},
 {id:"A1",g:"Ability",t:"Problem solving and critical thinking",obj:["Reproduce, isolate, hypothesize, test","Separate root cause from symptom"],res:["R46","R24"],sum:"Work from evidence: logs, metrics, recent changes. Change one thing at a time. Write down hypotheses and rule them out."},
 {id:"A2",g:"Ability",t:"Leading in a senior technical role",obj:["Make and own decisions","Delegate; handle escalations","Disagree and commit"],res:["R49","R49b","R48"],sum:"A lead balances delivery and people: protects focus, makes calls when needed, and owns mistakes publicly."},
 {id:"A3",g:"Ability",t:"Communicating and collaborating across teams",obj:["Tailor messages to the audience","Lead with the bottom line","Close with owners and dates"],res:["R53","R53b","R51"],sum:"Write for the reader: what happened, what it means for them, what they need to do, when you'll update them. Avoid jargon for non-technical readers."},
 {id:"A4",g:"Ability",t:"Designing and maintaining CI/CD pipelines",obj:["Multi-stage YAML: build, test, deploy","Environments, approvals, secrets","Rollback and release strategies"],res:["R6","R16","R28","R44"],sum:"Build once, test, then promote the same artifact through environments. Gate production with environment approvals. Keep secrets in variable groups or Key Vault, never in YAML."},
 {id:"P1",g:"Preferred",t:"Hands-on Azure DevOps, GitHub, TFVC workflows",obj:["Boards: area and iteration paths, work item links","Branch policies and pull requests","TFVC shelvesets and check-ins"],res:["R15","R17","R43"],sum:"Branch policies on main: require pull requests, minimum reviewers, build validation, linked work items and resolved comments. In GitHub, AB#123 links a commit to an Azure Boards item."},
 {id:"P2",g:"Preferred",t:"C#, Angular, TypeScript with strong OOP",obj:["Encapsulation, polymorphism, composition over inheritance","Interface design","TypeScript strict mode"],res:["R1","R20","R26"],sum:"Prefer small interfaces and composition. Use polymorphism to remove switch statements. Know LINQ deferred execution and C# record equality."},
 {id:"P3",g:"Preferred",t:"Leading and mentoring: performance, growth, culture",obj:["Run 1:1s that belong to the report","Give SBI feedback","Write fair reviews; handle underperformance"],res:["R48","R50","R50b","R51"],sum:"Feedback: Situation, Behavior, Impact, then a request. Reviews use specific, dated evidence. Psychological safety (Google's Project Aristotle) is the strongest predictor of team effectiveness."},
 {id:"P4",g:"Preferred",t:"Advanced Azure deployment plus IIS administration",obj:["App Service deployment slots and swaps","Sticky slot settings, managed certificates","IIS on Windows VMs; moving IIS sites to App Service"],res:["R7","R8","R13","R14"],sum:"Deploy to a staging slot, warm it up, then swap. Mark environment-specific settings as slot settings so they don't swap."},
 {id:"P5",g:"Preferred",t:"Secure web development: TLS, REST, architecture",obj:["TLS 1.2/1.3, certificate chains, HSTS, security headers","OWASP Top 10:2025","OAuth 2.0/OIDC, CORS, input validation"],res:["R31","R32","R33","R34","R35","R36","R37","R38"],sum:"Disable SSL 3 and TLS 1.0/1.1. Redirect HTTP to HTTPS and send HSTS. Never use a wildcard CORS origin with credentials. Broken Access Control is #1 on the OWASP Top 10:2025."},
];
const PUBLIC_ITEMS = [
 {id:"G1",g:"Enterprise",t:"Web accessibility: WCAG 2.1 AA, ADA and Section 508",supports:["K10","P5","K3","C1e"],
  obj:["Know the legal context: the ADA (Title II rule for state and local government: WCAG 2.1 AA by April 26, 2027 or 2028; Title III applied to business websites by courts) and Section 508 (federal agencies, WCAG 2.0 AA)","Know what to ask vendors for: a WCAG conformance report (ACR/VPAT) and your own testing","Use semantic HTML first, ARIA only when needed","Test with keyboard only and a screen reader (NVDA, VoiceOver)","Build accessible Angular: native elements, focus after route changes, LiveAnnouncer, focus traps, aria-current"],
  res:["G_ada","G_ifr","G_wcag21","G_508t","G_ict","G_apg","G_easy","G_nga11y","G_cdk","G_nvda"],
  sum:"WCAG 2.1 Level AA is the working legal standard for web accessibility. In the public sector, DOJ's ADA Title II rule requires it for state and local government web content and mobile apps (compliance by April 26, 2027 for governments serving 50,000 or more people, April 26, 2028 for smaller ones, after the April 20, 2026 interim final rule, which is being challenged in court; check ADA.gov). Courts apply the ADA to business websites, and Section 508 covers federal agencies and their vendors. Whatever the sector: use native HTML (button, label, fieldset), test with the keyboard and a screen reader, ask vendors for a conformance report, and treat accessibility as a definition-of-done item."},
 {id:"G2",g:"Enterprise",t:"Data retention, records requests, PII and audit logging",supports:["K1","P5","S3","A3"],
  obj:["Handle a records request (public records, legal discovery or a privacy request): route to the records owner, preserve, search, export, redact","Apply retention schedules and legal holds in app and database design","Classify and protect PII (minimize, encrypt, mask, restrict access)","Design audit logs: who, what, when, where, outcome; tamper-evident; no secrets"],
  res:["G_pii","G_logs","G_owlog","G_cosa","G_nara","G_cjis"],
  sum:"Emails, database rows and logs are records. In the public sector they are usually public records under state law (the federal FOIA covers federal agencies); in the private sector, privacy laws and litigation holds create similar duties. Records are kept and destroyed by approved retention schedules, and a legal hold suspends destruction. Design for this: retention category and dates on records, soft delete with scheduled purge, export and redaction tools for requests, encrypted and masked PII, and append-only audit logs that never contain passwords or full SSNs. Regulated data (payments, health, criminal justice) adds its own rules, such as the FBI CJIS Security Policy."},
 {id:"G3",g:"Enterprise",t:"Change management: CAB, maintenance windows, separation of duties",supports:["A4","S3","A2","K4"],
  obj:["Write a change request a CAB will approve: risk, impact, test evidence, plan, rollback, window, communications","Know standard, normal and emergency changes","Plan maintenance windows and rollbacks (slot swap, feature flags, backward-compatible migrations)","Enforce separation of duties: requester, approver and implementer differ; pipeline approvals"],
  res:["G_800_53","G_appr","G_srerel","R46"],
  sum:"Most IT organizations run a Change Advisory Board (CAB) or an equivalent review. Standard changes are pre-approved and low risk; normal changes go to CAB; emergency changes get fast-track approval and a review afterward. A good change request states what, why, risk, test evidence, the implementation steps, a tested rollback plan with a time limit, the maintenance window and who is notified. Separation of duties (NIST AC-5) means the developer who wrote a change doesn't approve or deploy it alone; Azure Pipelines environment approvals enforce this in the tool."},
 {id:"G4",g:"Enterprise",t:"Legacy modernization: TFVC to Git, .NET Framework to .NET, strangler fig",supports:["K4","K1","P4","C1e","A2"],
  obj:["Plan a TFVC-to-Git migration: tip migration or limited history, git-tfs for full history, branching strategy, binaries out","Plan .NET Framework to modern .NET: assessment, incremental migration, target .NET 10 LTS","Know the IIS hosting changes: Hosting Bundle, ASP.NET Core Module, 'No Managed Code' app pools","Use the strangler fig pattern","Sell modernization to non-technical leaders"],
  res:["G_tfvcimp","G_c2git","G_gittfs","G_ua","G_copilot","G_fx2core","G_port","G_support","G_bundle","G_sfaz","G_sffw"],
  sum:"Azure Repos' TFVC import handles one branch or the root, up to 1 GB and up to 180 days of history; Microsoft recommends a tip migration and keeping TFVC read-only for old history, or git-tfs for full history. For .NET, the Upgrade Assistant is deprecated in favor of the GitHub Copilot app modernization agent; large ASP.NET apps move incrementally (YARP plus System.Web adapters), which is the strangler fig pattern. .NET 8 and 9 reach end of support on November 10, 2026, so target .NET 10 (LTS, supported to November 2028). On IIS, install the Hosting Bundle and set the app pool to 'No Managed Code'. Sell it with risk, cost of doing nothing, support dates and a phased plan."}

const COMPETENCIES = [
 {id:"C1",name:"Teamwork and collaboration",
  summary:"The teamwork competency from the example posting: work across teams and departments as one organization. Value other people's ideas, contribute as a leader or as a team member, build consensus and trust, pull toward shared goals, communicate clearly with technical and non-technical people, and listen actively while sharing information across departments. Panels look for stories where you did these things with other teams, not only inside your own.",
  res:["R51","R53b"],
  behaviors:[
   {id:"a",t:"Values others' ideas and contributions",obj:["Draw out quiet voices","Credit ideas to their owners","Build on others' ideas instead of replacing them"],res:["R51"],sum:"Use silent brainstorming and round-robins so the first or loudest idea doesn't win by default. Build on ideas ('yes, and') and credit them by name in notes and demos.",
    lesson:{what:"Valuing others' ideas means the best idea wins regardless of who had it. In practice that is a facilitation skill: structure discussions so quiet people contribute, build on ideas instead of replacing them, and credit the owner by name in notes and demos.",
     how:["Gather ideas in silence first (everyone writes for five minutes), then share round-robin so the first or loudest voice doesn't anchor the group.","Respond with 'yes, and': restate the idea, add to it, and ask what the owner would need to try it.","Record ideas with names in the notes and the work item; say who it came from when you present it.","Notice who hasn't spoken and invite them with a specific question, in a way that doesn't put them on the spot (a written channel works).","When your idea loses, say so out loud and support the chosen one; it signals that ideas are judged on merit."],
     terms:[["Anchoring","The first idea stated shapes everything after it; silent writing prevents it."],["Round-robin","Each person speaks once, in turn, before open discussion."],["Yes, and","Build on an idea before evaluating it."]],
     read:[["Atlassian Team Playbook: Disruptive Brainstorming","https://www.atlassian.com/team-playbook/plays/disruptive-brainstorming","Read the play; note the silent, individual idea step. 10 minutes."],["Google re:Work: understand team effectiveness","https://rework.withgoogle.com/en/guides/understanding-team-effectiveness","Read about conversational turn-taking and psychological safety. 15 minutes."]],
     check:["How do you run the idea-gathering part of a retro so everyone contributes?","Describe a time a quieter teammate's idea changed the outcome because you surfaced it.","What do you do when your own idea is rejected?"]}},
   {id:"b",t:"Participates as team lead or member",obj:["Switch between leading and following","Support decisions you didn't make","Deliver your commitments on someone else's project"],res:["R51","R49"],sum:"On someone else's project, learn their goals and process first, raise concerns once with evidence through their process, then support the decision and deliver your part.",
    lesson:{what:"A lead who can also be a good team member is trusted with cross-team work. On someone else's project you follow their process, raise concerns once with evidence, then support the decision and deliver your part on time.",
     how:["Start by learning their goals, constraints and working agreements before suggesting changes.","Raise a concern once, in their forum (design review, PR), with evidence and a small alternative; then let their lead decide.","Support decisions you didn't make, publicly; bring new evidence through their process if something changes.","Deliver your commitments visibly: status in their stand-up, work items updated, no surprises.","Switch modes consciously: leading means deciding and protecting the team; being a member means contributing and not taking over."],
     terms:[["Working agreements","A team's explicit norms for how it works together."],["Ownership boundary","Who gets to decide what; respecting it builds trust across teams."],["Disagree and commit","Argue while the decision is open, then support it fully."]],
     read:[["Atlassian Team Playbook: Working agreements","https://www.atlassian.com/team-playbook/plays/working-agreements","Read the play; use it when you join another team. 10 minutes."],["Amazon leadership principles","https://www.amazon.jobs/content/en/our-workplace/leadership-principles","Read 'Have Backbone; Disagree and Commit' and 'Earn Trust'. 10 minutes."]],
     check:["Tell about a time you were a member, not the lead. How did you contribute?","You think another team's chosen library is a poor fit: what exactly do you do, and when do you stop?","What does good team membership look like from a senior engineer?"]}},
   {id:"c",t:"Builds consensus and trust",obj:["Agree criteria before options","Use DACI to name a decision-maker","Disagree and commit; record the decision"],res:["R51"],sum:"Consensus does not mean unanimity. Agree on criteria, time-box the evaluation, name the approver (DACI), record the decision, and follow up with anyone who disagreed.",
    lesson:{what:"Consensus does not mean everyone agrees; it means everyone can commit. Trust comes from a fair, visible process: agree the criteria before debating options, time-box the evaluation, name who decides (DACI), record the decision, and follow up with those who disagreed.",
     how:["Separate criteria from options: list what matters (team skills, existing code, accessibility, support, cost) and agree it before anyone pitches a solution.","Use DACI: a Driver runs the process, one Approver decides, Contributors give input, Informed people hear the result.","Time-box with a spike or a comparison table and a decision date; a slow decision is also a decision.","Write the decision and its reasons where the whole team can see it (ADR or wiki) and link it to the work.","After the decision, talk 1:1 with anyone who disagreed: acknowledge their points, explain the call, and give them something to own."],
     terms:[["DACI","Driver, Approver, Contributors, Informed."],["Criteria before options","Agreeing how you will judge before you judge."],["Disagree and commit","Full support after a decision you argued against."]],
     read:[["Atlassian Team Playbook: DACI decision-making framework","https://www.atlassian.com/team-playbook/plays/daci","Read the play and the template. 15 minutes."],["Atlassian Team Playbook: Trade-offs","https://www.atlassian.com/team-playbook/plays/trade-offs","Read how to make priorities explicit before deciding. 10 minutes."]],
     check:["Two seniors are deadlocked on a framework: walk through your process to a decision.","Why agree criteria before options?","What do you do when someone disengages after losing a decision?"]}},
   {id:"d",t:"Collaborates toward shared goals",obj:["Find the shared organizational goal","Sequence competing requests openly","Write the agreed plan where both sides can see it"],res:["R51","R42"],sum:"When departments compete for the same team, bring them together, state the goal in terms of customers or operations, tie the order to organizational priorities and hard deadlines, and write down the agreed plan.",
    lesson:{what:"Collaborating toward shared goals means finding the outcome two groups both need, stating it in terms of customers or operations, and sequencing competing requests openly against that goal and the real deadlines, then writing the agreement down where both sides can see it.",
     how:["Name the shared goal in outcome terms (customers get X, the organization passes Y), not in terms of either team's backlog.","Bring the parties together for a short, structured conversation; put the constraints (dates, capacity, dependencies) on the table.","Compare requests against the goal and the hard deadlines; look for creative options that shrink one request (format change, phased delivery).","Agree the order and the plan, then record it in a place both departments can see and link it to the work items.","Report progress to both sides at the same cadence; surprises destroy the agreement."],
     terms:[["Shared goal","An outcome both groups need and can commit to."],["Sequencing","Deciding order explicitly instead of first-come-first-served or loudest wins."],["Goals, signals, measures","A way to state a goal with the signals that show progress and the measures that prove it."]],
     read:[["Atlassian Team Playbook: Goals, Signals, and Measures","https://www.atlassian.com/team-playbook/plays/goals-signals-measures","Read the play; write one shared goal this way. 15 minutes."],["Atlassian Team Playbook: Roles and Responsibilities","https://www.atlassian.com/team-playbook/plays/roles-and-responsibilities","Read the play; useful when two departments share one team. 10 minutes."]],
     check:["Two departments need your team by the same date: how do you frame the choice and what do you write down?","Describe a time you turned competing requests into one plan.","How do you keep both sides informed afterward?"]}},
   {id:"e",t:"Communicates clearly to technical and non-technical audiences",obj:["Explain technical topics in plain language","Lead with the decision needed","Give options with cost and time"],res:["R53","R53b"],sum:"Lead with the impact and the decision needed, use one everyday analogy, give options with cost and time, avoid jargon, and end with the ask and a date.",
    lesson:{what:"Clear communication to technical and non-technical people means the same facts, shaped for each reader: for executives, the impact and the decision first, one everyday analogy, options with cost and time, and a clear ask; for engineers, specifics and links. Plain language is a skill you can practice.",
     how:["Lead with the decision needed or the news; background comes second.","Translate: replace each technical term with what it does for the reader, or one everyday analogy (a certificate is like an ID card that expires).","Give options with cost and time, and a recommendation; let them decide.","Keep sentences under 20 words, use common words and active voice, cut jargon and acronyms.","End with the ask and a date; follow up in writing after a conversation."],
     terms:[["BLUF","Bottom line up front."],["Analogy","A familiar comparison that carries the key property of a technical idea."],["The ask","The specific decision or action you need."]],
     read:[["Google: Technical Writing One","https://developers.google.com/tech-writing/one","Read 'Words', 'Active voice' and 'Short sentences'. 30 minutes."],["plainlanguage.gov: guidelines","https://www.plainlanguage.gov/guidelines/","Read 'Write for your audience' and 'Organize'. 15 minutes."],["digital.gov: plain language guide","https://digital.gov/guides/plain-language","Skim the checklist. 10 minutes."]],
     check:["Explain in under two minutes to a non-technical executive why the organization should invest in automated testing.","Rewrite an outage explanation for a director in 120 words with one analogy and an ask.","What four elements does a decision request contain?"]}},
   {id:"f",t:"Listens actively; shares information across departments",obj:["Paraphrase before responding","Ask one specific clarifying question","Share decisions where everyone affected can see them"],res:["R50","R53"],sum:"Restate the concern and ask a specific question before proposing anything. Post decisions in shared channels and link them to the work item so other departments aren't surprised.",
    lesson:{what:"Active listening means understanding before responding: paraphrase what you heard, ask one specific clarifying question, and hold off on solutions until the other person agrees you've got it. Sharing information across departments means decisions and changes are posted where everyone affected can find them, linked to the work.",
     how:["Give full attention; paraphrase ('So the issue is...') and ask one specific question before proposing anything.","Separate the facts from the frustration; acknowledge the impact on their work.","Agree what you heard and what happens next, with a time.","Post decisions and changes in a shared, searchable place (channel, wiki, work item) and tell the people affected, before they find out the hard way.","Close the loop: when the fix lands, tell the person who raised it, and the other departments that use the thing."],
     terms:[["Paraphrase","Restating in your own words to confirm understanding."],["Clarifying question","A specific question that fills a gap in your understanding, not a leading one."],["Information radiator","A shared place where status and decisions are visible without asking."]],
     read:[["CCL: coaching others with active listening skills","https://www.ccl.org/articles/leading-effectively-articles/coaching-others-use-active-listening-skills/","Read the six skills. 10 minutes."],["GitLab handbook: communication","https://handbook.gitlab.com/handbook/communication/","Read the sections on written, asynchronous communication and single sources of truth. 15 minutes."]],
     check:["A manager says the new portal 'doesn't work': what are your first two sentences?","Where do you post a cross-department decision, and how do you link it to the work?","Describe a time you noticed a teammate's idea was overlooked and what you did."]}}

 ["a","How do you show you value an idea?","Build on it ('yes, and'), credit the person by name, and record it with their name."],
 ["b","Joining another team's project as a member: first step?","Learn their goals and process; raise concerns with evidence in their forum, then support their decision."],
