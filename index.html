      ${res.extra||""}${t.explain?`<p style="margin-bottom:0"><b>Why:</b> ${esc(t.explain)}</p>`:""}</div>
      ${t.model?`<details style="margin-top:10px"><summary>Model answer</summary><p>${esc(t.model)}</p></details>`:""}
      <div class="row" style="margin-top:10px"><a class="btn" href="#/practice">More practice</a>${res.pass?"":`<button class="retry">Try again</button>`}</div>`;
    const rb=$(".retry",out);if(rb)rb.onclick=()=>renderTask(t,box,opts);
    out.scrollIntoView({behavior:"smooth",block:"nearest"});
  };
  const evalChecks=(arr,kind,...args)=>(arr||[]).map(c=>{let ok=false,why="";try{ok=!!c.f(...args);}catch(e){ok=false;why=e.message;}return {l:c.l,ok,kind,why};});
  const fromChecks=(succ,cons,answer)=>{const all=succ.concat(cons);const sOk=succ.filter(c=>c.ok).length;const cOk=cons.every(c=>c.ok);
    let score=succ.length?Math.round(100*sOk/succ.length):100;if(!cOk)score=Math.min(score,50);return {score,pass:sOk===succ.length&&cOk,checks:all,answer};};
  const editor=(starter,rows=14,label="Your answer")=>{const ta=document.createElement("textarea");ta.className="code";ta.spellcheck=false;ta.setAttribute("autocapitalize","off");ta.setAttribute("autocomplete","off");ta.setAttribute("aria-label",label);ta.value=starter||"";ta.rows=rows;
    ta.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey&&!e.ctrlKey){e.preventDefault();const s=ta.selectionStart;ta.setRangeText("  ",s,ta.selectionEnd,"end");}if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();sub.click();}});
    body.appendChild(ta);const rs=document.createElement("button");rs.className="link small";rs.textContent="Reset to starter";rs.onclick=()=>{ta.value=starter||"";};body.appendChild(rs);return ta;};

  if(t.type==="mcq"){
    const order=t.options.map((o,i)=>i);
    body.innerHTML=`<fieldset style="border:none;padding:0;margin:0"><legend class="sr">Options</legend>${order.map(i=>`<label class="opt"><input type="radio" name="o-${t.id}" value="${i}"><span>${esc(t.options[i])}</span></label>`).join("")}</fieldset>`;
    body.addEventListener("change",()=>body.querySelectorAll(".opt").forEach(l=>l.classList.toggle("sel",l.querySelector("input").checked)));
    getRes=()=>{const c=body.querySelector("input:checked");if(!c){flash("Choose an option first.");return null;}const v=+c.value;const ok=v===t.answer;
      return {score:ok?100:0,pass:ok,checks:[{l:ok?"Correct":"Correct answer: "+t.options[t.answer],ok}],answer:t.options[v]};};
  }
  else if(t.type==="pick"){
    body.innerHTML=t.items.map(([k,l])=>`<label class="opt"><input type="checkbox" value="${k}"><span>${esc(l)}</span></label>`).join("")+(t.pts?`<p class="muted small" id="pt-${t.id}">Selected: 0 points</p>`:"");
    body.addEventListener("change",()=>{body.querySelectorAll(".opt").forEach(l=>l.classList.toggle("sel",l.querySelector("input").checked));if(t.pts){const s=[...body.querySelectorAll("input:checked")].reduce((a,c)=>a+t.pts[c.value],0);$("#pt-"+t.id,box).textContent="Selected: "+s+" points";}});
    getRes=()=>{const s=new Set([...body.querySelectorAll("input:checked")].map(c=>c.value));return fromChecks(evalChecks(t.checks,"success",s,t),evalChecks(t.constraints,"constraint",s,t),[...s].join(", "));};
  }
  else if(t.type==="scenario"){
    let step=0,total=0;const picks=[];
    const draw=()=>{const st=t.steps[step];body.innerHTML=`<p class="muted small">Step ${step+1} of ${t.steps.length}</p><p><b>${esc(st.q)}</b></p>`+st.o.map((o,i)=>`<label class="opt"><input type="radio" name="s-${t.id}-${step}" value="${i}"><span>${esc(o[0])}</span></label>`).join("")+`<div class="fb"></div>`;
      body.addEventListener("change",()=>body.querySelectorAll(".opt").forEach(l=>l.classList.toggle("sel",l.querySelector("input").checked)));};
    draw();let showing=false;
    getRes=()=>{const st=t.steps[step];
      if(!showing){const c=body.querySelector("input:checked");if(!c){flash("Choose an option first.");return null;}const o=st.o[+c.value];total+=o[1];picks.push({q:st.q,a:o[0],s:o[1]});
        body.querySelectorAll("input").forEach(x=>x.disabled=true);
        if(!mock)$(".fb",body).innerHTML=`<div class="result ${o[1]>=3?"ok":"bad"}"><b>${o[1]}/3.</b> ${esc(o[2])}</div>`;
        showing=true;sub.textContent=step<t.steps.length-1?"Next step":"Finish";if(mock){showing=false;step++;if(step<t.steps.length){draw();sub.textContent="Next";return null;}}else return null;}
      else{showing=false;step++;if(step<t.steps.length){draw();sub.textContent="Next";return null;}}
      const score=Math.round(100*total/(3*t.steps.length));
      return {score,pass:score>=70,checks:picks.map(p=>({l:p.q+" \u2192 "+p.a+" ("+p.s+"/3)",ok:p.s>=3})),answer:picks.map(p=>p.a).join(" | ")};};
  }
  else if(t.type==="code"){
    if(t.harness)body.insertAdjacentHTML("beforeend",`<details><summary class="small">Provided helpers</summary><pre>${esc(t.harness)}</pre></details>`);
    const ta=editor(t.starter,16,"Code editor");
    body.insertAdjacentHTML("beforeend",`<p class="small muted">Runs in your browser. TypeScript is compiled with the official compiler (loaded on first run). Tests check behavior, not types.</p>`);
    getRes=async()=>{sub.disabled=true;sub.textContent="Running\u2026";
      const c=await compileTS(ta.value);
      const r=await runInWorker((t.harness||"")+c.js,t.tests.map(x=>x[1]));
      sub.disabled=false;sub.textContent="Check";
      let checks;if(!r.ok)checks=t.tests.map(x=>({l:x[0],ok:false,kind:"success",why:r.error}));
      else checks=r.R.map(([i,ok,err])=>({l:t.tests[i][0],ok,kind:"success",why:err||""}));
      const res=fromChecks(checks,[],ta.value);
      res.extra=(c.diags.length?`<p class="small"><b>Compiler notes:</b> ${esc(c.diags.slice(0,3).join("; "))}</p>`:"")+(!c.compiled?`<p class="small">The TypeScript compiler couldn't load (offline?), so a simple type-stripper was used.</p>`:"")+(r.logs&&r.logs.length?`<p class="small"><b>console.log:</b></p><div class="term">${esc(r.logs.slice(0,20).join("\n"))}</div>`:"")+(!r.ok?`<p class="small"><b>Error:</b> ${esc(r.error)}</p>`:"");
      return res;};
  }
  else if(t.type==="form"){
    body.innerHTML=t.fields.map(([k,l,kind])=>{const id="f-"+t.id+"-"+k;
      if(kind.startsWith("select:"))return `<label style="margin-top:8px" for="${id}">${esc(l)}<select id="${id}" data-k="${k}"><option value="">Choose…</option>${kind.slice(7).split("|").map(o=>`<option>${esc(o)}</option>`).join("")}</select></label>`;
      if(kind==="textarea")return `<label style="margin-top:8px" for="${id}">${esc(l)}<textarea id="${id}" data-k="${k}" style="min-height:80px"></textarea></label>`;
      return `<label style="margin-top:8px" for="${id}">${esc(l)}<input type="text" id="${id}" data-k="${k}"></label>`;}).join("");
    getRes=()=>{const v={};body.querySelectorAll("[data-k]").forEach(e=>v[e.dataset.k]=e.value||"");
      return fromChecks(evalChecks(t.checks,"success",v),evalChecks(t.constraints,"constraint",v),JSON.stringify(v));};
  }
  else if(t.type==="yaml"||t.type==="json"||t.type==="xml"||t.type==="html"){
    const ta=editor(t.starter,18,t.type.toUpperCase()+" editor");
    getRes=()=>{const raw=ta.value;let obj;
      try{ if(t.type==="yaml")obj=parseYAML(raw);
        else if(t.type==="json")obj=JSON.parse(raw);
        else if(t.type==="html")obj=new DOMParser().parseFromString("<!doctype html><html><body>"+raw+"</body></html>","text/html");
        else{obj=new DOMParser().parseFromString(raw,"application/xml");const pe=obj.getElementsByTagName("parsererror")[0];if(pe)throw new Error("XML is not well-formed: "+pe.textContent.replace(/\s+/g," ").slice(0,160));}
      }catch(e){return {score:0,pass:false,checks:[{l:"Parses as valid "+t.type.toUpperCase(),ok:false,why:e.message}],answer:raw};}
      return fromChecks(evalChecks(t.checks,"success",obj,raw),evalChecks(t.constraints,"constraint",obj,raw),raw);};
  }
  else if(t.type==="cmd"){
    const ta=editor("",6,"Commands, one per line");ta.placeholder=t.init==="git"?"git status":"tf status";
    body.insertAdjacentHTML("beforeend",`<div class="term" style="margin-top:8px" id="term-${t.id}">${t.init==="git"?"On branch main\nChanges not staged for commit:\n  modified: src/PermitSearch.cs":"$/Permits/Main  (TFVC workspace)\nPending changes: 1 edit"}</div>`);
    getRes=()=>{const {state,out:o}=runCommands(ta.value,t.init);$("#term-"+t.id,box).textContent=o.join("\n")||"(no commands)";
      return fromChecks(evalChecks(t.checks,"success",state),evalChecks(t.constraints,"constraint",state),ta.value);};
  }
  else if(t.type==="http"){
    body.innerHTML=`<div class="row"><label style="width:130px">Method<select class="hm">${["GET","POST","PUT","PATCH","DELETE","HEAD","OPTIONS"].map(x=>`<option>${x}</option>`).join("")}</select></label><label class="grow">URL or path<input type="text" class="hu" value="/api/" autocapitalize="off" spellcheck="false"></label></div>
     <label style="margin-top:8px">Headers (one per line, Name: value)<textarea class="code hh" style="min-height:90px" spellcheck="false" autocapitalize="off"></textarea></label>
     <label style="margin-top:8px">Body<textarea class="code hb" style="min-height:90px" spellcheck="false" autocapitalize="off"></textarea></label>`;
    getRes=()=>{const r=parseReq($(".hm",body).value,$(".hu",body).value,$(".hh",body).value,$(".hb",body).value);
      const res=fromChecks(evalChecks(t.checks,"success",r),evalChecks(t.constraints,"constraint",r),r.method+" "+r.path);
      if(r.jsonErr)res.checks.push({l:"Body is valid JSON",ok:false,why:r.jsonErr});
      res.extra=`<pre>${esc(r.method+" "+r.path+" HTTP/1.1\n"+Object.entries(r.h).map(([k,v])=>k+": "+v).join("\n")+(r.body?"\n\n"+r.body:""))}</pre>`;return res;};
  }
  else if(t.type==="rest"){
    const statuses=["200","201","202","204","400","401","403","404","409","422","500"];
    body.innerHTML=t.rows.map((r,i)=>`<div class="restrow"><span>${esc(r[0])}</span><select aria-label="Method for ${esc(r[0])}" class="rm" data-i="${i}">${["GET","POST","PUT","PATCH","DELETE"].map(x=>`<option>${x}</option>`).join("")}</select><input type="text" aria-label="Path for ${esc(r[0])}" class="rp" data-i="${i}" value="/api/permits" autocapitalize="off" spellcheck="false"><select aria-label="Status for ${esc(r[0])}" class="rs" data-i="${i}">${statuses.map(x=>`<option>${x}</option>`).join("")}</select></div>`).join("");
    getRes=()=>{const checks=t.rows.map((r,i)=>{const mth=body.querySelector(`.rm[data-i="${i}"]`).value,p=body.querySelector(`.rp[data-i="${i}"]`).value.trim(),st=body.querySelector(`.rs[data-i="${i}"]`).value;
      const errs=[];if(mth!==r[1])errs.push("method");if(!r[2].test(p))errs.push("path");if(!r[3].includes(st))errs.push("status");if(/(get|create|delete|update|add|remove)/i.test(p.replace(/^\/api\//,"")))errs.push("verb in path");
      return {l:r[0]+(errs.length?" \u2192 expected "+r[1]+", status "+r[3].join(" or "):""),ok:!errs.length,kind:"success",why:errs.length?"check: "+errs.join(", "):""};});
      return fromChecks(checks,[],"rest table");};
  }
  else if(t.type==="write"){
    const ta=document.createElement("textarea");ta.setAttribute("aria-label","Your answer");ta.style.minHeight="180px";body.appendChild(ta);
    const wc=document.createElement("p");wc.className="small muted";wc.textContent="0 words";body.appendChild(wc);ta.oninput=()=>{wc.textContent=words(ta.value)+" words";};
    body.insertAdjacentHTML("beforeend",`<p style="margin-bottom:4px"><b>Self-check</b> (tick what's true after reading the model answer, shown when you check):</p>`+t.checklist.map((c,i)=>`<label class="opt"><input type="checkbox" data-c="${i}"><span>${esc(c)}</span></label>`).join(""));
    let stage=0,autoRes=null;
    getRes=()=>{ if(!ta.value.trim()){flash("Write your answer first.");return null;}
      if(stage===0){autoRes=evalChecks(t.auto,"success",ta.value);stage=1;
        out.innerHTML=`<div class="result"><b>Automatic checks</b><ul class="checks">${autoRes.map(c=>`<li class="${c.ok?"ok":"bad"}">${esc(c.l)}</li>`).join("")}</ul><p><b>Model answer:</b> ${esc(t.model)}</p><p class="small">Now tick the self-check boxes above that your answer meets, then press <b>Finish</b>.</p></div>`;
        sub.textContent="Finish";if(!mock)return null;}
      const ticks=[...body.querySelectorAll("input[data-c]")].filter(x=>x.checked).length;
      const a=autoRes.filter(c=>c.ok).length/autoRes.length,b=ticks/t.checklist.length;const score=Math.round(100*(0.5*a+0.5*b));
      return {score,pass:score>=70,checks:autoRes.concat([{l:"Self-check: "+ticks+" of "+t.checklist.length,ok:b>=0.75,kind:"success"}]),answer:ta.value};};
  }
  sub.onclick=async()=>{const r=await getRes();if(r)finish(r);};
}

// ---------- review ----------
function viewReview(m,filter){
  const queue=shuffle(dueCards(filter),seededRand(todayStr()+(filter||"")));
  m.insertAdjacentHTML("beforeend",`<h2>Review${filter?": "+esc(filter):""}</h2><p class="muted">Spaced repetition. Rate how well you knew each answer; cards you miss come back sooner.</p><div id="rv"></div>`);
  let idx=0;const box=$("#rv");
  const draw=()=>{
    if(idx>=queue.length){box.innerHTML=`<div class="card"><b>All done for now.</b><p class="muted">${filter?"":"Next cards are due tomorrow. New cards are limited to 12 a day."}</p><a class="btn primary" href="#/today">Back to Today</a></div>`;return;}
    const c=queue[idx];
    box.innerHTML=`<div class="card"><div class="row"><span class="pill">${esc(c.item)}</span><span class="muted small grow">${ITEM[c.item]?esc(ITEM[c.item].t):""}</span><span class="muted small">${idx+1} / ${queue.length}</span></div>
      <p class="flipq">${esc(c.q)}</p><div class="ans"></div><div class="row act"><button class="primary show">Show answer</button></div></div>`;
    $(".show",box).onclick=()=>{ $(".ans",box).innerHTML=`<p style="white-space:pre-wrap">${esc(c.a)}</p>`;
      $(".act",box).innerHTML=[["Again",1],["Hard",3],["Good",4],["Easy",5]].map(([l,q])=>`<button data-q="${q}" class="${q===4?"primary":""}">${l}</button>`).join("");
      $(".act",box).querySelectorAll("button").forEach(b=>b.onclick=()=>{const q=+b.dataset.q;gradeCard(c,q);if(q===1)queue.push(c);idx++;draw();});};
  };
  draw();
}

// ---------- mock interview ----------
const SITUATIONAL_RUBRIC = ["Clarifies the goal, constraints and who is affected","Names concrete first steps, in order","Covers the people side (stakeholders, team, communication)","Says how success will be measured","Links clearly to the posting item(s) or competency"];
function starForm(box,prompt,onSave){
  const sit=prompt.kind==="situational";const rub=sit?SITUATIONAL_RUBRIC:STAR_RUBRIC;
  box.innerHTML=`<div class="card"><div class="row"><span class="pill">${sit?"Situational":"Behavioral (STAR)"}</span><span class="pill">${prompt.tags.join(", ")}</span><span class="grow"></span><span class="pill" id="tmr">2:00 planning</span></div>
   <p class="flipq">${esc(prompt.q)}</p>
   <p class="small muted">${sit?"A 'what would you do' question. Plan for up to 2 minutes, write your approach, say it out loud, then score it.":"Plan for up to 2 minutes, then write short notes for each part. Say it out loud before you score it."}</p>
   ${(sit?[["Approach","S",160],["How you'd measure success","R",70]]:[["Situation","S",70],["Task","T",70],["Action","A",120],["Result","R",70]]).map(([k,code,h])=>`<label style="margin-top:8px"><b>${k}</b><textarea data-k="${code}" style="min-height:${h}px"></textarea></label>`).join("")}
   <p style="margin:12px 0 4px"><b>Score your answer</b></p>${rub.map((r,i)=>`<label class="opt"><input type="checkbox" data-r="${i}"><span>${esc(r)}</span></label>`).join("")}
   <div class="row" style="margin-top:12px"><button class="primary sv">Save to story bank</button></div></div>`;
  let left=120;const tm=$("#tmr",box);const iv=setInterval(()=>{if(!document.body.contains(tm)){clearInterval(iv);return;}left--;tm.textContent=left>0?Math.floor(left/60)+":"+String(left%60).padStart(2,"0")+" planning":"Answer now";if(left<=0)clearInterval(iv);},1000);
  $(".sv",box).onclick=()=>{const g=k=>{const e=box.querySelector(`textarea[data-k="${k}"]`);return e?e.value.trim():"";};
    if(!g("S")&&!g("A")&&!g("R")){flash("Add a few notes first.");return;}
    const score=[...box.querySelectorAll("input[data-r]")].filter(x=>x.checked).length;
    S.stories.unshift({id:"s"+Date.now(),d:todayStr(),kind:prompt.kind||"star",q:prompt.q,tags:prompt.tags,S:g("S"),T:g("T"),A:g("A"),R:g("R"),score});
    prompt.tags.forEach(id=>{S.starBest[id]=Math.max(S.starBest[id]||0,score);addEvidence(id,score*20,0.5);});
    markDay("star");save();clearInterval(iv);onSave&&onSave(score);};
}
function viewMock(m,arg){
  if(arg&&arg.startsWith("star-")){const p=STAR.find(s=>s.id===arg.slice(5));if(!p){m.textContent="Prompt not found.";return;}
    m.insertAdjacentHTML("beforeend",`<p class="small"><a href="#/mock">\u2190 Mock Interview</a></p><h2>STAR practice</h2><div id="sb"></div>`);
    starForm($("#sb"),p,score=>{$("#sb").innerHTML=`<div class="card"><b>Saved.</b> You scored ${score}/5. ${score>=3?"That counts toward Ready for "+p.tags.join(", ")+".":"Aim for 3 or more: add a measured result and say what you learned."}<div class="row" style="margin-top:10px"><a class="btn primary" href="#/today">Back to Today</a><a class="btn" href="#/progress">Story bank</a></div></div>`;});return;}
  if(mockSession){drawMock(m);return;}
  m.insertAdjacentHTML("beforeend",`<h2>Mock Interview</h2>
   <div class="card"><h3 style="margin-top:0">Technical round</h3><p>8 graded tasks across C#/TypeScript, HTTP/REST, CI/CD, Azure/IIS and security. 25 minutes. No hints; results at the end.</p><button class="primary" id="mt">Start technical round</button></div>
   <div class="card"><h3 style="margin-top:0">Behavioral round</h3><p>Six prompts: STAR and situational questions mapped to the posting's skills and the ${COMPETENCIES.map(c=>'"'+esc(c.name)+'"').join(" and ")} ${COMPETENCIES.length===1?"competency":"competencies"}, always including ${COMPETENCIES.length===1?"its":"their"} must-ask question${STAR.filter(s=>s.always).length===1?"":"s"}. Score each with the rubric.</p><button class="primary" id="mb">Start behavioral round</button></div>
   <div class="card"><h3 style="margin-top:0">All interview prompts (${STAR.length})</h3><div class="tasklist">${STAR.map(s=>`<a href="#/mock/star-${s.id}"><span>${esc(s.q)}<br><span class="muted small">${s.tags.join(", ")}</span></span><span>Answer</span></a>`).join("")}</div></div>`);
  $("#mt").onclick=()=>{const pool=shuffle(TASKS.filter(t=>!["scenario","write"].includes(t.type)));const pick=[];const seen=new Set();
    for(const t of pool){if(pick.length>=8)break;if(seen.has(t.ksa[0]))continue;seen.add(t.ksa[0]);pick.push(t);}
    mockSession={kind:"tech",tasks:pick,i:0,results:[],end:Date.now()+25*60000};drawMock(m);};
  $("#mb").onclick=()=>{const must=STAR.filter(s=>s.always);const others=shuffle(STAR.filter(s=>!s.always)).slice(0,Math.max(0,6-must.length));
    mockSession={kind:"beh",prompts:others.concat(must),i:0,scores:[]};drawMock(m);};
}
function drawMock(m){
  const s=mockSession;m.innerHTML="";
  if(s.kind==="tech"){
    if(s.i>=s.tasks.length||Date.now()>s.end){const tot=s.results.length?Math.round(s.results.reduce((a,r)=>a+r.score,0)/s.tasks.length):0;
      m.insertAdjacentHTML("beforeend",`<h2>Technical round: results</h2><div class="card"><p><b>Overall ${tot}%</b> ${Date.now()>s.end&&s.i<s.tasks.length?"(time ran out)":""}</p><div class="tablewrap"><table><tr><th>Task</th><th>Items</th><th>Score</th></tr>${s.tasks.map((t,k)=>{const r=s.results[k];return `<tr><td><a href="#/task/${t.id}">${esc(t.title)}</a></td><td>${t.ksa.join(", ")}</td><td>${r?`<span class="pill ${r.pass?"ok":"bad"}">${r.score}%</span>`:"Skipped"}</td></tr>`;}).join("")}</table></div>
      <p class="small muted">Open any task to see its checks and explanation.</p><div class="row"><button class="primary" id="again">New round</button><button id="mockdone">Done</button></div></div>`);
      $("#again").onclick=()=>{mockSession=null;route();setTimeout(()=>$("#mt")&&$("#mt").click(),0);};$("#mockdone").onclick=()=>{mockSession=null;route();};return;}
    const left=Math.max(0,Math.round((s.end-Date.now())/1000));
    m.insertAdjacentHTML("beforeend",`<div class="row"><h2 class="grow" style="margin:0">Technical round</h2><span class="pill">Task ${s.i+1} of ${s.tasks.length}</span><span class="pill" id="mclock">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span><button class="link" id="skip">Skip</button></div><div id="mbox" style="margin-top:12px"></div>`);
    const ck=$("#mclock");const iv=setInterval(()=>{if(!document.body.contains(ck)){clearInterval(iv);return;}const l=Math.max(0,Math.round((s.end-Date.now())/1000));ck.textContent=Math.floor(l/60)+":"+String(l%60).padStart(2,"0");if(l<=0){clearInterval(iv);drawMock(m);}},1000);
    $("#skip").onclick=()=>{s.i++;drawMock(m);};
    renderTask(s.tasks[s.i],$("#mbox"),{mock:true,onDone:r=>{s.results[s.i]=r;s.i++;flash("Saved.");drawMock(m);}});
  } else {
    if(s.i>=s.prompts.length){const avg=s.scores.length?(s.scores.reduce((a,b)=>a+b,0)/s.scores.length).toFixed(1):0;
      m.insertAdjacentHTML("beforeend",`<h2>Behavioral round: results</h2><div class="card"><p><b>Average ${avg} / 5</b></p><ul>${s.prompts.map((p,k)=>`<li>${esc(p.q)} \u2014 <b>${s.scores[k]!==undefined?s.scores[k]+"/5":"skipped"}</b></li>`).join("")}</ul><p class="small muted">Your answers are in the story bank on the Progress page.</p><button class="primary" id="mockdone">Done</button></div>`);$("#mockdone").onclick=()=>{mockSession=null;route();};return;}
    m.insertAdjacentHTML("beforeend",`<div class="row"><h2 class="grow" style="margin:0">Behavioral round</h2><span class="pill">Prompt ${s.i+1} of ${s.prompts.length}</span><button class="link" id="skip">Skip</button></div><div id="mbox" style="margin-top:12px"></div>`);
    $("#skip").onclick=()=>{s.i++;drawMock(m);};
    starForm($("#mbox"),s.prompts[s.i],score=>{s.scores[s.i]=score;s.i++;drawMock(m);});
  }
}

// ---------- progress ----------
function viewProgress(m){
  const ready=POSTING.filter(i=>isReady(i.id)).length;const avg=Math.round(POSTING.reduce((a,i)=>a+mastery(i.id),0)/POSTING.length);
  const noEvidence=ITEMS.filter(i=>!(S.ev[i.id]||[]).length).length;
  const cls=v=>v>=80?"m4":v>=60?"m3":v>=30?"m2":v>0?"m1":"";
  m.insertAdjacentHTML("beforeend",`<h2>Progress</h2>
   <div class="row" style="margin-bottom:12px"><div class="stat"><span class="muted small">Posting items Ready</span><b>${ready} / ${POSTING.length}</b></div><div class="stat"><span class="muted small">Average mastery</span><b>${avg}%</b></div><div class="stat"><span class="muted small">No evidence yet</span><b>${noEvidence}</b></div><div class="stat"><span class="muted small">Streak</span><b>${dayWord(streak())}</b></div></div>
   <div class="card"><h3 style="margin-top:0">Coverage grid: every posting item, plus supporting topics</h3><p class="small muted">Color shows mastery; a green border means Ready. Select an item to open its module.</p>
   ${GROUPS.flatMap(g=>groupSections(g)).map(sec=>`<p style="margin:12px 0 6px"><b>${esc(sec.h)}</b></p><div class="grid">${sec.items.map(i=>{const v=mastery(i.id);return `<a class="cell ${cls(v)} ${isReady(i.id)?"ready":""}" href="#/module/${i.id}"><div class="id">${i.id}${isReady(i.id)?" \u2713":""}${fading(i.id)?" \u00B7 fading":""}</div><div class="t">${esc(i.t)}</div><div class="pct">${v}% \u00B7 ${S.passed[i.id]?"pass":"no pass"} \u00B7 STAR ${S.starBest[i.id]||0}/5</div></a>`;}).join("")}</div>`).join("")}</div>
   <div class="card"><h3 style="margin-top:0">Mistakes log (${S.mistakes.length})</h3>${S.mistakes.length?`<label>Filter by item<select id="mf"><option value="">All</option>${ITEMS.map(i=>`<option value="${i.id}">${i.id}</option>`).join("")}</select></label><div id="ml" class="tasklist"></div>`:'<p class="muted">No mistakes yet. Failed checks land here with an explanation and a retry link.</p>'}</div>
   <div class="card"><h3 style="margin-top:0">Story bank (${S.stories.length})</h3>${S.stories.length?S.stories.slice(0,30).map(s=>`<details style="border-bottom:1px solid var(--line);padding:8px 0"><summary>${esc(s.q)} <span class="pill">${s.tags.join(", ")}</span> <span class="pill ${s.score>=3?"ok":""}">${s.score}/5</span></summary>${s.kind==="situational"?`<p><b>Approach:</b> ${esc(s.S)}<br><b>Measure:</b> ${esc(s.R)}</p>`:`<p><b>S:</b> ${esc(s.S)}<br><b>T:</b> ${esc(s.T)}<br><b>A:</b> ${esc(s.A)}<br><b>R:</b> ${esc(s.R)}</p>`}<button class="link small" data-del="${s.id}">Delete</button></details>`).join(""):'<p class="muted">Answer STAR prompts to build your story bank.</p>'}</div>
   <div class="card"><h3 style="margin-top:0">14-week study plan</h3><div class="tablewrap"><table><tr><th>Week</th><th>Focus</th><th>Read</th><th>Milestone</th></tr>${PLAN.map(p=>`<tr style="${p[0]===Math.min(studyWeek(),14)?"background:var(--bg)":""}"><td>${p[0]}</td><td>${p[1].map(id=>`<a href="#/module/${id}">${id}</a>`).join(", ")}</td><td>${esc(p[2])}</td><td>${esc(p[4])}</td></tr>`).join("")}</table></div>
   <label style="margin-top:10px;max-width:240px">Plan start date<input type="date" id="sd" value="${esc(S.start)}"></label></div>
   <div class="card"><h3 style="margin-top:0">Your data</h3><p class="small muted">Progress is saved in this browser only. Export a file to back it up or move it to another device.</p>
   <div class="row"><button id="ex">Export progress</button><label class="btn" for="imf">Import progress</label><input type="file" id="imf" accept="application/json,.json" class="sr"><button id="rs">Reset everything</button></div></div>`);
  const drawML=()=>{const f=$("#mf")?$("#mf").value:"";const l=S.mistakes.filter(x=>{const t=TASKS.find(y=>y.id===x.task);return !f||(t&&t.ksa.includes(f));}).slice(0,40);
    if($("#ml"))$("#ml").innerHTML=l.map(x=>`<a href="#/task/${x.task}"><span><b>${esc(x.title)}</b> <span class="muted small">${esc(x.d)}</span><br><span class="small">Failed: ${esc(x.check)}</span>${x.ex?`<br><span class="small muted">${esc(x.ex)}</span>`:""}</span><span>Retry</span></a>`).join("")||'<p class="muted">None for this item.</p>';};
  if($("#mf")){$("#mf").onchange=drawML;drawML();}
  m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Delete this story?")){S.stories=S.stories.filter(s=>s.id!==b.dataset.del);save();route();}});
  $("#sd").onchange=e=>{if(e.target.value){S.start=e.target.value;save();flash("Start date saved.");}};
  $("#ex").onclick=()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lead-swe-study-progress-"+todayStr()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};
  $("#imf").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||o.v!==1||typeof o.ev!=="object")throw new Error("Not a Lead SWE Study export.");if(!confirm("Replace your current progress with this file?"))return;S=Object.assign(freshState(),o);save();flash("Progress imported.");route();}catch(err){alert("Import failed: "+err.message);}};rd.readAsText(f);};
  $("#rs").onclick=()=>{if(confirm("Erase all progress in this browser? Export first if you want a backup.")){S=freshState();save();route();}};
}

// ---------- first run ----------
function firstRun(){
  if(S.seenIntro)return;
  const m=$("#main");
  m.innerHTML=`<div class="card" style="max-width:640px;margin:24px auto"><h2>Welcome to Lead SWE Study</h2>
   <p>This tool prepares you for a <b>Lead Software Engineer</b> role, using a real job posting as the example. Every requirement in the example posting (${POSTING.length} items, from C# and IIS to mentoring and teamwork) has a module, graded practice, review cards and interview prompts, plus ${ITEMS.length-POSTING.length} supporting topics such as accessibility, data retention and change management.</p>
   <ol><li><b>Today</b>: a 10-minute daily session: review cards, one task, one STAR answer.</li><li><b>Practice</b>: graded on results: tests pass, the HTTP request is right, the YAML and IIS config check out.</li><li><b>Progress</b>: mastery for every item. An item is Ready at 80% mastery with a graded pass and a STAR answer scored 3 or higher.</li></ol>
   <p class="small muted">Everything stays in this browser. Export from Progress to back up.</p>
   <label style="max-width:240px">Start date of your 14-week plan<input type="date" id="fsd" value="${todayStr()}"></label>
   <div class="row" style="margin-top:12px"><button class="primary" id="go">Start</button></div></div>`;
  $("#go").onclick=()=>{S.start=$("#fsd").value||todayStr();S.seenIntro=true;save();route();};
}

// ---------- installable app (PWA) ----------
// Works as a plain file too: the service worker only registers over http(s).
let deferredInstall=null;
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isIOSSafari=()=>isIOS()&&/safari/i.test(navigator.userAgent)&&!/crios|fxios|edgios|opios|gsa\//i.test(navigator.userAgent);
function installCardHTML(){
  if(isStandalone()||S.hideInstall)return "";
  if(isIOS()){
    return `<div class="card" id="installcard"><div class="row"><h3 style="margin:0" class="grow">Install on your iPhone</h3><button class="link" data-hideinstall>Dismiss</button></div>
      <p style="margin:8px 0 0">${isIOSSafari()?"Tap the <b>Share</b> button (square with an arrow) in Safari, then <b>Add to Home Screen</b>. The app then opens full screen and works offline.":"Open this page in <b>Safari</b>, tap <b>Share</b>, then <b>Add to Home Screen</b>. Other iPhone browsers may not offer it."}</p></div>`;
  }
  if(deferredInstall){
    return `<div class="card" id="installcard"><div class="row"><span class="grow">Install Lead SWE Study as an app for offline use.</span><button class="primary" data-install>Install</button><button class="link" data-hideinstall>Dismiss</button></div></div>`;
  }
  return "";
}
function wireInstallCard(root){
  root.querySelectorAll("[data-hideinstall]").forEach(b=>b.onclick=()=>{S.hideInstall=true;save();const c=$("#installcard");if(c)c.remove();});
  root.querySelectorAll("[data-install]").forEach(b=>b.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;const c=$("#installcard");if(c)c.remove();});
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if((location.hash||"#/today").startsWith("#/today"))route();});
window.addEventListener("appinstalled",()=>{deferredInstall=null;flash("Installed. Open Lead SWE Study from your home screen or app list.");});
function updateNetPill(){const off=!navigator.onLine;["#netpill","#netpill2"].forEach(s=>{const p=$(s);if(p)p.hidden=!off;});}
window.addEventListener("online",updateNetPill);window.addEventListener("offline",updateNetPill);
function showUpdateBar(reg){
  if($("#updatebar"))return;
  const bar=document.createElement("div");bar.id="updatebar";bar.className="flash";bar.style.display="flex";bar.style.gap="10px";bar.style.alignItems="center";bar.setAttribute("role","status");
  bar.innerHTML=`<span>A new version is ready.</span><button class="primary" style="min-height:36px;padding:4px 12px">Reload</button>`;
  bar.querySelector("button").onclick=()=>{if(reg.waiting)reg.waiting.postMessage("SKIP_WAITING");else location.reload();};
  document.body.appendChild(bar);
}
function registerSW(){
  if(!("serviceWorker" in navigator)||!/^https?:$/.test(location.protocol))return;
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdateBar(reg);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)showUpdateBar(reg);});});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(err=>console.warn("Service worker not registered:",err&&err.message));
}

// ---------- self-check (dev) ----------
function selfCheck(){const missing=ITEMS.filter(i=>!TASKS.some(t=>t.ksa.includes(i.id))||CARDS.filter(c=>c.item===i.id).length<2||!STAR.some(s=>s.tags.includes(i.id))).map(i=>i.id);if(missing.length)console.warn("Coverage gaps:",missing);else console.log("Coverage OK: all",ITEMS.length,"items have tasks, 2+ cards and a STAR prompt. Tasks:",TASKS.length,"Cards:",CARDS.length);
  const thin=compItemIds().filter(id=>CARDS.filter(c=>c.item===id).length<3||STAR.filter(s=>s.tags.includes(id)).length<2||!TASKS.some(t=>t.ksa.includes(id)&&t.type!=="write"));if(thin.length)console.warn("Competency behaviors needing 3 cards, 2 prompts and a graded task:",thin);
  const dupIds=a=>a.map(x=>x.id).filter((x,i,arr)=>arr.indexOf(x)!==i);const d=[...dupIds(ITEMS),...dupIds(TASKS),...dupIds(STAR),...dupIds(CARDS)];if(d.length)console.warn("Duplicate ids:",d);}
selfCheck();
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea,select"))return;});
if(!S.seenIntro){$("#sidelinks").innerHTML=navHTML("today");$("#bottomlinks").innerHTML=navHTML("today");firstRun();}else route();
updateNetPill();
registerSW();
</script>
