<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--text:#1d2330;--muted:#5b6474;--line:#dde1e7;
  --accent:#1f5fbf;--accent-ink:#ffffff;--ok:#1d7a46;--ok-bg:#e5f4ea;--bad:#b3261e;--bad-bg:#fbe9e7;
  --warn:#8a5a00;--warn-bg:#fff4dc;--code:#f0f2f5;--focus:#ffbf47;
  --m0:#e3e6eb;--m1:#f6d5cf;--m2:#fbe7b5;--m3:#cfe8d6;--m4:#8fd1a6;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11141a;--panel:#1a1f27;--text:#e7eaf0;--muted:#a3abb9;--line:#2c3340;
    --accent:#6ea8ff;--accent-ink:#0b1220;--ok:#6fd39a;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1c1a;
    --warn:#ffd27a;--warn-bg:#3a2e12;--code:#232a35;
    --m0:#2a313d;--m1:#5a2d29;--m2:#5c4a1c;--m3:#245236;--m4:#2f7d4f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:flex;min-height:100vh}
nav.side{display:none}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:650}
header.top .sub{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
[hidden]{display:none!important}
#updatebar{bottom:76px}
@media (min-width:900px){#updatebar{bottom:24px}}
@media (display-mode: standalone){header.top{padding-top:max(10px,env(safe-area-inset-top))}}
main{flex:1;min-width:0;padding:16px 16px 96px;max-width:980px;margin:0 auto;width:100%}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a,nav.side a{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:56px;text-decoration:none;color:var(--muted);font-size:12px;gap:2px}
nav a .ic{font-size:18px;line-height:1}
nav a.active{color:var(--accent);font-weight:650}
@media (min-width:900px){
  nav.bottom{display:none}
  nav.side{display:flex;flex-direction:column;width:210px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:12px 8px}
  nav.side .brand{font-weight:700;padding:8px 12px 16px;font-size:17px}
  nav.side a{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px;min-height:44px;border-radius:8px;font-size:15px}
  nav.side a.active{background:var(--bg)}
  nav.side .foot{margin-top:auto;color:var(--muted);font-size:12px;padding:12px}
  header.top{display:none}
  main{padding:24px 32px 48px}
}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:17px;margin:20px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
button,.btn{font:inherit;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
button.link{border:none;background:none;color:var(--accent);padding:4px 6px;min-height:32px}
input[type=text],input[type=date],select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:120px;resize:vertical}
textarea.code,pre,code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:13.5px}
textarea.code{min-height:240px;white-space:pre;tab-size:2;background:var(--code)}
pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto;margin:8px 0;white-space:pre}
code{background:var(--code);padding:1px 5px;border-radius:4px}
label{display:block}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--panel)}
.opt input{margin-top:4px;width:18px;height:18px;flex-shrink:0}
.opt.sel{border-color:var(--accent)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.checks{list-style:none;padding:0;margin:8px 0}
.checks li{padding:6px 0 6px 28px;position:relative;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:none}
.checks li::before{position:absolute;left:4px;top:6px;font-weight:700}
.checks li.ok::before{content:"\2713";color:var(--ok)}
.checks li.bad::before{content:"\2717";color:var(--bad)}
.result{border-radius:8px;padding:12px;margin-top:12px}
.result.ok{background:var(--ok-bg)}
.result.bad{background:var(--bad-bg)}
.hint{background:var(--warn-bg);color:var(--text);border-radius:8px;padding:8px 12px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cell{display:block;text-decoration:none;color:var(--text);border-radius:8px;padding:10px;background:var(--m0);min-height:74px;border:1px solid transparent}
.cell .id{font-weight:700;font-size:13px}
.cell .t{font-size:12.5px;line-height:1.3;margin-top:2px}
.cell .pct{font-size:12px;margin-top:4px;color:var(--muted)}
.cell.m1{background:var(--m1)}.cell.m2{background:var(--m2)}.cell.m3{background:var(--m3)}.cell.m4{background:var(--m4)}
.cell.ready{border-color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--m0);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
.tablewrap{overflow-x:auto}
.stat{display:flex;flex-direction:column;padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:0;flex:1 1 0}
.stat b{font-size:20px}
@media (max-width:520px){.stat{padding:8px}.stat b{font-size:17px}.stat .small{font-size:11.5px;line-height:1.25}}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-size:14px;max-width:90vw}
@media (min-width:900px){.flash{bottom:24px}}
.term{background:#0f1419;color:#d6dde6;border-radius:8px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap;max-height:260px;overflow:auto}
.restrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
@media (min-width:700px){.restrow{grid-template-columns:2fr 110px 2fr 110px;align-items:center}}
.kbd{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-bg);padding:10px 12px;border-radius:8px;margin-bottom:12px}
.tasklist a{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.tasklist a:last-child{border-bottom:none}
.flipq{font-size:18px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

 {id:"K7",g:"Knowledge",t:"Azure cloud infrastructure",obj:["Resource groups, App Service, Functions, SQL, Storage, VNets","Key Vault, managed identity, RBAC","Monitoring and cost"],res:["R4","R5","R7","R8","R9","R10","R12"],sum:"Secrets belong in Key Vault, read by a managed identity, never in app settings or code. Know App Service plans, deployment slots and Application Insights."},
 {id:"K8",g:"Knowledge",t:"IIS administration, configuration, management",obj:["Sites, bindings, app pools and identities","applicationHost.config and web.config","URL Rewrite, request filtering, logs, appcmd and PowerShell"],res:["R13","R14"],sum:"A binding is protocol + IP:port:host. Several HTTPS sites on one IP need SNI (sslFlags=1) and a host name. 500.19 means a config error; 503 often means the app pool stopped."},
 {id:"K9",g:"Knowledge",t:"HTTP methods for data retrieval and manipulation",obj:["GET, POST, PUT, PATCH, DELETE semantics","Safe and idempotent methods; status codes","Headers, caching, CORS"],res:["R31"],sum:"GET reads; POST creates (201 + Location); PUT replaces; PATCH changes part; DELETE removes (204). GET, PUT and DELETE are idempotent; GET and HEAD are safe."},
 {id:"K10",g:"Knowledge",t:"Angular or JS frameworks for responsive UIs",obj:["Components, signals, routing, forms, HttpClient","Responsive layout","Accessibility (WCAG 2.2)"],res:["R19","R21","R22","R55b"],sum:"Know signals and OnPush change detection, standalone components, reactive or signal forms, and HttpClient (returns Observables). Public-facing sites must meet accessibility standards."},
 {id:"S1",g:"Skill",t:"Consuming and producing RESTful APIs",obj:["Design resources, URIs, versions, pagination and errors","Consume APIs with timeouts and retries"],res:["R3","R31","R37"],sum:"Plural nouns, no verbs in paths, correct status codes, RFC 9457 problem details for errors. Clients retry only safe or idempotent calls on 429/503, with backoff."},
 {id:"S2",g:"Skill",t:"Technical expertise, direction and support to a team",obj:["Unblock others by teaching","Run design reviews","Set team standards"],res:["R47","R49"],sum:"Lead by asking good questions, pairing and writing things down. Standards should be short, agreed by the team and enforced by tools where possible."},
 {id:"S3",g:"Skill",t:"Project management principles in IT",obj:["Scope, estimates, risk register, RAID log","Status reporting and change control","Stakeholder mapping"],res:["R42","R51","R55"],sum:"When a date moves, present options (scope, people, date) with impacts instead of saying yes. Keep a RAID log (risks, assumptions, issues, dependencies) with owners and dates."},
 {id:"A1",g:"Ability",t:"Problem solving and critical thinking",obj:["Reproduce, isolate, hypothesize, test","Separate root cause from symptom"],res:["R46","R24"],sum:"Work from evidence: logs, metrics, recent changes. Change one thing at a time. Write down hypotheses and rule them out."},
 {id:"A2",g:"Ability",t:"Leading in a senior technical role",obj:["Make and own decisions","Delegate; handle escalations","Disagree and commit"],res:["R49","R49b","R48"],sum:"A lead balances delivery and people: protects focus, makes calls when needed, and owns mistakes publicly."},
 {id:"A3",g:"Ability",t:"Communicating and collaborating across teams",obj:["Tailor messages to the audience","Lead with the bottom line","Close with owners and dates"],res:["R53","R53b","R51"],sum:"Write for the reader: what happened, what it means for them, what they need to do, when you'll update them. Avoid jargon for non-technical readers."},
 {id:"A4",g:"Ability",t:"Designing and maintaining CI/CD pipelines",obj:["Multi-stage YAML: build, test, deploy","Environments, approvals, secrets","Rollback and release strategies"],res:["R6","R16","R28","R44"],sum:"Build once, test, then promote the same artifact through environments. Gate production with environment approvals. Keep secrets in variable groups or Key Vault, never in YAML."},
 {id:"P1",g:"Preferred",t:"Hands-on Azure DevOps, GitHub, TFVC workflows",obj:["Boards: area and iteration paths, work item links","Branch policies and pull requests","TFVC shelvesets and check-ins"],res:["R15","R17","R43"],sum:"Branch policies on main: require pull requests, minimum reviewers, build validation, linked work items and resolved comments. In GitHub, AB#123 links a commit to an Azure Boards item."},
 {id:"P2",g:"Preferred",t:"C#, Angular, TypeScript with strong OOP",obj:["Encapsulation, polymorphism, composition over inheritance","Interface design","TypeScript strict mode"],res:["R1","R20","R26"],sum:"Prefer small interfaces and composition. Use polymorphism to remove switch statements. Know LINQ deferred execution and C# record equality."},
 {id:"P3",g:"Preferred",t:"Leading and mentoring: performance, growth, culture",obj:["Run 1:1s that belong to the report","Give SBI feedback","Write fair reviews; handle underperformance"],res:["R48","R50","R50b","R51"],sum:"Feedback: Situation, Behavior, Impact, then a request. Reviews use specific, dated evidence. Psychological safety (Google's Project Aristotle) is the strongest predictor of team effectiveness."},
 {id:"P4",g:"Preferred",t:"Advanced Azure deployment plus IIS administration",obj:["App Service deployment slots and swaps","Sticky slot settings, managed certificates","IIS on Windows VMs; moving IIS sites to App Service"],res:["R7","R8","R13","R14"],sum:"Deploy to a staging slot, warm it up, then swap. Mark environment-specific settings as slot settings so they don't swap."},
 {id:"P5",g:"Preferred",t:"Secure web development: TLS, REST, architecture",obj:["TLS 1.2/1.3, certificate chains, HSTS, security headers","OWASP Top 10:2025","OAuth 2.0/OIDC, CORS, input validation"],res:["R31","R32","R33","R34","R35","R36","R37","R38"],sum:"Disable SSL 3 and TLS 1.0/1.1. Redirect HTTP to HTTPS and send HSTS. Never use a wildcard CORS origin with credentials. Broken Access Control is #1 on the OWASP Top 10:2025."},

const cTag=(c,t)=>/^[a-z]$/.test(t)?c.id+t:t;
const compItems=c=>c.behaviors.map(b=>({id:c.id+b.id,g:"Competency",comp:c.id,t:b.t,obj:b.obj,res:b.res||c.res,sum:b.sum}));
const compCards=c=>(c.cards||[]).map(([b,q,a])=>[cTag(c,b),q,a]);
const compStars=c=>(c.prompts||[]).map(p=>Object.assign({},p,{id:c.id+"-"+p.id,tags:p.tags.map(t=>cTag(c,t))}));

T({id:"P2-ts-fees",ksa:["P2","K3"],type:"code",lang:"ts",tier:3,title:"TypeScript OOP: fee rules (Strategy)",
 prompt:"Permit fees are made of rules. Implement an abstract class <code>FeeRule</code> with <code>apply(base: number): number</code>, plus <code>FlatFee</code> (fixed amount) and <code>PercentFee</code> (rate times base). Then implement <code>totalFees(rules, base)</code> as the sum of all rules. Round to 2 decimals.",
 starter:"abstract class FeeRule {\n  abstract apply(base: number): number;\n}\n\nclass FlatFee extends FeeRule {\n  // TODO\n}\n\nclass PercentFee extends FeeRule {\n  // TODO\n}\n\nfunction totalFees(rules: FeeRule[], base: number): number {\n  // TODO\n  return 0;\n}\n",
 tests:[["FlatFee returns its amount","new FlatFee(25).apply(100)===25"],["PercentFee applies the rate","new PercentFee(0.1).apply(200)===20"],["Rules are FeeRule instances","new PercentFee(0.1) instanceof FeeRule && new FlatFee(1) instanceof FeeRule"],["totalFees sums rules","totalFees([new FlatFee(25),new PercentFee(0.1)],200)===45"],["Rounds to 2 decimals","totalFees([new PercentFee(0.0333)],100)===3.33"],["No rules means 0","totalFees([],500)===0"]],
 hints:["Each subclass needs a constructor that stores its value, and an apply method.","class FlatFee extends FeeRule { constructor(private amount: number) { super(); } apply(_b: number) { return this.amount; } }","totalFees: Math.round(rules.reduce((s, r) => s + r.apply(base), 0) * 100) / 100"]});

T({id:"K3-pattern",ksa:["K3"],type:"mcq",tier:1,title:"Name the pattern",
 prompt:"Which design pattern is this?",code:"public interface INotifier { Task SendAsync(string to, string msg); }\npublic class EmailNotifier : INotifier { ... }\npublic class SmsNotifier : INotifier { ... }\n\npublic class OutageAlerts {\n  private readonly INotifier _notifier;\n  public OutageAlerts(INotifier notifier) => _notifier = notifier;\n  public Task Alert(Customer c) => _notifier.SendAsync(c.Contact, \"Service outage in your area\");\n}",

 items:[["sql","Line 4: SQL built by string concatenation"],["select","Line 4: SELECT * returns every column, including private ones"],["catch","Line 6: empty catch swallows errors"],["async","Line 2: the method is async"],["ok","Line 7: returns 200 OK with the rows"],["auth","No authorization: anyone can search permits by owner name"]],

T({id:"K7-keyvault",ksa:["K7","P4","P5"],type:"json",tier:2,title:"Azure: move secrets to Key Vault",
 prompt:"These App Service settings hold secrets in plain text. The app has a managed identity with access to Key Vault <code>kv-permits-prod</code>, which holds secrets <code>PermitsDb</code> and <code>PaymentsApiKey</code>. Replace both secret values with Key Vault references. Keep the JSON valid.",
 starter:"[\n  { \"name\": \"ASPNETCORE_ENVIRONMENT\", \"value\": \"Production\", \"slotSetting\": false },\n  { \"name\": \"ConnectionStrings__PermitsDb\", \"value\": \"Server=tcp:sql-permits.database.windows.net;Database=Permits;User ID=permits_app;Password=Spr1ng2026!;\", \"slotSetting\": false },\n  { \"name\": \"Payments__ApiKey\", \"value\": \"pk_live_51Hx9aQ7\", \"slotSetting\": false }\n]\n",
 checks:[{l:"PermitsDb uses a Key Vault reference",f:j=>kvRef(val(j,"ConnectionStrings__PermitsDb"),"PermitsDb")},{l:"Payments key uses a Key Vault reference",f:j=>kvRef(val(j,"Payments__ApiKey"),"PaymentsApiKey")},{l:"No plain-text password or live key remains",f:(j,raw)=>!/Password=|pk_live_/i.test(raw)}],
 constraints:[{l:"ASPNETCORE_ENVIRONMENT is still Production",f:j=>val(j,"ASPNETCORE_ENVIRONMENT")==="Production"},{l:"All 3 settings still exist",f:j=>Array.isArray(j)&&j.length===3}],
 hints:["The syntax starts with @Microsoft.KeyVault(","Either SecretUri=https://kv-permits-prod.vault.azure.net/secrets/PermitsDb/ or VaultName=kv-permits-prod;SecretName=PermitsDb","\"value\": \"@Microsoft.KeyVault(VaultName=kv-permits-prod;SecretName=PermitsDb)\""],
 explain:"App Service resolves @Microsoft.KeyVault(...) references at runtime using the app's managed identity, so secrets never sit in config."});

T({id:"K8-iis-sni",ksa:["K8","P4","P5"],type:"xml",tier:2,title:"IIS: wrong certificate on a shared IP",
 prompt:"The server hosts three HTTPS sites on one IP address. Visitors to <code>https://permits.example.com</code> get another site's certificate. Fix the HTTPS binding so it uses SNI for <code>permits.example.com</code>. Keep the HTTP binding (a rewrite rule uses it to redirect).",
 starter:"<site name=\"Permits\" id=\"3\">\n  <application path=\"/\" applicationPool=\"PermitsPool\">\n    <virtualDirectory path=\"/\" physicalPath=\"D:\\sites\\permits\" />\n  </application>\n  <bindings>\n    <binding protocol=\"http\" bindingInformation=\"*:80:permits.example.com\" />\n    <binding protocol=\"https\" bindingInformation=\"*:443:\" sslFlags=\"0\" />\n  </bindings>\n</site>\n",
 checks:[{l:"HTTPS binding on port 443 with host permits.example.com",f:d=>xAll(d,"binding").some(b=>b.getAttribute("protocol")==="https"&&/^(\*|[\d.]+):443:permits\.example\.com$/i.test(b.getAttribute("bindingInformation")||""))},{l:"SNI enabled (sslFlags includes 1)",f:d=>xAll(d,"binding").some(b=>b.getAttribute("protocol")==="https"&&/permits\.example\.com/i.test(b.getAttribute("bindingInformation")||"")&&((parseInt(b.getAttribute("sslFlags")||"0",10)&1)===1))}],
 constraints:[{l:"HTTP binding on port 80 still present",f:d=>xAll(d,"binding").some(b=>b.getAttribute("protocol")==="http"&&/:80:/.test(b.getAttribute("bindingInformation")||""))},{l:"App pool unchanged (PermitsPool)",f:d=>xAll(d,"application").some(a=>a.getAttribute("applicationPool")==="PermitsPool")},{l:"Only one HTTPS binding",f:d=>xAll(d,"binding").filter(b=>b.getAttribute("protocol")==="https").length===1}],
 hints:["bindingInformation is IP:port:hostname. The host name is missing.","SNI is turned on with sslFlags=\"1\".","<binding protocol=\"https\" bindingInformation=\"*:443:permits.example.com\" sslFlags=\"1\" />"],
 explain:"Without a host name and SNI, IIS serves the IP's default certificate. With SNI (sslFlags=1), the browser sends the host name in the TLS handshake and IIS picks the matching certificate."});

T({id:"P5-webconfig",ksa:["P5","K8"],type:"xml",tier:3,title:"IIS web.config: HTTPS redirect, HSTS, headers",
 prompt:"Harden this ASP.NET Core site's <code>web.config</code>: (1) add a URL Rewrite rule that permanently redirects HTTP to HTTPS, (2) send <code>Strict-Transport-Security</code> with max-age of at least one year, (3) remove the <code>X-Powered-By</code> header. Keep the ASP.NET Core hosting settings.",
 starter:"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <system.webServer>\n    <handlers>\n      <add name=\"aspNetCore\" path=\"*\" verb=\"*\" modules=\"AspNetCoreModuleV2\" resourceType=\"Unspecified\" />\n    </handlers>\n    <aspNetCore processPath=\"dotnet\" arguments=\".\\Permits.Api.dll\" hostingModel=\"inprocess\" />\n    <!-- TODO: rewrite rule, HSTS, remove X-Powered-By -->\n  </system.webServer>\n</configuration>\n",
 checks:[{l:"Rewrite rule matches when {HTTPS} is off",f:d=>xAll(d,"rule").some(r=>xAll(r,"add").some(a=>/\{HTTPS\}/i.test(a.getAttribute("input")||"")&&/off/i.test(a.getAttribute("pattern")||"")))},{l:"Rule redirects to https:// (permanent)",f:d=>xAll(d,"rule").some(r=>xAll(r,"action").some(a=>a.getAttribute("type")==="Redirect"&&/^https:\/\//i.test(a.getAttribute("url")||"")&&/^(Permanent|)$/.test(a.getAttribute("redirectType")||"")))},{l:"HSTS header with max-age of at least 31536000",f:d=>xAll(d,"add").some(a=>/^strict-transport-security$/i.test(a.getAttribute("name")||"")&&(parseInt(((a.getAttribute("value")||"").match(/max-age=(\d+)/i)||[0,0])[1],10)>=31536000))},{l:"X-Powered-By removed",f:d=>xAll(d,"remove").some(a=>/^x-powered-by$/i.test(a.getAttribute("name")||""))}],
 constraints:[{l:"aspNetCore element still present",f:d=>xAll(d,"aspNetCore").length===1},{l:"aspNetCore handler still present",f:d=>xAll(d,"handlers").some(h=>xAll(h,"add").some(a=>a.getAttribute("modules")==="AspNetCoreModuleV2"))}],
 hints:["Rules go in <rewrite><rules><rule name=\"...\" stopProcessing=\"true\">; headers go in <httpProtocol><customHeaders>.","Rule: <match url=\"(.*)\" />, <conditions><add input=\"{HTTPS}\" pattern=\"^OFF$\" /></conditions>, <action type=\"Redirect\" url=\"https://{HTTP_HOST}/{R:1}\" redirectType=\"Permanent\" />","Headers: <remove name=\"X-Powered-By\" /> and <add name=\"Strict-Transport-Security\" value=\"max-age=31536000; includeSubDomains\" />"],
 explain:"Redirect first, then HSTS makes browsers skip HTTP entirely. Removing X-Powered-By reduces fingerprinting. URL Rewrite must be installed on the server or IIS returns 500.19."});

T({id:"S1-post-auth",ksa:["S1","K9","P5"],type:"http",tier:2,title:"HTTP: create a 311 request",

T({id:"A1-503",ksa:["A1","K8"],type:"mcq",tier:2,title:"Incident drill: 503 after deploy",

T({id:"A1-ts-parallel",ksa:["A1","K2","S1"],type:"code",lang:"ts",tier:2,title:"Fix a slow loader",

T({id:"S1-ts-retry",ksa:["S1","A1","P5"],type:"code",lang:"ts",tier:3,title:"Consume an API with retries",
 prompt:"Implement <code>fetchWithRetry(call, maxAttempts)</code>. <code>call()</code> returns <code>{ status, body }</code>. Retry only on 429 and 503, up to <code>maxAttempts</code> total, waiting <code>await sleep(2 ** attempt)</code> between tries (sleep is provided). Return the first non-retryable response, or the last response if all attempts fail.",
 harness:"const sleep = (ms) => new Promise(r => setTimeout(r, Math.min(ms, 5)));\nconst seq = (arr) => { let i = 0; const f = async () => { f.calls++; return arr[Math.min(i++, arr.length - 1)]; }; f.calls = 0; return f; };\n",
 starter:"type Res = { status: number; body?: unknown };\n\nasync function fetchWithRetry(call: () => Promise<Res>, maxAttempts = 3): Promise<Res> {\n  // TODO\n  return call();\n}\n",
 tests:[["Retries 503 then succeeds","(async()=>{const f=seq([{status:503},{status:200,body:'ok'}]);const r=await fetchWithRetry(f,3);return r.status===200&&f.calls===2})()"],["Retries 429","(async()=>{const f=seq([{status:429},{status:429},{status:200}]);const r=await fetchWithRetry(f,3);return r.status===200&&f.calls===3})()"],["Does not retry 404","(async()=>{const f=seq([{status:404},{status:200}]);const r=await fetchWithRetry(f,3);return r.status===404&&f.calls===1})()"],["Gives up after maxAttempts","(async()=>{const f=seq([{status:503}]);const r=await fetchWithRetry(f,3);return r.status===503&&f.calls===3})()"]],
 hints:["Loop from attempt 1 to maxAttempts.","Inside: const r = await call(); if (r.status !== 429 && r.status !== 503) return r;","If more attempts remain: await sleep(2 ** attempt). After the loop, return the last response."]});

T({id:"A3-clerk",ksa:["A3","C1e"],type:"write",tier:2,title:"Outage note to the Records Manager",
 prompt:"The meeting agenda portal was down from 9:10 to 10:40 this morning because a security certificate expired on the server. It's fixed. Write a short note to the Records Manager (non-technical). Say what happened, the impact, what you did, how you'll prevent it, and whether they need to do anything.",
 auto:[{l:"60-150 words",f:t=>{const w=words(t);return w>=60&&w<=150}},{l:"Mentions the time window",f:t=>/\d{1,2}:\d{2}/.test(t)},{l:"Says whether they need to act",f:t=>/no action|nothing (you need|needed)|you don.t need|please|could you|let me know/i.test(t)},{l:"Says how you'll prevent it",f:t=>/prevent|automat|reminder|monitor|going forward|from now on|renew/i.test(t)},{l:"Avoids jargon (TLS, SSL, load balancer, DNS, IIS, HTTP, root cause)",f:t=>!/\b(TLS|SSL|load balancer|DNS|IIS|HTTPS?|root cause|5\d\d)\b/i.test(t)},{l:"Short sentences (average 20 words or fewer)",f:t=>avgSentence(t)<=20}],
 checklist:["Acknowledges the impact on their work","Plain words a non-technical reader would understand","Says what happened in one sentence","Gives a contact or when they'll hear next"],
 model:"Hi Maria, the meeting agenda portal was unavailable today from 9:10 to 10:40 a.m. A security certificate that proves the site is genuine expired, so browsers blocked access. We renewed it and the site has worked normally since 10:40. You don't need to do anything. Agendas posted before the outage were not affected. To prevent this, we are switching to automatic renewal and adding an alert 30 days before any certificate expires. I'm sorry for the disruption before this morning's meeting. If anyone reports problems, please send them to me directly. - Alex, Lead Software Engineer"});

T({id:"A4-yaml-prod",ksa:["A4","P1","K4"],type:"yaml",tier:2,title:"Azure Pipelines: gate production",
 prompt:"Add a <code>Deploy_Prod</code> stage that runs only after <code>Test</code>, uses a <b>deployment job</b> targeting the <code>production</code> environment (where approvals are configured), and doesn't put secrets in YAML.",
 starter:"trigger:\n  branches:\n    include:\n      - main\n\npool:\n  vmImage: windows-latest\n\nstages:\n  - stage: Build\n    jobs:\n      - job: Build\n        steps:\n          - script: dotnet build --configuration Release\n          - task: PublishPipelineArtifact@1\n            inputs:\n              targetPath: $(Build.ArtifactStagingDirectory)\n              artifact: drop\n\n  - stage: Test\n    dependsOn: Build\n    jobs:\n      - job: UnitTests\n        steps:\n          - script: dotnet test --configuration Release\n\n# TODO: add the Deploy_Prod stage below\n",
 checks:[{l:"Stage Deploy_Prod exists",f:y=>!!stg(y,"Deploy_Prod")},{l:"Deploy_Prod depends on Test",f:y=>{const s=stg(y,"Deploy_Prod");return !!s&&[].concat(s.dependsOn||[]).includes("Test")}},{l:"Uses a deployment job",f:y=>{const s=stg(y,"Deploy_Prod");return !!s&&Array.isArray(s.jobs)&&s.jobs.some(j=>j&&j.deployment)}},{l:"Targets the production environment",f:y=>{const s=stg(y,"Deploy_Prod");return !!s&&Array.isArray(s.jobs)&&s.jobs.some(j=>j&&j.deployment&&(j.environment==="production"||(j.environment&&j.environment.name==="production")))}},{l:"Has a deployment strategy (e.g. runOnce)",f:y=>{const s=stg(y,"Deploy_Prod");return !!s&&Array.isArray(s.jobs)&&s.jobs.some(j=>j&&j.deployment&&j.strategy)}}],
 constraints:[{l:"Build and Test stages still exist",f:y=>!!stg(y,"Build")&&!!stg(y,"Test")},{l:"Test still depends on Build",f:y=>{const s=stg(y,"Test");return !!s&&[].concat(s.dependsOn||[]).includes("Build")}},{l:"No secret literals in YAML",f:(y,raw)=>!/(password|secret|pwd|apikey|api_key|token)\s*[:=]\s*['"]?(?!\$\()[A-Za-z0-9!@#%^&*_\-]{6,}/i.test(raw)}],
 hints:["Stages are list items under stages:. Order them with dependsOn.","A deployment job uses '- deployment: Name' with 'environment: production'.","  - stage: Deploy_Prod\n    dependsOn: Test\n    jobs:\n      - deployment: DeployWeb\n        environment: production\n        strategy:\n          runOnce:\n            deploy:\n              steps:\n                - script: echo Deploying"],
 explain:"Deployment jobs record history against an environment, and the environment's approvals and checks gate production. Secrets come from variable groups or Key Vault."});

T({id:"P1-gha-pr",ksa:["P1","A4","K4"],type:"yaml",tier:2,title:"GitHub Actions: test every pull request",
 prompt:"This workflow builds on pushes to <code>main</code>. Make it also run on <b>pull requests to main</b>, and add a step that runs <code>dotnet test</code>.",
 starter:"name: ci\non:\n  push:\n    branches: [ main ]\n\njobs:\n  build:\n    runs-on: windows-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-dotnet@v4\n        with:\n          dotnet-version: '8.0.x'\n      - run: dotnet build --configuration Release\n",
 checks:[{l:"Triggers on pull_request to main",f:y=>{const on=y&&y.on;const pr=on&&on.pull_request;return !!pr&&[].concat(pr.branches||[]).includes("main")}},{l:"A step runs dotnet test",f:y=>Object.values((y&&y.jobs)||{}).some(j=>(j.steps||[]).some(s=>s&&typeof s.run==="string"&&/dotnet test/.test(s.run)))}],
 constraints:[{l:"Still triggers on push to main",f:y=>{const p=y&&y.on&&y.on.push;return !!p&&[].concat(p.branches||[]).includes("main")}},{l:"Checkout is still the first step",f:y=>{const j=y&&y.jobs&&y.jobs.build;return !!j&&j.steps&&j.steps[0]&&/actions\/checkout/.test(j.steps[0].uses||"")}}],
 hints:["Add a pull_request key next to push under on:.","pull_request:\n    branches: [ main ]","Add a step: - run: dotnet test --configuration Release"],
 explain:"Running tests on every PR, plus a branch protection rule that requires the check, keeps main releasable."});

T({id:"P1-policies",ksa:["P1","K4"],type:"pick",tier:1,title:"Branch policies for main",
 prompt:"Your team is moving to pull requests in Azure Repos. Choose the branch policies for <code>main</code> that keep it releasable and auditable.",
 items:[["rev","Require a minimum of 1 reviewer (and reset votes on new pushes)"],["wi","Check for linked work items"],["cmt","Check for comment resolution"],["build","Build validation: run the CI pipeline on every PR"],["bypass","Allow everyone to bypass policies when in a hurry"],["self","Allow requestors to approve their own changes"]],
 checks:[{l:"Minimum reviewers",f:s=>s.has("rev")},{l:"Linked work items",f:s=>s.has("wi")},{l:"Comment resolution",f:s=>s.has("cmt")},{l:"Build validation",f:s=>s.has("build")}],
 constraints:[{l:"No bypass for everyone",f:s=>!s.has("bypass")},{l:"No self-approval",f:s=>!s.has("self")}],
 explain:"These four policies give review, traceability (audit), and a green build before merge. Bypass rights should be limited to a small admin group and logged."});

T({id:"P3-review",ksa:["P3","S2","C1c"],type:"scenario",tier:3,title:"Mid-year review: strong but abrasive",
 prompt:"Sam is your most productive developer, but code review comments like 'this is garbage' have made two juniors stop sending him PRs.",
 steps:[
  {q:"How do you prepare?",o:[["Collect specific, dated examples (PR comments) and their effects",3,"Evidence makes feedback fair and concrete."],["Rely on your general impression",0,"Vague and easy to dispute."],["Ask the team for anonymous complaints",1,"Can help, but alone it feels like an ambush."]]},
  {q:"How do you open the conversation?",o:[["'People think you're toxic.'",0,"A label, not a behavior."],["SBI: 'In the March 12 review (situation) you wrote \"this is garbage\" (behavior). Two juniors have since stopped asking you to review (impact).'",3,"Specific and observable, with clear impact."],["Skip it; his output is great",0,"Output doesn't excuse harm to the team."]]},
  {q:"What does the plan look like?",o:[["A concrete goal (review comments follow the team guide), monthly check-ins, recognition of his strengths and an offer to mentor juniors",3,"Clear expectations plus a path to grow."],["Warn him about a performance improvement plan right away",0,"Too early, and it escalates."]]}
 ]});

T({id:"P4-slots",ksa:["P4","K7"],type:"mcq",tier:2,title:"Slot swap safety",
 prompt:"Your App Service staging slot uses a <i>test</i> database connection string. You'll swap staging into production. What must you do so production never points at the test database?",
 options:["Nothing; swaps never move settings","Mark the connection string as a deployment slot setting (sticky) in both slots","Delete the staging slot after each swap","Hard-code the production string in appsettings.json"],
 answer:1,explain:"Slot settings stay with their slot during a swap. Non-sticky settings travel with the app."});

T({id:"P5-cors",ksa:["P5","S1","K9"],type:"mcq",tier:2,title:"CORS with credentials",
 prompt:"The Angular app at <code>https://permits.example.com</code> calls <code>https://api.example.com</code> with cookies (withCredentials). Which API response headers are correct?",
 options:["Access-Control-Allow-Origin: *","Access-Control-Allow-Origin: * and Access-Control-Allow-Credentials: true","Access-Control-Allow-Origin: https://permits.example.com and Access-Control-Allow-Credentials: true (plus Vary: Origin)","No CORS headers; same company, same rules"],
 answer:2,explain:"Browsers reject a wildcard origin with credentials. Echo an allow-listed origin, set Allow-Credentials, and add Vary: Origin for caches."});

T({id:"P5-tls",ksa:["P5","K8"],type:"mcq",tier:1,title:"TLS settings for a public site",
 prompt:"An SSL Labs scan of your organization's IIS server shows TLS 1.0 and 1.1 enabled. What's the right target?",
 options:["Leave them on for old browsers","Allow TLS 1.2 and 1.3 only; disable SSL 3.0, TLS 1.0 and 1.1 (Schannel registry or Group Policy), then rescan","Disable TLS 1.2 to force 1.3 only","Turn off HTTPS for internal pages"],
 answer:1,explain:"TLS 1.2 and 1.3 only is current guidance. On Windows, protocols are set in Schannel (registry or GPO) and need a reboot; rescan with SSL Labs after."});

T({id:"K10-onpush",ksa:["K10","K2"],type:"mcq",tier:2,title:"Angular: list doesn't update",
 prompt:"A component uses <code>ChangeDetectionStrategy.OnPush</code> and receives <code>@Input() permits: Permit[]</code>. The parent runs <code>this.permits.push(newPermit)</code>, but the list on screen doesn't update. Best fix?",
 options:["Call setTimeout to force a refresh","Create a new array in the parent: this.permits = [...this.permits, newPermit] (or use a signal and update it)","Switch every component to Default change detection","Call document.location.reload()"],
 answer:1,explain:"OnPush checks when the input reference changes. Mutating in place keeps the same reference. Immutable updates, or signals, fix it."});

T({id:"K10-a11y",ksa:["K10","P5"],type:"pick",tier:1,title:"Accessibility audit of a form",
 prompt:"Review this permit application form markup. Select every accessibility problem (WCAG 2.2).",
 code:"<input type=\"text\" placeholder=\"Owner name\">\n<div class=\"btn\" onclick=\"submit()\">Submit</div>\n<span style=\"color:#aaa\">Required fields in grey</span>\n<img src=\"map.png\">\n<label for=\"addr\">Address</label><input id=\"addr\" type=\"text\">",
 items:[["ph","Line 1: placeholder used instead of a label"],["div","Line 2: a div used as a button (no keyboard access)"],["color","Line 3: low-contrast grey, and color alone conveys meaning"],["alt","Line 4: image without alt text"],["addr","Line 5: labelled address input"]],
 checks:[{l:"Missing label",f:s=>s.has("ph")},{l:"Non-semantic button",f:s=>s.has("div")},{l:"Color and contrast",f:s=>s.has("color")},{l:"Missing alt text",f:s=>s.has("alt")}],
 constraints:[{l:"Correct markup not flagged",f:s=>!s.has("addr")}],
 explain:"Use real <label> and <button> elements, 4.5:1 text contrast, and don't rely on color alone. Every meaningful image needs alt text."});

T({id:"K5-kanban",ksa:["K5"],type:"mcq",tier:1,title:"Kanban: work piling up",
 prompt:"On your Kanban board, 14 items sit in 'Code Review' while 'Testing' is empty and cycle time has doubled. What's the best first change?",
 options:["Add more developers","Set a WIP limit on Code Review and have people swarm reviews before starting new work","Remove the Code Review column","Start more items so testers have work"],
 answer:1,explain:"WIP limits expose and relieve the bottleneck; 'stop starting, start finishing' cuts cycle time."});

T({id:"K4-tfvc-git",ksa:["K4"],type:"mcq",tier:1,title:"TFVC to Git migration",
 prompt:"Your organization still keeps a legacy app in TFVC. New Azure DevOps projects can't create TFVC repos by default. What's the sensible plan?",
 options:["Recreate TFVC in a new project by turning the setting back on forever","Migrate to Git with recent history (e.g., Azure Repos import, up to 180 days), keep the TFVC repo read-only for older history, and train the team on pull requests","Email zip files of the code","Stop using version control for the legacy app"],
 answer:1,explain:"Microsoft recommends Git. Import recent history, archive the rest read-only, and set up branch policies on day one."});

// ---------- Supporting-topic tasks ----------
T({id:"G1-fix-form",ksa:["G1","K10"],type:"html",tier:2,title:"Fix an inaccessible permit form",
 prompt:"Edit this HTML so it meets WCAG 2.1 AA basics: every input has a programmatic label, the submit control is a real button, the image has a text alternative, the required field is marked for assistive tech, and the error message is tied to its input. Keep the field names.",
 starter:"<form id=\"permit\">\n  <h2>Apply for a block party permit</h2>\n  <input type=\"text\" id=\"owner\" name=\"owner\" placeholder=\"Your name\">\n  <input type=\"text\" id=\"street\" name=\"street\" placeholder=\"Street\">\n  <span id=\"street-err\" class=\"error\">Street is required</span>\n  <img src=\"map.png\">\n  <div class=\"btn\" onclick=\"send()\">Submit</div>\n</form>\n",
 checks:[{l:"Every input has a label (label[for], wrapping label, aria-label or aria-labelledby)",f:d=>{const ins=[...d.querySelectorAll("input:not([type=hidden])")];return ins.length>0&&ins.every(i=>(i.id&&d.querySelector('label[for="'+i.id+'"]'))||i.closest("label")||(i.getAttribute("aria-label")||"").trim()||i.getAttribute("aria-labelledby"));}},
  {l:"Submit is a <button> (or input type=submit), not a div",f:d=>!!d.querySelector("button, input[type=submit]")&&!d.querySelector("div[onclick], span[onclick]")},
  {l:"Image has an alt attribute",f:d=>[...d.querySelectorAll("img")].every(i=>i.hasAttribute("alt"))},
  {l:"Street is marked required (required or aria-required)",f:d=>{const s=d.querySelector('[name="street"]');return !!s&&(s.hasAttribute("required")||s.getAttribute("aria-required")==="true");}},
  {l:"Error message linked with aria-describedby (or aria-errormessage)",f:d=>{const s=d.querySelector('[name="street"]');return !!s&&/street-err/.test((s.getAttribute("aria-describedby")||"")+" "+(s.getAttribute("aria-errormessage")||""));}}],
 constraints:[{l:"Inputs owner and street still exist",f:d=>!!d.querySelector('[name="owner"]')&&!!d.querySelector('[name="street"]')},{l:"Placeholder is not the only label (still OK to keep it)",f:d=>true}],
 hints:["Add <label for=\"owner\">Name</label> before each input.","Replace the div with <button type=\"submit\">Submit</button>; add alt=\"Map of the block\" (or alt=\"\" if decorative).","<input id=\"street\" name=\"street\" required aria-describedby=\"street-err\">"],
 explain:"Native labels and buttons give screen readers names and keyboard access for free. aria-describedby makes the error message read with the field. Placeholders disappear on typing and are not labels."});

T({id:"G1-angular-disclosure",ksa:["G1","K10"],type:"html",tier:3,title:"Angular: accessible filter toggle",
 prompt:"This Angular template shows and hides search filters with a clickable div. Rewrite it so keyboard and screen-reader users can operate it: use a native button, expose the expanded state with <code>[attr.aria-expanded]</code>, and point <code>aria-controls</code> at the panel's id. Keep the <code>(click)</code> handler and the <code>@if</code> block.",
 starter:"<div class=\"toggle\" (click)=\"open = !open\">\n  Filters <span class=\"chev\"></span>\n</div>\n@if (open) {\n  <div class=\"panel\">\n    <label for=\"status\">Status</label>\n    <select id=\"status\"><option>Open</option></select>\n  </div>\n}\n",
 checks:[{l:"Toggle is a <button> with the (click) handler",f:d=>[...d.querySelectorAll("button")].some(b=>b.hasAttribute("(click)"))},
  {l:"Button binds [attr.aria-expanded]",f:d=>[...d.querySelectorAll("button")].some(b=>b.hasAttribute("[attr.aria-expanded]"))},
  {l:"aria-controls points at the panel's id",f:d=>{const b=[...d.querySelectorAll("button")].find(x=>x.hasAttribute("aria-controls"));if(!b)return false;const id=b.getAttribute("aria-controls");return !!id&&!!d.getElementById(id);}},
  {l:"Button has type=\"button\"",f:d=>[...d.querySelectorAll("button")].some(b=>b.getAttribute("type")==="button")}],
 constraints:[{l:"No div or span with (click)",f:d=>![...d.querySelectorAll("div,span")].some(e=>e.hasAttribute("(click)"))},{l:"The @if block is still there",f:(d,raw)=>/@if\s*\(\s*open\s*\)/.test(raw)}],
 hints:["Swap the outer <div class=\"toggle\"> for a <button>.","<button type=\"button\" (click)=\"open = !open\" [attr.aria-expanded]=\"open\" aria-controls=\"filters\">","Give the panel id=\"filters\". (For a panel that leaves the DOM, some teams keep it rendered and toggle [hidden] so aria-controls always resolves.)"],
 explain:"A native button is focusable and works with Enter and Space. aria-expanded tells screen-reader users the state; aria-controls links the button to the panel."});

T({id:"G1-dates",ksa:["G1"],type:"mcq",tier:1,title:"ADA Title II compliance date (public sector)",
 prompt:"A local government serving 120,000 people asks when its website and apps must meet the ADA Title II web rule, as amended by DOJ's April 20, 2026 interim final rule.",
 options:["April 24, 2026, WCAG 2.0 AA","April 26, 2027, WCAG 2.1 AA","April 26, 2028, WCAG 2.2 AA","There is no deadline; the rule only covers federal agencies"],
 answer:1,explain:"Governments serving 50,000+ people: April 26, 2027; smaller ones and special districts: April 26, 2028. The standard stayed WCAG 2.1 AA. A lawsuit challenges the extension, so confirm on ADA.gov."});

T({id:"G1-508",ksa:["G1","P5"],type:"mcq",tier:1,title:"Section 508 vs ADA Title II",
 prompt:"A vendor says their portal is 'Section 508 compliant, so it meets our legal requirement.' What's the most accurate response?",
 options:["Agreed; 508 is the legal standard for everyone","Section 508 binds federal agencies and uses WCAG 2.0 AA; a state or local government's obligation is ADA Title II at WCAG 2.1 AA, so ask for a WCAG 2.1 AA conformance report (ACR/VPAT) and test it","Accessibility only applies to public-facing pages, not portals","A 508 statement means no testing is needed"],
 answer:1,explain:"Title II requires WCAG 2.1 AA for content governments provide, including vendor content. Ask for an Accessibility Conformance Report against WCAG 2.1 AA and verify with your own keyboard and screen-reader tests."});

T({id:"G1-testplan",ksa:["G1","K10"],type:"pick",tier:1,title:"Accessibility test plan for a release",
 prompt:"Pick the checks that belong in the team's accessibility definition of done for each release.",
 items:[["kb","Complete key flows with the keyboard only; focus always visible"],["sr","Run key flows with a screen reader (NVDA or VoiceOver)"],["auto","Run an automated checker in CI, and treat it as a first pass only"],["zoom","Check the page at 200% zoom and at 320px width (reflow)"],["contrast","Check text contrast (4.5:1) and that color isn't the only cue"],["skip","Skip manual tests when the automated checker passes"],["overlay","Install an accessibility overlay widget instead of fixing code"]],
 checks:[{l:"Keyboard-only test",f:s=>s.has("kb")},{l:"Screen reader test",f:s=>s.has("sr")},{l:"Automated checks",f:s=>s.has("auto")},{l:"Zoom and reflow",f:s=>s.has("zoom")},{l:"Contrast and color",f:s=>s.has("contrast")}],
 constraints:[{l:"Doesn't rely on automation alone",f:s=>!s.has("skip")},{l:"No overlay instead of fixes",f:s=>!s.has("overlay")}],
 explain:"Automated tools find only part of WCAG failures. Manual keyboard, screen-reader, zoom and contrast checks catch the rest. Overlays don't make the underlying code conform."});

T({id:"G2-audit",ksa:["G2","P5"],type:"pick",tier:2,title:"Design an audit log entry",
 prompt:"Staff can view applicants' records in the permits app, including SSNs for some business licenses. Choose what each audit log entry for 'record viewed' should contain.",
 items:[["who","User ID (and role) of the viewer"],["what","Action (view) and record ID"],["when","UTC timestamp"],["where","Source app and IP address"],["outcome","Outcome (allowed or denied)"],["ssn","The applicant's full SSN, for context"],["token","The session token, to trace the session"],["fields","Which sensitive fields were displayed (names, not values)"]],
 checks:[{l:"Who",f:s=>s.has("who")},{l:"What and which record",f:s=>s.has("what")},{l:"When",f:s=>s.has("when")},{l:"Where",f:s=>s.has("where")},{l:"Outcome",f:s=>s.has("outcome")}],
 constraints:[{l:"No SSN in logs",f:s=>!s.has("ssn")},{l:"No session tokens in logs",f:s=>!s.has("token")}],
 explain:"Log enough to answer who saw what, when, from where, and whether it was allowed, without copying the sensitive data into the log. Logs are records too: protect them, make them append-only, and keep them per the retention schedule."});

T({id:"G2-schema",ksa:["G2","K1","P5"],type:"json",tier:2,title:"Make a table retention-ready",
 prompt:"This is the design for the <code>BusinessLicense</code> table. Update it so it supports the retention schedule (category <code>LIC-03</code>, keep 6 years after expiration), legal holds and PII protection: add a retention category, a retain-until date, a legal-hold flag, mark the SSN column as encrypted and masked, and switch deletes from hard to soft. Keep all existing columns.",
 starter:"{\n  \"table\": \"BusinessLicense\",\n  \"deleteMode\": \"hard\",\n  \"columns\": [\n    { \"name\": \"Id\", \"type\": \"int\" },\n    { \"name\": \"BusinessName\", \"type\": \"nvarchar(200)\" },\n    { \"name\": \"OwnerSsn\", \"type\": \"char(9)\", \"encrypted\": false, \"masked\": false },\n    { \"name\": \"ExpiresOn\", \"type\": \"date\" }\n  ]\n}\n",
 checks:[{l:"Has a retention category column, with LIC-03 as default or documented value",f:(j,raw)=>(j.columns||[]).some(c=>/retention/i.test(c.name))&&/LIC-03/.test(raw)},{l:"Has a retain-until date column",f:j=>(j.columns||[]).some(c=>/retain|purge/i.test(c.name)&&/date/i.test(c.type||""))},{l:"Has a legal-hold flag",f:j=>(j.columns||[]).some(c=>/hold/i.test(c.name)&&/bit|bool/i.test(c.type||""))},{l:"SSN is encrypted and masked",f:j=>{const c=(j.columns||[]).find(x=>x.name==="OwnerSsn");return !!c&&c.encrypted===true&&c.masked===true;}},{l:"Deletes are soft",f:j=>j.deleteMode==="soft"}],
 constraints:[{l:"Original columns kept",f:j=>["Id","BusinessName","OwnerSsn","ExpiresOn"].every(n=>(j.columns||[]).some(c=>c.name===n))}],
 hints:["Add columns like RetentionCategory, RetainUntil and LegalHold.","Types: RetentionCategory varchar(10) default 'LIC-03', RetainUntil date, LegalHold bit.","Set \"encrypted\": true, \"masked\": true on OwnerSsn and \"deleteMode\": \"soft\"."],
 explain:"Retention metadata lets a scheduled purge job delete exactly what the schedule allows, skip anything on legal hold, and log what it purged. SSNs need encryption at rest and masking in the UI (e.g., Always Encrypted or column encryption plus dynamic masking)."});

T({id:"G2-request",ksa:["G2","C1d","A3"],type:"scenario",tier:2,title:"A public records request hits your system",
 prompt:"Legal forwards a records request: every email and database record about the cancelled 'Smart Parking' project from 2023-2025.",
 steps:[
  {q:"First step?",o:[["Start deleting drafts that make the team look bad",0,"Destroying responsive records can be illegal."],["Confirm scope with the records officer or attorney, and suspend any auto-deletion that could touch responsive records (legal hold)",3,"Preservation first; the records officer owns the response."],["Reply to the requester yourself",0,"Responses go through the designated records officer."]]},
  {q:"How do you collect database records?",o:[["Export the matching rows with a repeatable, documented query, and keep the query",3,"Defensible and repeatable."],["Copy-paste screenshots",1,"Incomplete and hard to verify."],["Edit records to fix old typos first",0,"Records must not be altered."]]},
  {q:"The export includes customers' license plates and emails. Next?",o:[["Hand it to the records officer for review and redaction under the state's exemptions",3,"Exemptions are a legal decision; you supply clean data and tools."],["Release everything; it's public",0,"Personal information may be exempt."]]}
 ]});

T({id:"G3-cr",ksa:["G3","A4","S3"],type:"form",tier:2,title:"Write a change request the CAB will approve",
 prompt:"You need to deploy the permit portal's new payment page. The maintenance window is <b>Saturday 22:00-02:00</b>. You (Alex) built it; Jordan is the IT manager; Sam is the on-call operator. Fill in the change request.",
 fields:[["summary","Summary","text"],["type","Change type","select:Standard|Normal|Emergency"],["risk","Risk level","select:Low|Medium|High"],["start","Planned start (day and time)","text"],["tests","Test evidence","textarea"],["steps","Implementation steps","textarea"],["rollback","Rollback plan","textarea"],["comms","Who is notified, and when","textarea"],["implementer","Implemented by","text"],["approver","Approved by","text"]],

// ---------- YAML subset parser ----------
const leadSp=l=>l.length-l.replace(/^ +/,"").length;
function parseYAML(src){
  const raw=src.replace(/\t/g,"  ").split(/\r?\n/);
  const lines=[];
  raw.forEach((l,ri)=>{const t=stripComment(l);if(!t.trim())return;lines.push({ind:leadSp(t),text:t.trim(),ri});});
  let i=0;
  function stripComment(l){let q=null;for(let k=0;k<l.length;k++){const c=l[k];if(q){if(c===q)q=null;continue;}if(c==='"'||c==="'"){q=c;continue;}if(c==="#"&&(k===0||/\s/.test(l[k-1])))return l.slice(0,k).replace(/\s+$/,"");}return l.replace(/\s+$/,"");}
  function scalar(s){s=s.trim();if(s==="")return null;
    if((s[0]==='"'&&s.endsWith('"'))||(s[0]==="'"&&s.endsWith("'")))return s.slice(1,-1);
    if(s[0]==="["&&s.endsWith("]")){const inner=s.slice(1,-1).trim();return inner?inner.split(",").map(x=>scalar(x)):[];}
    if(s[0]==="{"&&s.endsWith("}")){const o={};s.slice(1,-1).split(",").forEach(p=>{const m=p.match(/^\s*([^:]+):\s*(.*)$/);if(m)o[m[1].trim()]=scalar(m[2]);});return o;}
    if(/^(true|false)$/i.test(s))return s.toLowerCase()==="true";
    if(/^(null|~)$/.test(s))return null;
    if(/^-?\d+(\.\d+)?$/.test(s))return Number(s);
    return s;}
  function block(ind){if(i>=lines.length)return null;return lines[i].text.startsWith("- ")||lines[i].text==="-"?list(lines[i].ind):map(lines[i].ind);}
  function blockScalar(keyInd,ri,style){const out=[];let r=ri+1;let base=null;
    while(r<raw.length){const l=raw[r];if(!l.trim()){out.push("");r++;continue;}const ind=leadSp(l);if(ind<=keyInd)break;if(base===null)base=ind;out.push(l.slice(Math.min(base,ind)));r++;}
    while(i<lines.length&&lines[i].ri<r)i++;
    while(out.length&&out[out.length-1]==="")out.pop();
    return style==="|"?out.join("\n"):out.join(" ");}
  function keyval(text){const m=text.match(/^("[^"]*"|'[^']*'|[^\s:#][^:]*?):(?:\s+(.*))?$/);if(!m)return null;let k=m[1];if(/^["']/.test(k))k=k.slice(1,-1);return [k.trim(),m[2]];}
  function map(ind){const o={};
    while(i<lines.length&&lines[i].ind===ind&&!(lines[i].text.startsWith("- ")||lines[i].text==="-")){
      const ln=lines[i];const kv=keyval(ln.text);if(!kv)throw new Error("Line "+(ln.ri+1)+": expected 'key: value' but found '"+ln.text+"'");
      const [k,v]=kv;i++;
      if(v===undefined||v===""){ if(i<lines.length&&lines[i].ind>ind)o[k]=block(lines[i].ind);
        else if(i<lines.length&&lines[i].ind===ind&&(lines[i].text.startsWith("- ")||lines[i].text==="-"))o[k]=list(ind);
        else o[k]=null;}
      else if(/^[|>][-+]?$/.test(v.trim()))o[k]=blockScalar(ind,ln.ri,v.trim()[0]);
      else o[k]=scalar(v);
    }
    if(i<lines.length&&lines[i].ind>ind)throw new Error("Line "+(lines[i].ri+1)+": unexpected indentation");
    return o;}
  function list(ind){const a=[];
    while(i<lines.length&&lines[i].ind===ind&&(lines[i].text.startsWith("- ")||lines[i].text==="-")){
      const ln=lines[i];const rest=ln.text==="-"?"":ln.text.slice(2).trim();
      if(rest===""){i++;a.push(i<lines.length&&lines[i].ind>ind?block(lines[i].ind):null);continue;}
      const kv=keyval(rest);
      if(kv&&!/^["'\[{]/.test(rest)){const vind=ind+(ln.text.length-ln.text.slice(1).trimStart().length);lines[i]={ind:vind,text:rest,ri:ln.ri};a.push(map(vind));}
      else{i++;a.push(scalar(rest));}
    }
    return a;}
  if(!lines.length)return null;
  const out=block(lines[0].ind);
  if(i<lines.length)throw new Error("Line "+(lines[i].ri+1)+": unexpected indentation");
  return out;
}

// ---------- command simulators ----------
function newCmdState(kind){
  if(kind==="git")return {kind,cur:"main",branches:{main:[{id:"a1b2c3d",msg:"Initial import",files:[]}]},remote:{main:[{id:"a1b2c3d"}]},upstream:{main:"origin/main"},modified:["src/PermitSearch.cs"],staged:[]};
  return {kind,pending:["$/Permits/Main/src/FeeCalculator.cs"],shelvesets:{},changesets:[]};
}
function tokenize(l){return (l.match(/\S*"[^"]*"\S*|\S*'[^']*'\S*|\S+/g)||[]).map(t=>t.replace(/["']/g,""));}
function runCommands(text,kind){
  const s=newCmdState(kind);const out=[];
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith("#"));
  for(const line of lines){out.push("> "+line);const t=tokenize(line);
    if(t[0]==="git"){ if(kind!=="git"){out.push("This exercise is a TFVC workspace. Use tf commands.");continue;} gitCmd(s,t.slice(1),out);}
    else if(t[0]==="tf"){ if(kind!=="tf"){out.push("This exercise is a Git repo. Use git commands.");continue;} tfCmd(s,t[1]==="vc"?t.slice(2):t.slice(1),out);}
    else out.push(t[0]+": command not supported in this exercise.");}
  return {state:s,out};
}
function gitCmd(s,a,out){
  const c=a[0];
  const newBranch=(b)=>{if(!b){out.push("fatal: branch name required");return;}if(s.branches[b]){out.push("fatal: a branch named '"+b+"' already exists");return;}s.branches[b]=s.branches[s.cur].slice();s.cur=b;out.push("Switched to a new branch '"+b+"'");};
  if(c==="status"){out.push("On branch "+s.cur);if(s.staged.length)out.push("Changes to be committed:\n  "+s.staged.join("\n  "));if(s.modified.length)out.push("Changes not staged for commit:\n  modified: "+s.modified.join("\n  modified: "));if(!s.staged.length&&!s.modified.length)out.push("nothing to commit, working tree clean");}
  else if(c==="switch"||c==="checkout"){ if(a[1]==="-c"||a[1]==="-b"||a[1]==="--create")newBranch(a[2]);
    else if(s.branches[a[1]]){s.cur=a[1];out.push("Switched to branch '"+a[1]+"'");}
    else out.push("fatal: invalid reference: "+(a[1]||""));}
  else if(c==="branch"){ if(a[1]&&!a[1].startsWith("-")){if(s.branches[a[1]])out.push("fatal: a branch named '"+a[1]+"' already exists");else{s.branches[a[1]]=s.branches[s.cur].slice();out.push("(created branch "+a[1]+"; you are still on "+s.cur+")");}}
    else Object.keys(s.branches).forEach(b=>out.push((b===s.cur?"* ":"  ")+b));}
  else if(c==="add"){const p=a.slice(1);if(!p.length){out.push("Nothing specified, nothing added.");return;}
    if(p.some(x=>x==="."||x==="-A"||x==="--all")){s.staged.push(...s.modified);s.modified=[];}
    else for(const x of p){const m=s.modified.find(f=>f===x||f.endsWith("/"+x));if(m){s.staged.push(m);s.modified=s.modified.filter(f=>f!==m);}else out.push("fatal: pathspec '"+x+"' did not match any files");}}
  else if(c==="commit"){let msg=null;for(let k=1;k<a.length;k++){if(a[k]==="-m"||a[k]==="-am"){msg=a[k+1];if(a[k]==="-am"){s.staged.push(...s.modified);s.modified=[];}}}
    if(!msg){out.push("error: use -m \"message\" in this exercise");return;}
    if(!s.staged.length){out.push("nothing to commit (use \"git add\")");return;}
    const id=Math.random().toString(16).slice(2,9);s.branches[s.cur].push({id,msg,files:s.staged.slice()});out.push("["+s.cur+" "+id+"] "+msg+"\n "+s.staged.length+" file changed");s.staged=[];}
  else if(c==="push"){let up=false;const pos=[];for(const x of a.slice(1)){if(x==="-u"||x==="--set-upstream")up=true;else if(!x.startsWith("-"))pos.push(x);}
    let remote=pos[0],b=pos[1];if(b==="HEAD")b=s.cur;
    if(!remote){ if(s.upstream[s.cur]){b=s.cur;}else{out.push("fatal: The current branch "+s.cur+" has no upstream branch.\nTo push the current branch and set the remote as upstream, use\n    git push --set-upstream origin "+s.cur);return;}}
    else{ if(remote!=="origin"){out.push("fatal: '"+remote+"' does not appear to be a git repository");return;} if(!b)b=s.cur;}
    if(!s.branches[b]){out.push("error: src refspec "+b+" does not match any");return;}
    s.remote[b]=s.branches[b].slice();if(up)s.upstream[b]="origin/"+b;out.push("To origin\n * "+b+" -> "+b+(up?"\nbranch '"+b+"' set up to track 'origin/"+b+"'.":""));}
  else if(c==="log"){s.branches[s.cur].slice().reverse().forEach(x=>out.push(x.id+" "+x.msg));}
  else if(c==="pull"||c==="fetch"){out.push("Already up to date.");}
  else out.push("git "+(c||"")+": not supported in this exercise (try status, switch, add, commit, push, log).");
}
function tfCmd(s,a,out){
  const c=(a[0]||"").toLowerCase();
  const opts=a.slice(1).filter(x=>x.startsWith("/")||x.startsWith("-"));const pos=a.slice(1).filter(x=>!(x.startsWith("/")||x.startsWith("-")));
  if(c==="status"){out.push(s.pending.length?"File name   Change   Local path\n"+s.pending.map(p=>p.split("/").pop()+"   edit   "+p).join("\n"):"There are no pending changes.");}
  else if(c==="shelve"){const name=pos[0];if(!name){out.push("The shelveset name is required in this exercise: tf shelve <name>");return;}
    if(!s.pending.length){out.push("There are no pending changes to shelve.");return;}
    if(s.shelvesets[name]&&!opts.some(o=>/replace/i.test(o))){out.push("A shelveset named "+name+" already exists. Use /replace.");return;}
    s.shelvesets[name]=s.pending.slice();if(opts.some(o=>/move/i.test(o)))s.pending=[];out.push("Shelveset "+name+" successfully created.");}
  else if(c==="checkin"){if(!s.pending.length){out.push("There are no pending changes.");return;}const id=1000+s.changesets.length+1;s.changesets.push({id,files:s.pending.slice()});s.pending=[];out.push("Changeset #"+id+" checked in.");}
  else if(c==="undo"){s.pending=[];out.push("Undoing edit: FeeCalculator.cs");}
  else if(c==="unshelve"){out.push(s.shelvesets[pos[0]]?"Unshelved "+pos[0]:"Shelveset not found.");}
  else if(c==="shelvesets"){out.push(Object.keys(s.shelvesets).join("\n")||"No shelvesets found.");}
  else if(c==="get"){out.push("All files are up to date.");}
  else out.push("tf "+c+": not supported in this exercise (try status, shelve, shelvesets, checkin, undo).");
}

// ---------- HTTP request parser ----------
function parseReq(method,url,headers,body){
  const h={};String(headers).split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*([^:]+):\s*(.*)$/);if(m)h[m[1].trim().toLowerCase()]=m[2].trim();});
  let path=String(url).trim().replace(/^https?:\/\/[^/]+/i,"");let json=null,jsonErr=null;
  if(String(body).trim()){try{json=JSON.parse(body);}catch(e){jsonErr=e.message;}}
  return {method:String(method).toUpperCase(),path,h,body,json,jsonErr};
}

const WORKER_SRC = `self.onmessage=async(e)=>{const {code,tests}=e.data;const logs=[];const con={log:(...a)=>logs.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')),error:(...a)=>logs.push(a.join(' '))};
try{const body=code+"\\n;return async function(){const R=[];"+tests.map((t,i)=>"try{R.push(["+i+",!!(await ("+t+"))])}catch(e){R.push(["+i+",false,String(e&&e.message||e)])}").join("\\n")+";return R;}";
const f=new Function('console',body);const run=f(con);const R=await run();postMessage({ok:true,R,logs});}catch(err){postMessage({ok:false,error:String(err&&err.message||err),logs});}};`;
let workerURL=null;
function runInWorker(code,tests,timeout=2500){
  return new Promise(resolve=>{
    try{ if(!workerURL)workerURL=URL.createObjectURL(new Blob([WORKER_SRC],{type:"text/javascript"}));
      const w=new Worker(workerURL);const tm=setTimeout(()=>{w.terminate();resolve({ok:false,error:"Timed out after "+timeout/1000+"s (infinite loop?)",logs:[]});},timeout);
      w.onmessage=e=>{clearTimeout(tm);w.terminate();resolve(e.data);};
      w.onerror=e=>{clearTimeout(tm);w.terminate();resolve({ok:false,error:e.message||"Worker error",logs:[]});e.preventDefault&&e.preventDefault();};
      w.postMessage({code,tests});
    }catch(err){resolve({ok:false,error:"Can't start the code runner here: "+err.message,logs:[]});}
  });
}
async function compileTS(src){

    const diags=(r.diagnostics||[]).map(d=>window.ts.flattenDiagnosticMessageText(d.messageText,"\n"));
    return {js:r.outputText.replace(/^\s*export\s*\{\s*\};?\s*$/m,""),diags,compiled:true};}

}
// Fallback when the TypeScript compiler can't load: handles the simple annotations used here.
function stripTypesNaive(s){
  return s.replace(/^\s*type\s+\w+\s*=[^;]*;\s*$/gm,"").replace(/\babstract\s+(\w+\([^)]*\)\s*:\s*[^;]+;)/g,"").replace(/\babstract\s+class/g,"class")
   .replace(/\b(private|public|protected|readonly)\s+(?=\w+\s*[:,)])/g,(m)=>"").replace(/(\w)\s*\?\s*:/g,"$1:")
   .replace(/<[A-Z]\w*(\s+extends\s+[^>]+)?(,\s*[A-Z]\w*(\s+extends\s+[^>]+)?)*>(?=\s*\()/g,"")
   .replace(/:\s*[A-Za-z_][\w<>\[\]|&,\s'".()=>]*?(?=\s*[=,){;]|\s*=>)/g,"").replace(/\s+as\s+[A-Za-z_][\w<>\[\],]{0,80}/g,"");

const KEY="leadSweStudy.v1";
let canSave=true;
function freshState(){return {v:1,start:todayStr(),ev:{},passed:{},starBest:{},cards:{},extraCards:[],mistakes:[],stories:[],days:{},best:{},newIntro:{}};}
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)return Object.assign(freshState(),o);}}catch(e){canSave=false;}return freshState();}

function markDay(kind){const d=todayStr();S.days[d]=S.days[d]||{review:0,task:0,star:0};S.days[d][kind]++;}

function addEvidence(item,score,w){S.ev[item]=S.ev[item]||[];S.ev[item].push({s:Math.max(0,Math.min(100,Math.round(score))),w,t:Date.now()});if(S.ev[item].length>40)S.ev[item]=S.ev[item].slice(-40);}
function mastery(id){
  const ev=S.ev[id]||[];if(!ev.length)return 0;
  let num=0,den=0,wsum=0;const n=ev.length;
  ev.forEach((e,k)=>{const r=Math.pow(0.88,n-1-k);num+=e.s*e.w*r;den+=e.w*r;wsum+=e.w;});
  let m=(num/den)*Math.min(1,wsum/2.5);
  const last=ev[n-1].t;const idle=(Date.now()-last)/86400000;
  if(idle>21)m*=Math.pow(0.97,(idle-21)/7);
  return Math.round(m);
}
function isReady(id){return mastery(id)>=80&&!!S.passed[id]&&(S.starBest[id]||0)>=3;}
function fading(id){const ev=S.ev[id]||[];if(!ev.length)return false;return (Date.now()-ev[ev.length-1].t)/86400000>21;}
function streak(){
  const active=d=>{const x=S.days[d];return x&&(x.review+x.task+x.star)>0;};
  let d=todayStr();if(!active(d))d=addDays(d,-1);
  let n=0,gap=0;
  for(let k=0;k<400;k++){ if(active(d)){n++;gap=0;} else {gap++; if(gap>1)break;} d=addDays(d,-1);}
  return n;
}
const dayWord=n=>n+(n===1?" day":" days");
function studyWeek(){return Math.max(1,Math.floor(daysBetween(S.start,todayStr())/7)+1);}

// ---------- spaced repetition (SM-2) ----------
function allCards(){return CARDS.concat(S.extraCards);}
function cardState(id){return S.cards[id];}
function dueCards(filterItem){
  const t=todayStr();const cards=allCards().filter(c=>!filterItem||c.item===filterItem);
  const due=cards.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t);
  const introduced=S.newIntro[t]||0;
  const limit=filterItem?99:Math.max(0,12-introduced);
  const fresh=cards.filter(c=>!S.cards[c.id]);
  return due.concat(filterItem?fresh:fresh.slice(0,limit));
}
// q: 1 again, 3 hard, 4 good, 5 easy
function gradeCard(card,q){
  const t=todayStr();
  let c=S.cards[card.id];
  if(!c){c={ef:2.5,int:0,reps:0,due:t};S.newIntro[t]=(S.newIntro[t]||0)+1;}
  if(q<3){c.reps=0;c.int=1;}
  else{c.reps++;c.int=c.reps===1?1:c.reps===2?3:Math.round(c.int*c.ef);if(q===3)c.int=Math.max(1,Math.round(c.int*0.7));}
  c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  c.due=addDays(t,c.int);S.cards[card.id]=c;
  addEvidence(card.item,q>=4?100:q===3?60:0,0.5);markDay("review");save();
}

// ---------- recording results ----------
function record(task,res,hintsUsed,opts={}){
  const credit=Math.max(0,1-0.15*hintsUsed);
  const score=Math.round(res.score*credit);
  const w=task.type==="write"?0.5:1;
  task.ksa.forEach(id=>{addEvidence(id,score,w);if(res.pass&&task.type!=="write")S.passed[id]=true;});
  S.best[task.id]=Math.max(S.best[task.id]||0,score);
  if(!res.pass){
    (res.checks||[]).filter(c=>!c.ok).forEach(c=>S.mistakes.unshift({d:todayStr(),task:task.id,title:task.title,check:c.l,ans:(res.answer||"").slice(0,400),ex:task.explain||""}));
    if(!(res.checks||[]).some(c=>!c.ok))S.mistakes.unshift({d:todayStr(),task:task.id,title:task.title,check:"Score below pass mark ("+score+"%)",ans:(res.answer||"").slice(0,400),ex:task.explain||""});
    S.mistakes=S.mistakes.slice(0,300);
    const mid="mk-"+task.id;
    if(!S.extraCards.some(c=>c.id===mid)&&task.explain)S.extraCards.push({id:mid,item:task.ksa[0],q:"From your mistakes log: "+task.title.replace(/<[^>]+>/g,"")+". What's the key point?",a:task.explain});
  }
  markDay("task");save();
  return score;
}

    out.innerHTML=`<div class="result ${res.pass?"ok":"bad"}"><b>${res.pass?"Passed":"Not yet"}</b> \u00B7 score ${score}%${hintsUsed?` (after ${hintsUsed} hint${hintsUsed>1?"s":""})`:""}
