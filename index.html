// ============================== LESSONS ==============================
// One lesson per module: what it is, how it works, key terms, exactly what to read, and a self-check.
// Shape: {what, how:[steps], terms:[[term, meaning]], read:[[title, url, what to read]], check:[questions]}
// Competency behaviors carry their lesson inside COMPETENCIES (behavior.lesson); they are merged below.
const LESSONS = {
 M1:{what:"Interview panels can't measure five years of work directly, so they sample it with behavioral questions ('Tell me about a time...'). Your experience only counts if you can turn it into short, specific, measured stories that map to the posting.",
  how:["List every project from the last 5-8 years: system, your role, team size, dates, what changed because of you.","Cluster them under the posting's themes: architecture, delivery/CI-CD, security, Azure/IIS, leadership and mentoring, cross-team work.","Write one STAR story per cluster: Situation (when, where, who), Task (what you owned), Action (what you did, in 'I' statements), Result (a number: time, money, defects, users).","Tag each story to 2-3 posting items and keep them in the story bank here; aim for 8 stories that cover all groups.","Rehearse out loud at 90 seconds each; the Result and the lesson learned are what panels remember."],
  terms:[["STAR","Situation, Task, Action, Result: the standard structure for a behavioral answer."],["Behavioral question","A question about something you actually did, used to predict future behavior."],["Quantified result","A result with a number or a before/after comparison; 'faster' is weak, '40% fewer failed deploys' is strong."]],
  read:[["MIT CAPD: the STAR method for behavioral interviews","https://capd.mit.edu/resources/the-star-method-for-behavioral-interviews/","Short page; note the examples of weak vs. strong Results. 10 minutes."],["StaffEng: guides for senior engineers","https://staffeng.com/guides/","Skim 'Promo packets' for how to present impact with evidence. 15 minutes."]],
  check:["Can you name 8 stories and the 2-3 posting items each one proves?","Does every story end with a number?","Can you tell your strongest story in 90 seconds without notes?"]},
 M2:{what:"The degree requirement is a checkbox, but panels still probe computer-science fundamentals lightly: how fast an operation is as data grows (Big-O) and which data structure fits a problem.",
  how:["Big-O describes how time or memory grows with input size n, ignoring constants: O(1) constant, O(log n) binary search, O(n) one pass, O(n log n) good sorts, O(n^2) nested loops.","Pick structures by their operations: array/list for index access, dictionary/hash map for key lookup in O(1) average, set for membership, queue/stack for order, sorted structure or heap for 'smallest next'.","In C#: List<T>, Dictionary<TKey,TValue>, HashSet<T>, Queue<T>, Stack<T>, SortedDictionary; in TypeScript: Array, Map, Set.","Spot the common fix: a lookup inside a loop (O(n^2)) becomes a dictionary built once plus O(1) lookups (O(n)).","Have a one-line answer ready about your education and any equivalent experience."],
  terms:[["Big-O","Upper bound on growth of running time or memory as input grows."],["Hash map / Dictionary","Key-value store with O(1) average lookup; keys need a good hash and equality."],["Amortized","Average cost over many operations, e.g. List<T>.Add is O(1) amortized despite occasional resizes."]],
  read:[["Big-O Cheat Sheet","https://www.bigocheatsheet.com/","Read the table of common data structures and their operation costs. 10 minutes."],["Microsoft Learn: collections and data structures in .NET","https://learn.microsoft.com/en-us/dotnet/standard/collections/","Read 'Choose a collection' and the algorithmic complexity notes. 15 minutes."]],
  check:["Can you explain why a nested loop over two lists is O(n*m) and how a dictionary fixes it?","Which .NET collection gives O(1) key lookup, and what does it need from the key type?","What is the complexity of binary search, and what must be true of the data?"]},
 K1:{what:"Software architecture is the set of decisions that are expensive to change: how the system is split into parts, how they talk, where data lives, and what qualities (performance, security, changeability) the design protects. A lead must choose a style, explain the trade-offs, and record the decision.",
  how:["Start from quality attributes and constraints: team size, deployment environment (IIS? Azure?), data sensitivity, expected load, how often parts change.","Pick a style: a layered or modular monolith (one deployable, clear module boundaries) for small teams; microservices only when teams and release cadences truly differ.","Draw it at two levels with C4: a Context diagram (system, users, external systems) and a Container diagram (web app, API, database, queue).","Write an ADR for each big decision: context, options considered, decision, consequences. Keep them in the repo next to the code.","Protect boundaries in code: interfaces between modules, no shared database tables across modules, dependency direction toward the core."],
  terms:[["Modular monolith","One deployable application with strict internal module boundaries; often the safest start for a small team."],["C4 model","Four zoom levels of diagrams: Context, Container, Component, Code."],["ADR","Architecture Decision Record: a short dated document capturing one decision and why."],["Coupling and cohesion","Coupling: how much parts depend on each other (want low). Cohesion: how related the things inside a part are (want high)."]],
  read:[["Azure Architecture Center: application architecture fundamentals","https://learn.microsoft.com/en-us/azure/architecture/guide/","Read the overview and 'Architecture styles'. 25 minutes."],["The C4 model","https://c4model.com/","Read the Context and Container diagram sections and look at the examples. 15 minutes."],["Architecture decision records","https://adr.github.io/","Read the home page and one template (MADR). 10 minutes."]],
  check:["Can you argue for a modular monolith over microservices for a 5-person team, and name when you'd split?","Can you draw a C4 container diagram for a web app with an API, a database and a nightly job?","What four sections does an ADR have?"]},
 K2:{what:"The posting's languages are C# (back end), TypeScript and Angular (front end). Panels test the language features a lead uses daily: object orientation, generics, async/await, LINQ in C#; types, generics and narrowing in TypeScript; components and dependency injection in Angular.",
  how:["C# classes vs. interfaces vs. records: classes hold state and behavior, interfaces declare contracts, records are immutable value-like types with built-in equality.","async/await: an async method returns a Task; await yields the thread until the work completes. Never block with .Result or .Wait() in web code (deadlocks, thread starvation).","LINQ is deferred: a query over IEnumerable runs when you enumerate it; call ToList() when you need the results once. Against a database, LINQ translates to SQL.","TypeScript types are structural; union types ('Open' | 'Closed') plus narrowing (typeof, in, discriminated unions) replace many runtime checks; generics (<T>) keep functions reusable and typed.","Angular: a component is a class plus a template; services are injected through constructors or inject(); signals and OnPush keep rendering cheap."],
  terms:[["virtual / override vs. new","override replaces a base method polymorphically; new hides it and only applies through the derived type."],["Deferred execution","A LINQ query is a description of work; it runs when enumerated."],["Discriminated union","A TypeScript union where each member has a literal 'kind' field so narrowing is safe."],["Dependency injection","Objects receive their collaborators from a container instead of creating them."]],
  read:[["Microsoft Learn: asynchronous programming with async and await (C#)","https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/","Read the overview page; note the 'don't block' guidance. 20 minutes."],["Microsoft Learn: LINQ in C#","https://learn.microsoft.com/en-us/dotnet/csharp/linq/","Read the overview and 'deferred execution'. 15 minutes."],["TypeScript Handbook: narrowing","https://www.typescriptlang.org/docs/handbook/2/narrowing.html","Read through 'Discriminated unions'. 20 minutes."],["TypeScript Handbook: generics","https://www.typescriptlang.org/docs/handbook/2/generics.html","Read through 'Generic constraints'. 15 minutes."]],
  check:["What prints when a base-class reference calls a method marked 'new' in the derived class?","Why does calling .Result on a Task in an ASP.NET request risk a deadlock?","Write a TypeScript function that narrows a union of {kind:'a'} | {kind:'b'} safely."]},
 K3:{what:"Best practices, patterns and principles are the shared vocabulary for good code: SOLID principles, a dozen Gang of Four patterns, and the habits that make reviews useful. A lead names a pattern in code, spots a smell, and reviews for design and correctness before style.",
  how:["SOLID in one line each: Single responsibility (one reason to change), Open/closed (extend without editing), Liskov (subtypes keep the contract), Interface segregation (small interfaces), Dependency inversion (depend on abstractions).","Know the patterns you will actually see in a C#/Angular codebase: Strategy, Factory, Adapter, Decorator, Observer, Repository, Unit of Work, Dependency Injection, Mediator, Singleton (and why DI replaces it).","Recognize smells: long method, feature envy, primitive obsession, switch on type, duplicated code, god class. Each smell points to a refactoring.","Review order: correctness, design and boundaries, tests, readability, then style (let a formatter handle style).","Write review comments as questions or suggestions with a reason; distinguish 'must fix' from 'nit'."],
  terms:[["Strategy","Swap an algorithm at runtime by injecting an interface implementation."],["Decorator","Wrap an object to add behavior (logging, caching) without changing it."],["Repository / Unit of Work","Abstractions over data access and transactions; EF Core's DbContext is already a unit of work."],["Code smell","A surface sign of a deeper design problem; not a bug by itself."]],
  read:[["Refactoring.Guru: design patterns catalog","https://refactoring.guru/design-patterns/catalog","Open Strategy, Decorator, Adapter, Observer and Factory Method; read 'Intent' and 'Applicability' for each. 30 minutes."],["Refactoring.Guru: code smells","https://refactoring.guru/refactoring/smells","Skim the categories; read Long Method and Switch Statements. 15 minutes."],["Google Engineering Practices: how to do a code review","https://google.github.io/eng-practices/review/reviewer/","Read 'The standard of code review' and 'What to look for'. 20 minutes."]],
  check:["Which pattern removes a switch on a type code, and how?","Name the five SOLID principles and one violation of each you have seen.","In what order do you review a pull request, and why is style last?"]},
 K4:{what:"'DevOps in code' means the delivery process itself is versioned and automated: branching rules, pipelines, infrastructure and tests live in the repository. The posting names Azure DevOps, TFVC and GitHub, so you need Git fluency, a branching strategy, pull-request policies and an understanding of how TFVC differs.",
  how:["Git is distributed: every clone has full history; you commit locally, then push and open a pull request. TFVC is centralized: you check out and check in against the server, and shelvesets park uncommitted work.","Choose a branching strategy: trunk-based (short-lived branches, frequent merges to main, feature flags) or GitFlow (develop/release/hotfix branches). Small teams deploying often should prefer trunk-based.","Protect main with policies: require a pull request, minimum reviewers, a passing build, linked work items, no direct pushes.","Keep delivery in code: azure-pipelines.yml or GitHub Actions workflows, infrastructure as code (Bicep/Terraform), test suites, and scripts, all reviewed like application code.","Measure with DORA metrics: deployment frequency, lead time, change failure rate, time to restore."],
  terms:[["Trunk-based development","Everyone integrates to main at least daily; branches live hours to a couple of days."],["Pull request (PR)","A reviewed, policy-gated merge into a protected branch."],["Shelveset (TFVC)","Server-side storage of pending changes without checking them in."],["Infrastructure as code","Environments defined in files (Bicep, ARM, Terraform) and deployed by pipelines."]],
  read:[["Azure Repos: adopt a Git branching strategy","https://learn.microsoft.com/en-us/azure/devops/repos/git/git-branching-guidance","Read the whole page; note 'Keep main shippable'. 20 minutes."],["Azure Repos: choose the right version control (Git vs. TFVC)","https://learn.microsoft.com/en-us/azure/devops/repos/tfvc/comparison-git-tfvc","Read the comparison table. 10 minutes."],["Trunk Based Development","https://trunkbaseddevelopment.com/","Read the home page and 'Short-lived feature branches'. 15 minutes."],["DORA: software delivery capabilities","https://dora.dev/capabilities/","Skim the list; open 'Version control' and 'Continuous integration'. 15 minutes."]],
  check:["Explain commit/push/pull request in Git versus check-in/shelve in TFVC.","Which branch policies would you set on main, and why each?","What are the four DORA metrics?"]},
 K5:{what:"Agile here means Scrum and Kanban as defined in their official guides, plus the software development life cycle around them: requirements, design, build, test, release, operate. Panels ask about roles, events, artifacts, WIP limits and your Definition of Done.",
  how:["Scrum: one team with three accountabilities (Product Owner, Scrum Master, Developers); five events (the Sprint, Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective); three artifacts with commitments (Product Backlog with the Product Goal, Sprint Backlog with the Sprint Goal, Increment with the Definition of Done).","Sprint Planning answers why (goal), what (items that fit capacity and dependencies) and how (plan).","Kanban: visualize the workflow, limit work in progress, manage flow with metrics (cycle time, throughput, work item age), make policies explicit, improve together.","SDLC phases still exist inside every sprint; the Definition of Done makes them explicit (reviewed, tested, documented, deployed to staging, accessibility checked).","Flow problems show as growing WIP and aging items; the fix is finishing before starting, not more people."],
  terms:[["Sprint Goal","The single objective for the sprint; the Sprint Backlog's commitment."],["Definition of Done","The quality bar an Increment must meet to be releasable."],["WIP limit","A cap on items in a workflow state; forces finishing work."],["Cycle time","Time from starting an item to finishing it."]],
  read:[["The 2020 Scrum Guide","https://scrumguides.org/scrum-guide.html","Read it end to end (about 13 pages). 30 minutes."],["The Kanban Guide","https://kanbanguides.org/english/","Read 'Definition of Workflow' and 'Flow metrics'. 20 minutes."],["Scrum.org: Scrum Open assessment","https://www.scrum.org/open-assessments/scrum-open","Take it once; aim for 85%+. 20 minutes."]],
  check:["List the five Scrum events and what each produces.","What are the four Kanban flow metrics?","What is in your team's Definition of Done, and who owns it?"]},
 K6:{what:"Staying current is a habit plus a method: a few trusted sources, a way to evaluate a technology (fit, risk, cost, skills, exit plan), and a record of what you decided. Panels want one concrete example of a technology you evaluated and what happened.",
  how:["Keep two or three sources: release notes for your stack (.NET, Angular, Azure updates), the ThoughtWorks Technology Radar, DORA research.","Place a candidate on your own radar: Adopt, Trial, Assess or Hold, with a one-paragraph reason.","Evaluate with a checklist: problem it solves, maturity and support dates, team skills, security and compliance (data leaving your network, licensing), operating cost, exit plan.","Run a time-boxed spike with a clear question and a decision date; write down the result as an ADR.","Share the outcome: a short note to the team and stakeholders, including what you rejected and why."],
  terms:[["Technology radar","A visual of technologies in rings: Adopt, Trial, Assess, Hold."],["Spike","A time-boxed investigation that produces knowledge, not product code."],["Exit plan","How you would leave a technology if it fails; a sign of a mature evaluation."]],
  read:[["ThoughtWorks Technology Radar: FAQ","https://www.thoughtworks.com/radar/faq","Read what the rings and quadrants mean. 10 minutes."],["ThoughtWorks: build your own radar","https://www.thoughtworks.com/radar/byor","Read the steps; start a radar with 10 items from your stack. 20 minutes."],["DORA research","https://dora.dev/research/","Skim the latest report summary. 15 minutes."]],
  check:["Describe one technology you evaluated: question, spike, decision, outcome.","Which ring would you put AI code assistants in for your team, and why?","What belongs on your evaluation checklist in a regulated organization?"]},
 K7:{what:"Azure cloud infrastructure for a .NET web team means the services you host, store and secure with: resource groups, App Service, Functions, Azure SQL, Storage, virtual networks, Key Vault with managed identities, role-based access control, and monitoring with Application Insights.",
  how:["Organize with subscriptions and resource groups; everything in a group shares a lifecycle and gets tagged (owner, environment, cost center).","Host web apps on App Service plans (compute) with one or more apps; use deployment slots for staging and swaps; Functions for event-driven jobs.","Keep secrets out of config: store them in Key Vault, give the app a managed identity, grant it access, and reference secrets as @Microsoft.KeyVault(...) in app settings.","Control access with RBAC roles at the narrowest scope (Reader, Contributor, specific data roles); avoid shared keys.","Observe and budget: Application Insights for traces, requests and failures; Azure Monitor alerts; budgets and cost analysis per resource group."],
  terms:[["Resource group","A container for related Azure resources with one lifecycle and access boundary."],["Managed identity","An Entra ID identity Azure manages for a resource, so the app authenticates without stored credentials."],["Key Vault reference","An app setting value that App Service resolves from Key Vault at runtime."],["RBAC","Role-based access control: who can do what, at which scope."]],
  read:[["Microsoft Learn: App Service overview","https://learn.microsoft.com/en-us/azure/app-service/overview","Read the overview; note plans, slots and security sections. 15 minutes."],["Microsoft Learn: managed identities for App Service","https://learn.microsoft.com/en-us/azure/app-service/overview-managed-identity","Read 'Add a system-assigned identity' and the connection examples. 15 minutes."],["Microsoft Learn: Key Vault references for App Service","https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references","Read the reference syntax and the access-policy steps. 10 minutes."],["Microsoft Learn: Application Insights overview","https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview","Read what it collects and how to enable it. 10 minutes."]],
  check:["Walk through moving a connection string from app settings to Key Vault with a managed identity.","What does a deployment slot swap do to settings marked 'slot setting'?","Where would you look first when an App Service returns 500s after a deploy?"]},
 K8:{what:"IIS (Internet Information Services) is Windows' web server. Administering it means sites, bindings, application pools, the configuration files, URL Rewrite, request filtering and logs, plus scripting with appcmd or PowerShell. Many .NET shops still run IIS on Windows servers, and ASP.NET Core on IIS has its own hosting rules.",
  how:["A site is a set of bindings plus a root application. A binding is protocol + IP:port:hostname; several HTTPS sites on one IP need a host name and SNI (sslFlags=1) so IIS can pick the right certificate.","Each application runs in an application pool: a worker process (w3wp.exe) with an identity, .NET CLR version (or 'No Managed Code' for ASP.NET Core), and recycling settings. Isolate apps in separate pools.","Configuration lives in applicationHost.config (server level) and web.config (site/app level); web.config can be locked down with configuration locking.","Diagnose by status code: 500.19 means a configuration error (often a locked section or a bad web.config), 503 usually means the app pool stopped or is disabled, 404.x request filtering blocks, 401.x authentication.","Automate: appcmd list sites / add site, or the IISAdministration PowerShell module; read logs in %SystemDrive%\\inetpub\\logs\\LogFiles and Failed Request Tracing for details."],
  terms:[["Binding","Protocol, IP address, port and host name that route a request to a site."],["SNI","Server Name Indication: the TLS client sends the host name so one IP can serve many certificates."],["Application pool","The worker process boundary (identity, runtime, recycling) that hosts one or more apps."],["ASP.NET Core Module","The IIS module that forwards requests to the Kestrel process (out-of-process) or hosts the app in-process."]],
  read:[["Microsoft Learn: IIS site bindings (configuration reference)","https://learn.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/site/bindings/binding","Read the attributes, especially bindingInformation and sslFlags. 10 minutes."],["Microsoft Learn: IIS 8.0 Server Name Indication (SNI)","https://learn.microsoft.com/en-us/iis/get-started/whats-new-in-iis-8/iis-80-server-name-indication-sni-ssl-scalability","Read the overview and the binding steps. 10 minutes."],["Microsoft Learn: host ASP.NET Core on Windows with IIS","https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/iis/","Read 'Hosting Bundle', 'Application pools' and the in-process vs out-of-process section. 20 minutes."],["Microsoft Learn: troubleshoot HTTP 500.19 errors in IIS","https://learn.microsoft.com/en-us/troubleshoot/developer/webapps/iis/health-diagnostic-performance/http-error-500-19-webpage","Skim the causes by HRESULT. 10 minutes."]],
  check:["Write the binding for https://permits.example.com on a shared IP with SNI.","Why should an ASP.NET Core app pool be set to 'No Managed Code'?","A site returns 503 after a deploy: what do you check first?"]},
 K9:{what:"HTTP methods are the verbs of web APIs: GET reads, POST creates or triggers, PUT replaces, PATCH partially updates, DELETE removes. Knowing which are safe and idempotent, which status codes to return, and how headers, caching and CORS work is the base of every REST question.",
  how:["Safe methods (GET, HEAD, OPTIONS) don't change state. Idempotent methods (GET, HEAD, PUT, DELETE, OPTIONS) give the same result when repeated; POST and PATCH are not idempotent by default.","Status codes: 200 OK, 201 Created (with a Location header), 204 No Content, 400 Bad Request, 401 Unauthorized (not authenticated), 403 Forbidden, 404 Not Found, 409 Conflict, 422 Unprocessable Content, 429 Too Many Requests, 500/503 server side.","Headers carry metadata: Content-Type and Accept for formats, Authorization for credentials, Cache-Control and ETag for caching, Idempotency-Key for safe POST retries.","Caching: Cache-Control: max-age, no-store; ETag with If-None-Match returns 304 Not Modified.","CORS: the browser blocks cross-origin responses unless the server sends Access-Control-Allow-Origin (exact origin when credentials are used, never * with credentials); preflight OPTIONS requests check methods and headers."],
  terms:[["Idempotent","Repeating the request has the same effect as doing it once; safe to retry."],["Preflight","The OPTIONS request a browser sends before a non-simple cross-origin request."],["ETag","A version identifier for a resource used for caching and optimistic concurrency."],["RFC 9110","The current HTTP semantics specification."]],
  read:[["MDN: HTTP request methods","https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods","Read the overview and the pages for PUT and PATCH. 15 minutes."],["MDN: HTTP response status codes","https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status","Read the 2xx and 4xx sections. 15 minutes."],["MDN: HTTP caching","https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching","Read through 'Validation'. 20 minutes."],["MDN: Cross-Origin Resource Sharing (CORS)","https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS","Read 'Simple requests', 'Preflighted requests' and 'Requests with credentials'. 20 minutes."]],
  check:["Which methods are idempotent, and why does that matter for retries?","What is the difference between 401 and 403?","Why is Access-Control-Allow-Origin: * invalid with credentials?"]},
 K10:{what:"Angular is the posting's front-end framework. A responsive UI means components, routing, forms and HttpClient done the Angular way, layouts that work from phone to desktop, and accessibility built in rather than bolted on.",
  how:["Components are standalone classes with templates; inputs and outputs connect them; signals (signal, computed, effect) hold reactive state and work with OnPush change detection.","Routing maps URLs to components with lazy-loaded routes; guards protect routes; resolvers prefetch data.","Forms: reactive forms (FormGroup, FormControl, validators) for anything non-trivial; show validation messages tied to controls.","HttpClient returns Observables; use interceptors for auth headers and errors; unsubscribe automatically with the async pipe or toSignal.","Responsive and accessible: CSS grid/flexbox with media queries or container queries, native elements first, focus management after navigation, aria-current on the active link, test with keyboard and a screen reader."],
  terms:[["Signal","A reactive value; reading it in a template subscribes the view to changes."],["OnPush","Change detection only when inputs change or a signal/observable used in the template emits."],["Standalone component","A component that declares its own imports instead of belonging to an NgModule (the default)."],["Interceptor","A function that sees every HttpClient request/response (auth tokens, logging, retries)."]],
  read:[["angular.dev: Essentials","https://angular.dev/essentials","Read all pages in the Essentials section. 30 minutes."],["angular.dev: Signals","https://angular.dev/guide/signals","Read the overview: signal, computed, effect. 15 minutes."],["angular.dev: Reactive forms","https://angular.dev/guide/forms/reactive-forms","Read through 'Validating form input'. 20 minutes."],["angular.dev: Accessibility best practices","https://angular.dev/best-practices/a11y","Read the whole page. 15 minutes."],["MDN: responsive design","https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Responsive_Design","Read 'Media queries' and 'Flexible grids'. 15 minutes."]],
  check:["Explain how a signal in a template interacts with OnPush change detection.","Why prefer the async pipe over manual subscribe in a component?","What do you do about focus when a route changes?"]},
 S1:{what:"Producing a RESTful API means designing resources, URIs, methods, status codes, versioning, paging and errors so clients can use it predictably; consuming one means handling timeouts, retries and failures without making things worse.",
  how:["Model nouns as plural resources (/api/permits, /api/permits/42, /api/permits/42/inspections); no verbs in paths; actions become sub-resources or state changes via PATCH/POST.","Use methods and codes consistently: GET 200, POST 201 + Location, PUT 200/204, PATCH 200/204, DELETE 204, conflicts 409, validation 400/422.","Return errors as RFC 9457 problem details (type, title, status, detail, instance) with the right status code.","Version in the path (/api/v1) or a header; page large collections (page/pageSize or cursor) and return totals or next links; filter and sort with query parameters.","Consume defensively: set timeouts, retry only safe/idempotent calls on 429/503 with exponential backoff and jitter, honor Retry-After, use an Idempotency-Key for POST, and fail fast with a circuit breaker."],
  terms:[["Resource","A named thing the API exposes, identified by a URI."],["Problem details (RFC 9457)","A standard JSON error body: type, title, status, detail, instance."],["Exponential backoff with jitter","Retry delays that grow (1s, 2s, 4s) with randomness to avoid thundering herds."],["Circuit breaker","Stops calling a failing dependency for a while so it can recover."]],
  read:[["Azure Architecture Center: RESTful web API design","https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design","Read through 'Versioning'. 30 minutes."],["RFC 9457: Problem Details for HTTP APIs","https://www.rfc-editor.org/rfc/rfc9457","Read sections 3 and 4 (the members and an example). 15 minutes."],["Microsoft Learn: create a web API with ASP.NET Core (tutorial)","https://learn.microsoft.com/en-us/aspnet/core/tutorials/first-web-api","Build it; it is the week-5 project. 60 minutes."],["Azure Architecture Center: Retry pattern","https://learn.microsoft.com/en-us/azure/architecture/patterns/retry","Read 'Issues and considerations'. 10 minutes."]],
  check:["Design the routes and codes for list, get, create, replace, patch and delete of a permit.","Which calls may you retry automatically, and how do you space the retries?","What fields does a problem-details error body carry?"]},
 S2:{what:"Giving technical direction means the team ships better because you are there: you unblock people by teaching, you run design reviews that catch problems early, and you set a few standards the team agrees to and tools enforce. The skill is multiplying others, not doing everything yourself.",
  how:["Unblock by asking questions first (what have you tried, what did you expect), then pair or point to the right resource; leave the person able to do it next time.","Hold lightweight design reviews before big work: a one-page design (problem, options, decision, risks) read asynchronously, then a 30-minute discussion ending in a recorded decision.","Set standards together: coding conventions, PR size, test expectations, definition of done; encode them in analyzers, formatters and pipeline checks so reviews stay about design.","Write things down: runbooks, ADRs, a team handbook page; writing scales further than meetings.","Protect focus: batch interruptions, hold office hours, and take the on-call or escalation load that would otherwise land on juniors."],
  terms:[["Design doc","A short document that gets review before code: problem, options, decision, risks."],["Analyzer","A tool (Roslyn analyzers, ESLint) that enforces coding rules automatically."],["Office hours","A fixed time when anyone can bring a question; reduces random interruptions."]],
  read:[["StaffEng: work on what matters","https://staffeng.com/guides/work-on-what-matters/","Read the whole guide. 15 minutes."],["Google Engineering Practices: the CL author's guide","https://google.github.io/eng-practices/review/developer/","Read 'Small CLs' and 'How to write a CL description'; these become team standards. 15 minutes."],["Lara Hogan: questions for your first 1:1s","https://larahogan.me/blog/first-one-on-one-questions/","Read the question list; pick five for your own 1:1s. 10 minutes."]],
  check:["How do you unblock a developer without taking over their work?","What goes in a one-page design, and what ends the review?","Name three standards your team should enforce with tools instead of reviews."]},
 S3:{what:"Project management principles in IT: scope, estimates, schedule, risk and stakeholder communication, applied inside an agile team. A lead keeps a RAID log, presents options instead of saying yes when dates move, and reports status people can act on.",
  how:["Define scope and success criteria up front; break work into slices that deliver value early.","Estimate relatively (story points or t-shirt sizes) and forecast from measured throughput, not wishes; give ranges, not single dates.","Keep a RAID log: Risks (might happen), Assumptions (believed true), Issues (happening now), Dependencies (others we wait on), each with an owner and a date.","When scope or dates change, present options with impacts: cut scope, add people (slowly), move the date, or accept risk; let the stakeholder choose.","Report status weekly in one screen: goal, done, next, risks, decisions needed; map stakeholders by interest and influence to decide who hears what and how often."],
  terms:[["RAID log","Risks, Assumptions, Issues, Dependencies with owners and dates."],["Iron triangle","Scope, time and cost (people): change one and the others move."],["Stakeholder map","Who cares and who decides, plotted by interest and influence."],["Change control","A visible decision about a change to scope, date or budget, not a silent absorb."]],
  read:[["Atlassian Agile Coach: agile estimation","https://www.atlassian.com/agile/project-management/estimation","Read the whole article. 15 minutes."],["Atlassian: how to create a risk register","https://www.atlassian.com/work-management/project-management/risk-register","Read the register fields and the scoring section. 15 minutes."],["Atlassian Team Playbook: Project Poster","https://www.atlassian.com/team-playbook/plays/project-poster","Run the play once for a current project; it aligns stakeholders on problem, plan and status. 20 minutes."]],
  check:["A deadline moves up four weeks: what three options do you present, with impacts?","What is in your RAID log today, and who owns each line?","What does a one-screen status report contain?"]},
 A1:{what:"Problem solving and critical thinking in production means working from evidence: reproduce, isolate, hypothesize, test one change at a time, and separate the root cause from the symptom. Panels ask about an incident you led and what changed afterward.",
  how:["Stabilize first: stop the bleeding (roll back, fail over, disable a feature flag) before diagnosing deeply.","Gather evidence: logs, metrics, traces, recent changes and deploys, what differs between working and failing cases.","Form hypotheses and rank them by likelihood and cost to test; test one at a time and write down what you ruled out.","Find the root cause by asking 'why' until you reach a process or design cause, not a person.","Run a blameless postmortem: timeline, impact, root causes, what went well, action items with owners; share it."],
  terms:[["Symptom vs. root cause","A 503 is a symptom; the stopped app pool is a cause; the missing health check that let it stay stopped is the root cause."],["Blameless postmortem","An incident review focused on systems and decisions, not individuals."],["Mean time to restore (MTTR)","How long it takes to recover service after a failure."]],
  read:[["Google SRE book: effective troubleshooting","https://sre.google/sre-book/effective-troubleshooting/","Read the whole chapter. 30 minutes."],["Google SRE book: postmortem culture","https://sre.google/sre-book/postmortem-culture/","Read 'Blameless postmortems' and the example. 20 minutes."],["PagerDuty incident response guide","https://response.pagerduty.com/","Read 'Before an incident' and 'During an incident'. 20 minutes."]],
  check:["Describe an incident you led as: stabilize, evidence, hypotheses, root cause, follow-up.","Why change one thing at a time while debugging?","What makes a postmortem blameless, and what does it produce?"]},
 A2:{what:"Leading in a senior technical role means making and owning decisions, delegating real responsibility, handling escalations calmly, and committing publicly to decisions you argued against. It is leadership without relying on authority.",
  how:["Decide with a clear process: who decides (DACI), what criteria, by when; then write the decision down and explain it.","Delegate outcomes, not tasks: say what good looks like and when to check in, then let the person choose how.","Handle escalations by lowering the temperature: acknowledge, gather facts, respond with options and a time.","Disagree and commit: argue fully while the decision is open; after it is made, support it as your own and revisit only with new evidence.","Own mistakes publicly and quickly; it builds the trust that makes the next hard call possible."],
  terms:[["DACI","Driver, Approver, Contributors, Informed: who does what in a decision."],["Disagree and commit","Voice disagreement, then fully support the decision once made."],["Delegation level","How much authority you hand over, from 'do exactly this' to 'decide and tell me'."]],
  read:[["StaffEng: staff archetypes","https://staffeng.com/guides/staff-archetypes/","Read the four archetypes; decide which fits a team lead. 15 minutes."],["Atlassian Team Playbook: DACI decision-making framework","https://www.atlassian.com/team-playbook/plays/daci","Read the play; apply it to one pending decision. 15 minutes."],["Amazon leadership principles","https://www.amazon.jobs/content/en/our-workplace/leadership-principles","Read 'Have Backbone; Disagree and Commit' and 'Ownership'. 10 minutes."]],
  check:["Tell about a decision you made as a lead that turned out wrong and what you did.","How do you delegate a feature to a mid-level developer without micromanaging?","What does 'disagree and commit' look like in a design review?"]},
 A3:{what:"Communicating across teams means writing and speaking for the reader: lead with the bottom line, say what it means for them, what they need to do, and when they will hear next. Non-technical readers get plain language; technical readers get precision.",
  how:["Start with the decision or the news (BLUF: bottom line up front), then context, then details.","Tailor to the audience: for executives, impact, options, cost, time and the ask; for engineers, specifics and links; for everyone, one everyday analogy where it helps.","Use plain language: short sentences (under 20 words), common words, active voice, no unexplained acronyms.","Close with owners and dates: who does what by when, and when you will update.","Pick the channel: a written note for decisions and records, a short call for conflict or nuance, then a written summary of the call."],
  terms:[["BLUF","Bottom line up front: the conclusion first."],["Plain language","Writing the reader understands the first time they read it."],["Ask","The specific decision or action you need from the reader."]],
  read:[["Google: Technical Writing One","https://developers.google.com/tech-writing/one","Work through the course; focus on 'Clear sentences' and 'Short sentences'. 60 minutes."],["plainlanguage.gov: federal plain language guidelines","https://www.plainlanguage.gov/guidelines/","Read 'Write for your audience' and 'Be concise'. 20 minutes."],["digital.gov: plain language guide","https://digital.gov/guides/plain-language","Skim; note the checklist. 10 minutes."]],
  check:["Rewrite a technical outage note for a non-technical director in under 120 words.","What four things does a stakeholder update always contain?","When do you call instead of write, and what do you do after the call?"]},
 A4:{what:"Designing and maintaining CI/CD pipelines means a multi-stage, versioned pipeline that builds once, tests, and promotes the same artifact through environments with approvals, secrets kept out of YAML, and a tested way to roll back.",
  how:["Structure the YAML in stages (Build, Test, Deploy_Staging, Deploy_Prod) with jobs and steps; stages depend on each other with dependsOn.","Build once: publish an artifact in Build and download it in deploy stages; never rebuild per environment.","Use deployment jobs targeting environments; environments carry approvals and checks (manual approval, business hours, required templates) that gate production.","Keep secrets in variable groups linked to Key Vault or in Key Vault directly; reference them as variables, never as literals; mark them secret.","Plan releases: deployment slots with swap, feature flags, backward-compatible database migrations; rollback is a swap back or a redeploy of the previous artifact, with a time limit."],
  terms:[["Stage / job / step","Pipeline hierarchy: stages group jobs (which run on agents) made of steps (tasks or scripts)."],["Deployment job","A job type that targets an environment, records deployment history and supports strategies (runOnce, rolling, canary)."],["Environment approval","A check on an environment that pauses the pipeline until an approver acts."],["Variable group","Shared pipeline variables, optionally linked to Key Vault secrets."]],
  read:[["Azure Pipelines: key concepts","https://learn.microsoft.com/en-us/azure/devops/pipelines/get-started/key-pipelines-concepts","Read the whole page. 15 minutes."],["Azure Pipelines: deployment jobs","https://learn.microsoft.com/en-us/azure/devops/pipelines/process/deployment-jobs","Read 'Schema' and the runOnce example. 15 minutes."],["Azure Pipelines: approvals and checks","https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals","Read 'Approvals' and 'Business hours'. 15 minutes."],["Martin Fowler: Continuous Integration","https://martinfowler.com/articles/continuousIntegration.html","Read the practices list. 25 minutes."]],
  check:["Sketch a four-stage pipeline that builds once and gates production with an approval.","Where do secrets live, and how does the YAML reference them?","What is your rollback plan for a bad deploy to App Service, and how long does it take?"]},
 P1:{what:"Hands-on Azure DevOps, GitHub and TFVC means you can set up the daily workflow: Boards with area and iteration paths and linked work items, Repos with branch policies and pull requests, GitHub linking with AB# references, and TFVC check-ins and shelvesets where legacy code still lives.",
  how:["Boards: organize work with area paths (team/component) and iteration paths (sprints); link commits and PRs to work items so traceability is automatic.","Repos: set branch policies on main (required reviewers, build validation, linked work items, comment resolution); use PR templates and auto-complete.","GitHub: connect Azure Boards to GitHub and reference work items with AB#123 in commits and PRs; protect main with branch protection rules and required status checks.","TFVC: get latest, check out, check in with a comment and a linked work item; shelve work in progress to switch tasks or share for review; avoid long-lived branches.","Migration awareness: new Azure DevOps projects default to Git; TFVC import to Git handles one branch and limited history, so plan a tip migration (see G4)."],
  terms:[["Area path / iteration path","Classification of work items by team or component, and by sprint."],["Build validation","A branch policy that requires a pipeline to pass before merge."],["AB#","The Azure Boards work item reference syntax used in GitHub commits and PRs."],["Check-in / shelveset","TFVC's commit and its parked-changes feature."]],
  read:[["Azure Repos: branch policies and settings","https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies","Read each policy's description. 20 minutes."],["Azure Boards: define area paths and iteration paths","https://learn.microsoft.com/en-us/azure/devops/organizations/settings/about-areas-iterations","Read the overview. 10 minutes."],["Azure Boards: link GitHub commits, PRs and issues to work items","https://learn.microsoft.com/en-us/azure/devops/boards/github/link-to-from-github","Read the AB# syntax section. 10 minutes."],["Azure Repos (TFVC): suspend work and manage shelvesets","https://learn.microsoft.com/en-us/azure/devops/repos/tfvc/suspend-your-work-manage-your-shelvesets","Read 'Shelve your changes'. 10 minutes."],["GitHub Skills","https://skills.github.com/","Do 'Introduction to GitHub' and 'Review pull requests'. 60 minutes."]],
  check:["Which branch policies would you enable on main and why?","How does a GitHub commit link to an Azure Boards work item?","When would you shelve in TFVC instead of checking in?"]},
 P2:{what:"Strong OOP in C#, Angular and TypeScript means using encapsulation, polymorphism and composition to make code easy to change: small interfaces, composition over inheritance, polymorphism instead of type switches, records for values, and TypeScript strict mode.",
  how:["Encapsulate: keep fields private, expose behavior through methods; prefer immutable objects (C# records, readonly properties, TypeScript readonly).","Compose over inherit: inject collaborators through interfaces; use inheritance only for true is-a relationships with a stable base.","Replace switch-on-type with polymorphism: an interface with one implementation per case (Strategy), chosen by a factory or DI.","Design interfaces from the caller's needs (interface segregation); one or two methods is often right.","TypeScript strict mode (strict: true) catches null and implicit any; model domain values with union types and readonly."],
  terms:[["Record (C#)","A reference or value type with value-based equality and with-expressions for non-destructive mutation."],["Composition over inheritance","Build behavior by combining objects rather than extending classes."],["Interface segregation","Many small, specific interfaces beat one large one."],["strict (tsconfig)","Turns on strictNullChecks, noImplicitAny and other checks."]],
  read:[["Microsoft Learn: inheritance in C#","https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/object-oriented/inheritance","Read 'Abstract and virtual methods' and 'Hiding'. 20 minutes."],["Microsoft Learn: records (C#)","https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/types/records","Read 'Value equality' and 'Nondestructive mutation'. 15 minutes."],["Microsoft Learn: interfaces (C#)","https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/types/interfaces","Read the overview. 10 minutes."],["TypeScript Handbook: classes","https://www.typescriptlang.org/docs/handbook/2/classes.html","Read 'implements', 'Member visibility' and 'Abstract classes'. 20 minutes."],["TypeScript: the strict compiler option","https://www.typescriptlang.org/tsconfig/#strict","Read which flags it enables. 5 minutes."]],
  check:["Refactor a switch over permit types into a Strategy with DI; describe the classes.","When do two C# records compare equal?","What does strict: true turn on, and what bug does strictNullChecks prevent?"]},
 P3:{what:"Leading and mentoring covers 1:1s that belong to the report, specific feedback (Situation, Behavior, Impact, then a request), fair reviews backed by dated evidence, growth plans, handling underperformance early, and building psychological safety.",
  how:["Run weekly or biweekly 1:1s with the report's agenda first; keep shared notes; follow up on what you promised.","Give feedback with SBI: the specific situation, the observable behavior, its impact, then what you'd like instead; do it soon and in private for corrections.","Keep a running log of specific, dated examples for each person so reviews have evidence and no surprises.","Address underperformance early with clear expectations, support, a time frame and documented check-ins; involve HR when it becomes formal.","Build safety: admit your own mistakes, ask for input before giving yours, thank people for raising problems, and make retros about systems not individuals."],
  terms:[["SBI","Situation, Behavior, Impact: a feedback structure that stays specific and non-judgmental."],["Psychological safety","A shared belief that it is safe to take interpersonal risks; the top predictor of team effectiveness in Google's Project Aristotle."],["Growth plan","Agreed skills or scope to develop, with concrete steps and check-in dates."]],
  read:[["Lara Hogan: the feedback equation","https://larahogan.me/blog/feedback-equation/","Read the whole post. 10 minutes."],["GitLab handbook: 1:1s","https://handbook.gitlab.com/handbook/leadership/1-1/","Read 'Suggested agenda format'. 10 minutes."],["Google re:Work: understand team effectiveness (Project Aristotle)","https://rework.withgoogle.com/en/guides/understanding-team-effectiveness","Read 'Identify dynamics of effective teams'. 15 minutes."],["CCL: SBI feedback (intent vs. impact)","https://www.ccl.org/articles/leading-effectively-articles/closing-the-gap-between-intent-vs-impact-sbii/","Read the SBI explanation and example. 10 minutes."]],
  check:["Give an SBI feedback message for a developer who merged without review.","How do you make a performance review free of surprises?","Name three things you do that increase psychological safety."]},
 P4:{what:"Advanced Azure deployment plus IIS administration means running the same kind of app in two places: App Service with deployment slots, swaps, slot settings and managed certificates in Azure, and IIS on Windows VMs with bindings, certificates and app pools; and knowing how to move IIS sites to App Service.",
  how:["Deploy to a staging slot, warm it up (health endpoint), run smoke tests, then swap into production; swap back is the rollback.","Mark environment-specific settings (connection strings, feature flags) as slot settings so they stay with the slot during a swap.","Use App Service managed certificates for custom domains, or import certificates from Key Vault; enforce HTTPS and TLS 1.2+.","On IIS VMs: bind certificates per site with SNI, automate renewal (ACME or an internal CA), separate app pools, health monitoring and log collection.","Moving IIS to App Service: assess (framework version, dependencies on local files, GAC, Windows auth), use the App Service migration tooling, fix hard-coded paths, test in a slot first."],
  terms:[["Deployment slot","A live app instance with its own host name; swapping exchanges it with production."],["Slot setting","An app setting or connection string pinned to a slot during swaps."],["Managed certificate","A free App Service TLS certificate Azure issues and renews for a custom domain."],["Warm-up","Requests made to a slot before the swap so the first production users don't hit a cold start."]],
  read:[["Microsoft Learn: set up staging environments in App Service","https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots","Read 'Swap two slots' and 'Which settings are swapped'. 20 minutes."],["Microsoft Learn: add and manage TLS/SSL certificates in App Service","https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate","Read 'Create a free managed certificate'. 10 minutes."],["Microsoft Learn: host ASP.NET Core on Windows with IIS","https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/iis/","Read 'Deploy the app' and 'Create the IIS site'. 15 minutes."],["Microsoft Learn: migrate to Azure App Service","https://learn.microsoft.com/en-us/azure/app-service/app-service-migration-assess-net","Read the assessment steps. 10 minutes."]],
  check:["Describe a zero-downtime deploy with a slot swap and the rollback.","Which settings must be slot settings, and what happens if they are not?","What blocks an old IIS app from moving to App Service?"]},
 P5:{what:"Secure web development covers transport security (TLS 1.2/1.3, certificate chains, HSTS, security headers), the OWASP Top 10, authentication with OAuth 2.0 and OpenID Connect, CORS done right, and input validation. Panels want concrete settings and the reasons behind them.",
  how:["TLS: disable SSL 3 and TLS 1.0/1.1; prefer TLS 1.3 and 1.2 with strong cipher suites; serve the full certificate chain; redirect HTTP to HTTPS and send Strict-Transport-Security.","Headers: Content-Security-Policy, X-Content-Type-Options: nosniff, Referrer-Policy, frame-ancestors (replaces X-Frame-Options); remove server version headers.","OWASP Top 10 (2025): Broken Access Control is #1; check authorization on every request server-side, validate and encode input, use parameterized queries, keep dependencies patched, log security events.","Auth: use OpenID Connect for login (Entra ID), OAuth 2.0 authorization code with PKCE for SPAs, short-lived access tokens, refresh tokens handled server-side where possible.","CORS: allow exact origins, never * with credentials; validate inputs on the server even when the UI validates; set secure, HttpOnly, SameSite cookies."],
  terms:[["HSTS","Strict-Transport-Security header: browsers only use HTTPS for the site for max-age seconds."],["Broken Access Control","Users acting outside their permissions (IDOR, missing checks); OWASP Top 10 #1."],["PKCE","Proof Key for Code Exchange: protects the OAuth authorization code flow in public clients."],["Parameterized query","SQL with bound parameters, which cannot change the query's structure."]],
  read:[["OWASP Top 10:2025","https://owasp.org/Top10/2025/","Read the introduction and A01 through A05. 40 minutes."],["OWASP Cheat Sheet: Transport Layer Security","https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html","Read 'Server configuration' and 'Protocols'. 20 minutes."],["MDN: Strict-Transport-Security","https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Strict-Transport-Security","Read the syntax and 'Example scenario'. 10 minutes."],["OAuth 2.0 (oauth.net)","https://oauth.net/2/","Read 'Grant types' and 'PKCE'. 15 minutes."],["Mozilla: server-side TLS configuration","https://wiki.mozilla.org/Security/Server_Side_TLS","Read the 'Intermediate' configuration. 10 minutes."]],
  check:["What TLS versions and headers do you enable on a new IIS or App Service site?","What is OWASP A01 and how do you prevent it in an ASP.NET Core API?","Which OAuth flow does an Angular SPA use, and why PKCE?"]},
 G1:{what:"Web accessibility means people with disabilities can perceive, operate and understand your sites and apps. WCAG 2.1 Level AA is the working legal standard (ADA Title II for state and local government with 2027-2028 deadlines, ADA applied to business sites, Section 508 for federal agencies). In practice: semantic HTML, keyboard and screen-reader testing, and accessibility in the definition of done.",
  how:["Know the standard: WCAG 2.1 AA success criteria grouped as Perceivable, Operable, Understandable, Robust (POUR); WCAG 2.2 adds a few criteria such as focus appearance and target size.","Build with native HTML first: button, label, fieldset, headings in order, alt text, form error text tied with aria-describedby; add ARIA only when no native element does the job.","Make everything keyboard-usable: visible focus, logical order, no traps, skip links; manage focus after route changes in Angular and announce changes with LiveAnnouncer.","Test: keyboard only, a screen reader (NVDA on Windows, VoiceOver on Mac/iOS), automated checks (axe, Lighthouse) for the easy 30-40%, then manual checks for the rest.","Procure and plan: ask vendors for an Accessibility Conformance Report (ACR/VPAT) and test it yourself; inventory sites, apps and documents; fix high-traffic services first; put accessibility in the definition of done."],
  terms:[["WCAG 2.1 AA","The Web Content Accessibility Guidelines level most laws reference; 50 success criteria."],["ARIA","Attributes that add roles and states for assistive technology; 'no ARIA is better than bad ARIA'."],["ACR / VPAT","A vendor's conformance report against WCAG or Section 508."],["ADA Title II web rule","DOJ's 2024 rule: WCAG 2.1 AA for state and local government web and mobile content; compliance April 26, 2027 (50,000+ population) or April 26, 2028 (smaller), after the April 20, 2026 interim final rule (under court challenge)."]],
  read:[["W3C WAI: how to meet WCAG (quick reference)","https://www.w3.org/WAI/WCAG21/quickref/","Filter to Level A and AA; read the criteria for forms, keyboard and contrast. 30 minutes."],["W3C WAI: Easy Checks, a first review of web accessibility","https://www.w3.org/WAI/test-evaluate/preliminary/","Run the checks on one of your own pages. 30 minutes."],["ADA.gov: fact sheet on the Title II web and mobile app rule","https://www.ada.gov/resources/2024-03-08-web-rule/","Read the standard, who is covered and the dates. 15 minutes."],["angular.dev: accessibility best practices","https://angular.dev/best-practices/a11y","Read the whole page. 15 minutes."]],
  check:["Fix a form with placeholder-only labels, a div button and an unlinked error message; what changes?","What are the four WCAG principles, and one criterion under each?","What do you ask a vendor for, and why isn't 'Section 508 compliant' enough on its own?"]},
 G2:{what:"Data retention, records requests, PII and audit logging: emails, database rows and logs are records with retention rules, requests (public records, legal discovery, privacy) must be answered from them, personal data must be minimized and protected, and audit logs must show who did what, when, from where, without leaking secrets.",
  how:["Classify data (public, internal, confidential, regulated) and tag PII fields; collect the minimum, encrypt at rest and in transit, mask in logs and non-production copies, restrict access by role.","Design retention into the schema: a retention category and dates on records, soft delete with scheduled purge, and a legal hold flag that suspends destruction.","Support requests: search and export by subject, date and keyword; redact PII and exempt content; keep a log of the request and what was released.","Audit logs: append-only, who (identity), what (action and object), when (UTC), where (IP, system), outcome; never log passwords, tokens or full SSNs; protect integrity and retention of the logs themselves.","Know the legal context: public records laws in the public sector (FOIA covers federal agencies only), privacy laws and litigation holds in the private sector, extra regimes for payment, health and criminal-justice data."],
  terms:[["PII","Information that identifies a person alone or combined (name, SSN, email, plate, biometrics)."],["Retention schedule","An approved list of record types with how long to keep each and what then happens."],["Legal hold","A directive to preserve records for litigation or investigation, overriding the schedule."],["Append-only log","A log that can be added to but not edited or deleted by the application."]],
  read:[["NIST SP 800-122: guide to protecting the confidentiality of PII","https://csrc.nist.gov/pubs/sp/800/122/final","Read sections 2 and 4 (what PII is; safeguards). 30 minutes."],["OWASP Logging Cheat Sheet","https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html","Read 'Which events to log' and 'Data to exclude'. 20 minutes."],["National Archives: records management basics","https://www.archives.gov/records-mgmt","Read 'What is a record' and 'Retention schedules'. 15 minutes."],["Council of State Archivists","https://www.statearchivists.org/","Find your state archives and its general retention schedule. 10 minutes."]],
  check:["Design the columns and jobs that implement retention, soft delete and legal hold for a permits table.","List the fields of an audit log entry and three things that must never appear in it.","A records request arrives for every email about a project: what happens on your side?"]},
 G3:{what:"Change management in IT is how production changes get reviewed, scheduled, communicated and reversed: standard, normal and emergency change types, a Change Advisory Board (CAB) or equivalent, maintenance windows, tested rollback plans, and separation of duties between the person who builds and the people who approve and deploy.",
  how:["Classify the change: standard (pre-approved, low risk, repeatable), normal (reviewed by CAB), emergency (fast-track approval, reviewed afterward).","Write the request so it can be approved: what and why, risk and impact, test evidence, implementation steps, rollback plan with a time limit, maintenance window, who is notified and when.","Make rollbacks real: slot swaps, feature flags, backward-compatible database migrations (expand/contract), previous artifact kept ready.","Separate duties: the developer who wrote the change does not approve or deploy it alone; pipeline environment approvals and branch policies enforce this in the tool (NIST SP 800-53 AC-5, CM-3).","After the change: verify, close the record, and review emergency changes to learn why they were emergencies."],
  terms:[["CAB","Change Advisory Board: the group that reviews normal changes for risk and scheduling."],["Standard change","A pre-approved, low-risk change with a known procedure."],["Expand/contract migration","Add new columns first, migrate, then remove old ones later, so old and new code both work."],["Separation of duties","No single person can request, approve and implement the same change."]],
  read:[["NIST SP 800-53 Rev. 5 (CM-3 configuration change control, AC-5 separation of duties)","https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","Open the PDF and read CM-3 and AC-5. 15 minutes."],["Azure Pipelines: approvals and checks","https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals","Read 'Approvals' and who can approve. 10 minutes."],["Google SRE book: release engineering","https://sre.google/sre-book/release-engineering/","Read 'Philosophy' and 'Continuous build and deployment'. 20 minutes."]],
  check:["Fill in a change request for a new payment page deploy: type, window, test evidence, rollback with time limit, comms, approver.","Name the three change types and an example of each.","How does a pipeline enforce separation of duties?"]},
 G4:{what:"Legacy modernization for a .NET shop: moving source from TFVC to Git, moving applications from .NET Framework to modern .NET (target .NET 10 LTS; .NET 8 and 9 reach end of support on November 10, 2026), adjusting IIS hosting, and doing it incrementally with the strangler fig pattern while making the case to non-technical leaders.",
  how:["TFVC to Git: the Azure Repos import handles one branch or the root, up to 1 GB and 180 days of history, so plan a tip migration and keep TFVC read-only for old history; use git-tfs for full history if required; move binaries out; pick a branching strategy before the cutover.","Assess the .NET code: framework version, dependencies (System.Web, WCF, WebForms), third-party packages; Microsoft deprecated the .NET Upgrade Assistant in favor of the GitHub Copilot app modernization tooling.","Migrate incrementally: put YARP in front, move one route or feature at a time to the new ASP.NET Core app, share session/auth with the System.Web adapters; this is the strangler fig pattern.","Fix hosting: install the ASP.NET Core Hosting Bundle on IIS, set app pools to 'No Managed Code', or move to App Service.","Sell it: risk (unsupported runtime, security), cost of doing nothing, support dates, phased plan with early visible wins, no big-bang weekend."],
  terms:[["Tip migration","Importing only the latest version of the code, leaving history in the old system."],["Strangler fig","Incrementally replace a system by routing pieces of traffic to the new one until the old one is gone."],["YARP","Microsoft's reverse proxy used to route between old and new apps during migration."],["LTS","Long-term support release; .NET 10 is LTS with support to November 2028."]],

T({id:"M1-star-result",ksa:["M1"],type:"mcq",tier:1,title:"Pick the strongest STAR result",
 prompt:"You are answering \"Tell me about a time you improved a web application.\" Which closing Result is strongest?",

T({id:"M2-bigo",ksa:["M2"],type:"mcq",tier:1,title:"Lookups at scale",
 prompt:"You need to check 50,000 parcel IDs against a list of 200,000 known IDs. Which approach and complexity is best?",

T({id:"K2-ts-groupby",ksa:["K2","P2"],type:"code",lang:"ts",tier:2,title:"TypeScript: groupBy",
 prompt:"Implement a generic <code>groupBy</code> that groups items by a key function. It must return an object whose keys are the group keys and whose values are arrays in the original order.",
 starter:"type Permit = { id: number; status: 'Open' | 'Approved' | 'Closed' };\n\nfunction groupBy<T, K extends string>(items: T[], key: (item: T) => K): Record<K, T[]> {\n  // TODO\n  return {} as Record<K, T[]>;\n}\n",
 tests:[["Groups by status","(()=>{const r=groupBy([{id:1,status:'Open'},{id:2,status:'Approved'},{id:3,status:'Open'}],p=>p.status);return r.Open.length===2&&r.Approved.length===1})()"],
  ["Keeps original order","(()=>{const r=groupBy([{id:1,status:'Open'},{id:3,status:'Open'}],p=>p.status);return r.Open[0].id===1&&r.Open[1].id===3})()"],
  ["Empty input returns an empty object","Object.keys(groupBy([],x=>'a')).length===0"],
  ["No missing groups","(()=>{const r=groupBy(['a','bb','cc','d'],s=>String(s.length));return JSON.stringify(r)==='{\"1\":[\"a\",\"d\"],\"2\":[\"bb\",\"cc\"]}'})()"]],
 hints:["Start with an empty object and loop over the items.","For each item, compute k = key(item); create the array if it doesn't exist, then push.","const out = {} as Record<K, T[]>; for (const it of items) { const k = key(it); (out[k] ??= []).push(it); } return out;"]});

T({id:"K2-cs-virtual",ksa:["K2","P2"],type:"mcq",tier:2,title:"C#: override vs new",
 prompt:"What does this print?",code:"class Animal { public virtual string Speak() => \"...\"; }\nclass Dog : Animal { public override string Speak() => \"Woof\"; }\nclass Cat : Animal { public new string Speak() => \"Meow\"; }\n\nAnimal a = new Dog();\nAnimal b = new Cat();\nConsole.WriteLine(a.Speak() + \" \" + b.Speak());",
 options:["Woof Meow","Woof ...","... ...","Compile error"],answer:1,
 explain:"Dog overrides the virtual method, so the derived version runs. Cat hides it with 'new', so a call through an Animal reference runs Animal.Speak()."});

T({id:"P2-cs-linq",ksa:["P2","K2"],type:"mcq",tier:2,title:"C#: LINQ deferred execution",
 prompt:"What does this print?",code:"var nums = new List<int> { 1, 2, 3 };\nvar q = nums.Where(n => n > 1);\nnums.Add(4);\nConsole.WriteLine(q.Count());",

T({id:"P2-ts-fees",ksa:["P2","K3"],type:"code",lang:"ts",tier:3,title:"TypeScript OOP: fee rules (Strategy)",
 prompt:"Permit fees are made of rules. Implement an abstract class <code>FeeRule</code> with <code>apply(base: number): number</code>, plus <code>FlatFee</code> (fixed amount) and <code>PercentFee</code> (rate times base). Then implement <code>totalFees(rules, base)</code> as the sum of all rules. Round to 2 decimals.",
 starter:"abstract class FeeRule {\n  abstract apply(base: number): number;\n}\n\nclass FlatFee extends FeeRule {\n  // TODO\n}\n\nclass PercentFee extends FeeRule {\n  // TODO\n}\n\nfunction totalFees(rules: FeeRule[], base: number): number {\n  // TODO\n  return 0;\n}\n",
 tests:[["FlatFee returns its amount","new FlatFee(25).apply(100)===25"],["PercentFee applies the rate","new PercentFee(0.1).apply(200)===20"],["Rules are FeeRule instances","new PercentFee(0.1) instanceof FeeRule && new FlatFee(1) instanceof FeeRule"],["totalFees sums rules","totalFees([new FlatFee(25),new PercentFee(0.1)],200)===45"],["Rounds to 2 decimals","totalFees([new PercentFee(0.0333)],100)===3.33"],["No rules means 0","totalFees([],500)===0"]],
 hints:["Each subclass needs a constructor that stores its value, and an apply method.","class FlatFee extends FeeRule { constructor(private amount: number) { super(); } apply(_b: number) { return this.amount; } }","totalFees: Math.round(rules.reduce((s, r) => s + r.apply(base), 0) * 100) / 100"]});

T({id:"K3-pattern",ksa:["K3"],type:"mcq",tier:1,title:"Name the pattern",
 prompt:"Which design pattern is this?",code:"public interface INotifier { Task SendAsync(string to, string msg); }\npublic class EmailNotifier : INotifier { ... }\npublic class SmsNotifier : INotifier { ... }\n\npublic class OutageAlerts {\n  private readonly INotifier _notifier;\n  public OutageAlerts(INotifier notifier) => _notifier = notifier;\n  public Task Alert(Customer c) => _notifier.SendAsync(c.Contact, \"Service outage in your area\");\n}",

 items:[["sql","Line 4: SQL built by string concatenation"],["select","Line 4: SELECT * returns every column, including private ones"],["catch","Line 6: empty catch swallows errors"],["async","Line 2: the method is async"],["ok","Line 7: returns 200 OK with the rows"],["auth","No authorization: anyone can search permits by owner name"]],
 checks:[{l:"Flags the SQL injection",f:s=>s.has("sql")},{l:"Flags over-fetching private columns",f:s=>s.has("select")},{l:"Flags the empty catch",f:s=>s.has("catch")},{l:"Flags missing authorization (OWASP A01)",f:s=>s.has("auth")}],

T({id:"K7-keyvault",ksa:["K7","P4","P5"],type:"json",tier:2,title:"Azure: move secrets to Key Vault",
 prompt:"These App Service settings hold secrets in plain text. The app has a managed identity with access to Key Vault <code>kv-permits-prod</code>, which holds secrets <code>PermitsDb</code> and <code>PaymentsApiKey</code>. Replace both secret values with Key Vault references. Keep the JSON valid.",
 starter:"[\n  { \"name\": \"ASPNETCORE_ENVIRONMENT\", \"value\": \"Production\", \"slotSetting\": false },\n  { \"name\": \"ConnectionStrings__PermitsDb\", \"value\": \"Server=tcp:sql-permits.database.windows.net;Database=Permits;User ID=permits_app;Password=Spr1ng2026!;\", \"slotSetting\": false },\n  { \"name\": \"Payments__ApiKey\", \"value\": \"pk_live_51Hx9aQ7\", \"slotSetting\": false }\n]\n",
 checks:[{l:"PermitsDb uses a Key Vault reference",f:j=>kvRef(val(j,"ConnectionStrings__PermitsDb"),"PermitsDb")},{l:"Payments key uses a Key Vault reference",f:j=>kvRef(val(j,"Payments__ApiKey"),"PaymentsApiKey")},{l:"No plain-text password or live key remains",f:(j,raw)=>!/Password=|pk_live_/i.test(raw)}],
 constraints:[{l:"ASPNETCORE_ENVIRONMENT is still Production",f:j=>val(j,"ASPNETCORE_ENVIRONMENT")==="Production"},{l:"All 3 settings still exist",f:j=>Array.isArray(j)&&j.length===3}],
 hints:["The syntax starts with @Microsoft.KeyVault(","Either SecretUri=https://kv-permits-prod.vault.azure.net/secrets/PermitsDb/ or VaultName=kv-permits-prod;SecretName=PermitsDb","\"value\": \"@Microsoft.KeyVault(VaultName=kv-permits-prod;SecretName=PermitsDb)\""],
 explain:"App Service resolves @Microsoft.KeyVault(...) references at runtime using the app's managed identity, so secrets never sit in config."});

T({id:"K8-iis-sni",ksa:["K8","P4","P5"],type:"xml",tier:2,title:"IIS: wrong certificate on a shared IP",
 prompt:"The server hosts three HTTPS sites on one IP address. Visitors to <code>https://permits.example.com</code> get another site's certificate. Fix the HTTPS binding so it uses SNI for <code>permits.example.com</code>. Keep the HTTP binding (a rewrite rule uses it to redirect).",
 starter:"<site name=\"Permits\" id=\"3\">\n  <application path=\"/\" applicationPool=\"PermitsPool\">\n    <virtualDirectory path=\"/\" physicalPath=\"D:\\sites\\permits\" />\n  </application>\n  <bindings>\n    <binding protocol=\"http\" bindingInformation=\"*:80:permits.example.com\" />\n    <binding protocol=\"https\" bindingInformation=\"*:443:\" sslFlags=\"0\" />\n  </bindings>\n</site>\n",
 checks:[{l:"HTTPS binding on port 443 with host permits.example.com",f:d=>xAll(d,"binding").some(b=>b.getAttribute("protocol")==="https"&&/^(\*|[\d.]+):443:permits\.example\.com$/i.test(b.getAttribute("bindingInformation")||""))},{l:"SNI enabled (sslFlags includes 1)",f:d=>xAll(d,"binding").some(b=>b.getAttribute("protocol")==="https"&&/permits\.example\.com/i.test(b.getAttribute("bindingInformation")||"")&&((parseInt(b.getAttribute("sslFlags")||"0",10)&1)===1))}],
 constraints:[{l:"HTTP binding on port 80 still present",f:d=>xAll(d,"binding").some(b=>b.getAttribute("protocol")==="http"&&/:80:/.test(b.getAttribute("bindingInformation")||""))},{l:"App pool unchanged (PermitsPool)",f:d=>xAll(d,"application").some(a=>a.getAttribute("applicationPool")==="PermitsPool")},{l:"Only one HTTPS binding",f:d=>xAll(d,"binding").filter(b=>b.getAttribute("protocol")==="https").length===1}],
 hints:["bindingInformation is IP:port:hostname. The host name is missing.","SNI is turned on with sslFlags=\"1\".","<binding protocol=\"https\" bindingInformation=\"*:443:permits.example.com\" sslFlags=\"1\" />"],
 explain:"Without a host name and SNI, IIS serves the IP's default certificate. With SNI (sslFlags=1), the browser sends the host name in the TLS handshake and IIS picks the matching certificate."});

T({id:"P5-webconfig",ksa:["P5","K8"],type:"xml",tier:3,title:"IIS web.config: HTTPS redirect, HSTS, headers",
 prompt:"Harden this ASP.NET Core site's <code>web.config</code>: (1) add a URL Rewrite rule that permanently redirects HTTP to HTTPS, (2) send <code>Strict-Transport-Security</code> with max-age of at least one year, (3) remove the <code>X-Powered-By</code> header. Keep the ASP.NET Core hosting settings.",
 starter:"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <system.webServer>\n    <handlers>\n      <add name=\"aspNetCore\" path=\"*\" verb=\"*\" modules=\"AspNetCoreModuleV2\" resourceType=\"Unspecified\" />\n    </handlers>\n    <aspNetCore processPath=\"dotnet\" arguments=\".\\Permits.Api.dll\" hostingModel=\"inprocess\" />\n    <!-- TODO: rewrite rule, HSTS, remove X-Powered-By -->\n  </system.webServer>\n</configuration>\n",
 checks:[{l:"Rewrite rule matches when {HTTPS} is off",f:d=>xAll(d,"rule").some(r=>xAll(r,"add").some(a=>/\{HTTPS\}/i.test(a.getAttribute("input")||"")&&/off/i.test(a.getAttribute("pattern")||"")))},{l:"Rule redirects to https:// (permanent)",f:d=>xAll(d,"rule").some(r=>xAll(r,"action").some(a=>a.getAttribute("type")==="Redirect"&&/^https:\/\//i.test(a.getAttribute("url")||"")&&/^(Permanent|)$/.test(a.getAttribute("redirectType")||"")))},{l:"HSTS header with max-age of at least 31536000",f:d=>xAll(d,"add").some(a=>/^strict-transport-security$/i.test(a.getAttribute("name")||"")&&(parseInt(((a.getAttribute("value")||"").match(/max-age=(\d+)/i)||[0,0])[1],10)>=31536000))},{l:"X-Powered-By removed",f:d=>xAll(d,"remove").some(a=>/^x-powered-by$/i.test(a.getAttribute("name")||""))}],
 constraints:[{l:"aspNetCore element still present",f:d=>xAll(d,"aspNetCore").length===1},{l:"aspNetCore handler still present",f:d=>xAll(d,"handlers").some(h=>xAll(h,"add").some(a=>a.getAttribute("modules")==="AspNetCoreModuleV2"))}],
 hints:["Rules go in <rewrite><rules><rule name=\"...\" stopProcessing=\"true\">; headers go in <httpProtocol><customHeaders>.","Rule: <match url=\"(.*)\" />, <conditions><add input=\"{HTTPS}\" pattern=\"^OFF$\" /></conditions>, <action type=\"Redirect\" url=\"https://{HTTP_HOST}/{R:1}\" redirectType=\"Permanent\" />","Headers: <remove name=\"X-Powered-By\" /> and <add name=\"Strict-Transport-Security\" value=\"max-age=31536000; includeSubDomains\" />"],
 explain:"Redirect first, then HSTS makes browsers skip HTTP entirely. Removing X-Powered-By reduces fingerprinting. URL Rewrite must be installed on the server or IIS returns 500.19."});

T({id:"S1-post-auth",ksa:["S1","K9","P5"],type:"http",tier:2,title:"HTTP: create a 311 request",
 prompt:"Create a new 311 service request (category <code>pothole</code>, location <code>100 Main St</code>) through <code>/api/service-requests</code>. The API needs an OAuth bearer token (use <code>eyJhbGciOi...</code> as a placeholder) and you want JSON back.",
 checks:[{l:"Method is POST",f:r=>r.method==="POST"},{l:"Path is the collection, not an item",f:r=>/^\/api\/service-requests\/?$/.test(r.path)},{l:"Authorization: Bearer token",f:r=>/^Bearer\s+\S+/.test(r.h["authorization"]||"")},{l:"Content-Type is application/json",f:r=>/application\/json/i.test(r.h["content-type"]||"")},{l:"Body has category and location",f:r=>r.json&&r.json.category==="pothole"&&/100 Main St/i.test(r.json.location||"")}],
 constraints:[{l:"Token is not in the URL",f:r=>!/token|eyJ/i.test(r.path)}],
 hints:["Creating a resource in a collection uses POST to the collection path.","Headers: Authorization: Bearer eyJhbGciOi..., Content-Type: application/json, Accept: application/json","Body: {\"category\":\"pothole\",\"location\":\"100 Main St\"}"],
 explain:"POST to the collection; expect 201 Created with a Location header. Tokens go in the Authorization header, never the URL, where they end up in logs."});

T({id:"S1-rest-design",ksa:["S1","K9","K1"],type:"rest",tier:2,title:"REST design: permits API",
 prompt:"Design the route, method and success status for each operation. Base path: <code>/api/permits</code>.",
 rows:[
  ["List permits, page 2 of 25 per page","GET",/^\/api\/permits(\?.*page.*)?$/,["200"]],
  ["Get permit 42","GET",/^\/api\/permits\/42$/,["200"]],
  ["Create a permit","POST",/^\/api\/permits\/?$/,["201"]],
  ["Replace permit 42 entirely","PUT",/^\/api\/permits\/42$/,["200","204"]],
  ["Change only permit 42's status","PATCH",/^\/api\/permits\/42$/,["200","204"]],
  ["Delete permit 42","DELETE",/^\/api\/permits\/42$/,["204"]],
  ["List inspections for permit 42","GET",/^\/api\/permits\/42\/inspections\/?$/,["200"]],
  ["Create a permit whose number already exists (failure response)","POST",/^\/api\/permits\/?$/,["409"]]],
 explain:"Plural nouns, no verbs in paths, sub-resources for relationships, 201 for creates, 204 for deletes with no body, 409 for conflicts."});

T({id:"S2-unblock",ksa:["S2","P3","A2"],type:"scenario",tier:2,title:"A junior developer is stuck",
 prompt:"Priya, six months on the team, has been stuck for two days on a failing integration test. She hasn't asked for help.",
 steps:[
  {q:"What do you do first?",o:[["Take the ticket and fix it tonight",0,"Fast, but she learns nothing and may feel judged."],["Offer to pair for 30 minutes and ask her to walk you through what she's tried",3,"Respects her work and shows you how she's thinking."],["Tell her to keep at it; struggle is how people learn",0,"Two days is past productive struggle."],["Email her a link to the docs",1,"Low-effort help that doesn't address the block."]]},
  {q:"While pairing you spot the problem: the test reuses a database row another test deletes. What now?",o:[["Tell her the answer right away",1,"Solves it but skips the learning."],["Ask: 'What state does this test expect when it starts? Who else touches that row?'",3,"Guides her to find it herself."],["Rewrite the test suite yourself",0,"Overreach."]]},
  {q:"Afterward?",o:[["Nothing more; it's fixed",0,"Misses the pattern."],["Propose a team norm ('stuck over 4 hours: ask') and check in with her tomorrow",3,"Fixes the system and follows up."],["Note in her review that she was slow",0,"Punishes the behavior you want to change."]]}
 ]});

T({id:"S3-deadline",ksa:["S3","A2","C1e"],type:"scenario",tier:2,title:"The go-live date moves up 4 weeks",
 prompt:"Leadership moves the online permit portal's go-live up by 4 weeks to match a press event.",
 steps:[
  {q:"Your first response to the sponsor?",o:[["Say yes and plan overtime",0,"Burnout and hidden quality risk."],["Lay out options with impacts: cut scope to a smaller release, add people, or keep the date",3,"Gives the sponsor a real decision."],["Refuse; the date is impossible",0,"Shuts down collaboration."]]},
  {q:"What do you update?",o:[["The RAID log: new risks, owners and dates",3,"Makes risk visible and owned."],["Nothing; it's in your head",0,"Not visible to anyone else."]]},
  {q:"This week's status report says...",o:[["Green, to avoid alarm",0,"Hides risk."],["Amber, with specific risks and the decision needed by Friday",3,"Honest and actionable."]]}
