T({id:"A1-503",ksa:["A1","K8"],type:"mcq",tier:2,title:"Incident drill: 503 after deploy",
 prompt:"After a deploy, the site returns <b>503 Service Unavailable</b>. The app pool stops after a few requests. The System event log shows WAS event 5002: the pool was disabled by rapid-fail protection. What is the most likely root cause, and your next step?",
 options:["The server ran out of disk space; clear the logs","The app crashes on startup; enable stdout logging in web.config (or check the Application event log) to find the startup exception","DNS is misconfigured; flush the DNS cache","The TLS certificate expired; renew it"],
 answer:1,explain:"Rapid-fail protection stops a pool when its worker process crashes repeatedly. With ASP.NET Core this is usually a startup exception: a missing config value, a missing hosting bundle or a bad connection string."});

T({id:"A1-ts-parallel",ksa:["A1","K2","S1"],type:"code",lang:"ts",tier:2,title:"Fix a slow loader",
 prompt:"<code>loadAll</code> loads permits one at a time and takes 300 ms for 3 IDs. Make it load in parallel while keeping the results in the same order as the IDs. <code>getPermit(id)</code> is provided and takes about 100 ms.",
 harness:"const getPermit = (id) => new Promise(r => setTimeout(() => r('p' + id), 100));\n",
 starter:"async function loadAll(ids: number[]): Promise<string[]> {\n  const out: string[] = [];\n  for (const id of ids) {\n    out.push(await getPermit(id));\n  }\n  return out;\n}\n",
 tests:[["Returns results in order","(async()=>JSON.stringify(await loadAll([1,2,3]))==='[\"p1\",\"p2\",\"p3\"]')()"],["Runs in parallel (under 250 ms for 3)","(async()=>{const t=Date.now();await loadAll([1,2,3]);return Date.now()-t<250})()"],["Handles an empty list","(async()=>(await loadAll([])).length===0)()"]],
 hints:["Start all requests, then wait for all of them.","Promise.all keeps the order of its input.","return Promise.all(ids.map(id => getPermit(id)));"]});

T({id:"S1-ts-retry",ksa:["S1","A1","P5"],type:"code",lang:"ts",tier:3,title:"Consume an API with retries",
 prompt:"Implement <code>fetchWithRetry(call, maxAttempts)</code>. <code>call()</code> returns <code>{ status, body }</code>. Retry only on 429 and 503, up to <code>maxAttempts</code> total, waiting <code>await sleep(2 ** attempt)</code> between tries (sleep is provided). Return the first non-retryable response, or the last response if all attempts fail.",
 harness:"const sleep = (ms) => new Promise(r => setTimeout(r, Math.min(ms, 5)));\nconst seq = (arr) => { let i = 0; const f = async () => { f.calls++; return arr[Math.min(i++, arr.length - 1)]; }; f.calls = 0; return f; };\n",
 starter:"type Res = { status: number; body?: unknown };\n\nasync function fetchWithRetry(call: () => Promise<Res>, maxAttempts = 3): Promise<Res> {\n  // TODO\n  return call();\n}\n",
 tests:[["Retries 503 then succeeds","(async()=>{const f=seq([{status:503},{status:200,body:'ok'}]);const r=await fetchWithRetry(f,3);return r.status===200&&f.calls===2})()"],["Retries 429","(async()=>{const f=seq([{status:429},{status:429},{status:200}]);const r=await fetchWithRetry(f,3);return r.status===200&&f.calls===3})()"],["Does not retry 404","(async()=>{const f=seq([{status:404},{status:200}]);const r=await fetchWithRetry(f,3);return r.status===404&&f.calls===1})()"],["Gives up after maxAttempts","(async()=>{const f=seq([{status:503}]);const r=await fetchWithRetry(f,3);return r.status===503&&f.calls===3})()"]],
 hints:["Loop from attempt 1 to maxAttempts.","Inside: const r = await call(); if (r.status !== 429 && r.status !== 503) return r;","If more attempts remain: await sleep(2 ** attempt). After the loop, return the last response."]});

T({id:"A2-hotfix",ksa:["A2","A4","C1c"],type:"scenario",tier:2,title:"Hotfix vs the sprint",
 prompt:"Mid-sprint, customers report being charged twice for permit fees.",
 steps:[
  {q:"First move?",o:[["Finish the sprint first; it's in the backlog",0,"Customers are losing money now."],["Assess severity and scope, swarm a fix, and tell the Product Owner the Sprint Goal is at risk",3,"Production harm comes first, and the trade-off is made openly."],["Quietly assign your strongest developer",1,"Fixes it but hides the impact on the sprint."]]},
  {q:"How do you release the fix?",o:[["Build on a laptop and copy files to the server",0,"No tests, no audit trail."],["A hotfix branch through the pipeline: tests, then an approval to production",3,"Fast and safe; the pipeline is the only path to prod."]]},
  {q:"Afterward?",o:[["A blameless postmortem, plus a regression test and refunds coordinated with Finance",3,"Learn, prevent and make customers whole."],["Name the developer at standup",0,"Blame kills reporting."]]}
 ]});

T({id:"A3-clerk",ksa:["A3","C1e"],type:"write",tier:2,title:"Outage note to the Records Manager",
 prompt:"The meeting agenda portal was down from 9:10 to 10:40 this morning because a security certificate expired on the server. It's fixed. Write a short note to the Records Manager (non-technical). Say what happened, the impact, what you did, how you'll prevent it, and whether they need to do anything.",
 auto:[{l:"60-150 words",f:t=>{const w=words(t);return w>=60&&w<=150}},{l:"Mentions the time window",f:t=>/\d{1,2}:\d{2}/.test(t)},{l:"Says whether they need to act",f:t=>/no action|nothing (you need|needed)|you don.t need|please|could you|let me know/i.test(t)},{l:"Says how you'll prevent it",f:t=>/prevent|automat|reminder|monitor|going forward|from now on|renew/i.test(t)},{l:"Avoids jargon (TLS, SSL, load balancer, DNS, IIS, HTTP, root cause)",f:t=>!/\b(TLS|SSL|load balancer|DNS|IIS|HTTPS?|root cause|5\d\d)\b/i.test(t)},{l:"Short sentences (average 20 words or fewer)",f:t=>avgSentence(t)<=20}],
 checklist:["Acknowledges the impact on their work","Plain words a non-technical reader would understand","Says what happened in one sentence","Gives a contact or when they'll hear next"],
 model:"Hi Maria, the meeting agenda portal was unavailable today from 9:10 to 10:40 a.m. A security certificate that proves the site is genuine expired, so browsers blocked access. We renewed it and the site has worked normally since 10:40. You don't need to do anything. Agendas posted before the outage were not affected. To prevent this, we are switching to automatic renewal and adding an alert 30 days before any certificate expires. I'm sorry for the disruption before this morning's meeting. If anyone reports problems, please send them to me directly. - Alex, Lead Software Engineer"});

T({id:"A4-yaml-prod",ksa:["A4","P1","K4"],type:"yaml",tier:2,title:"Azure Pipelines: gate production",
 prompt:"Add a <code>Deploy_Prod</code> stage that runs only after <code>Test</code>, uses a <b>deployment job</b> targeting the <code>production</code> environment (where approvals are configured), and doesn't put secrets in YAML.",
 starter:"trigger:\n  branches:\n    include:\n      - main\n\npool:\n  vmImage: windows-latest\n\nstages:\n  - stage: Build\n    jobs:\n      - job: Build\n        steps:\n          - script: dotnet build --configuration Release\n          - task: PublishPipelineArtifact@1\n            inputs:\n              targetPath: $(Build.ArtifactStagingDirectory)\n              artifact: drop\n\n  - stage: Test\n    dependsOn: Build\n    jobs:\n      - job: UnitTests\n        steps:\n          - script: dotnet test --configuration Release\n\n# TODO: add the Deploy_Prod stage below\n",
 checks:[{l:"Stage Deploy_Prod exists",f:y=>!!stg(y,"Deploy_Prod")},{l:"Deploy_Prod depends on Test",f:y=>{const s=stg(y,"Deploy_Prod");return !!s&&[].concat(s.dependsOn||[]).includes("Test")}},{l:"Uses a deployment job",f:y=>{const s=stg(y,"Deploy_Prod");return !!s&&Array.isArray(s.jobs)&&s.jobs.some(j=>j&&j.deployment)}},{l:"Targets the production environment",f:y=>{const s=stg(y,"Deploy_Prod");return !!s&&Array.isArray(s.jobs)&&s.jobs.some(j=>j&&j.deployment&&(j.environment==="production"||(j.environment&&j.environment.name==="production")))}},{l:"Has a deployment strategy (e.g. runOnce)",f:y=>{const s=stg(y,"Deploy_Prod");return !!s&&Array.isArray(s.jobs)&&s.jobs.some(j=>j&&j.deployment&&j.strategy)}}],
 constraints:[{l:"Build and Test stages still exist",f:y=>!!stg(y,"Build")&&!!stg(y,"Test")},{l:"Test still depends on Build",f:y=>{const s=stg(y,"Test");return !!s&&[].concat(s.dependsOn||[]).includes("Build")}},{l:"No secret literals in YAML",f:(y,raw)=>!/(password|secret|pwd|apikey|api_key|token)\s*[:=]\s*['"]?(?!\$\()[A-Za-z0-9!@#%^&*_\-]{6,}/i.test(raw)}],
 hints:["Stages are list items under stages:. Order them with dependsOn.","A deployment job uses '- deployment: Name' with 'environment: production'.","  - stage: Deploy_Prod\n    dependsOn: Test\n    jobs:\n      - deployment: DeployWeb\n        environment: production\n        strategy:\n          runOnce:\n            deploy:\n              steps:\n                - script: echo Deploying"],
 explain:"Deployment jobs record history against an environment, and the environment's approvals and checks gate production. Secrets come from variable groups or Key Vault."});

T({id:"P1-gha-pr",ksa:["P1","A4","K4"],type:"yaml",tier:2,title:"GitHub Actions: test every pull request",
 prompt:"This workflow builds on pushes to <code>main</code>. Make it also run on <b>pull requests to main</b>, and add a step that runs <code>dotnet test</code>.",
 starter:"name: ci\non:\n  push:\n    branches: [ main ]\n\njobs:\n  build:\n    runs-on: windows-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-dotnet@v4\n        with:\n          dotnet-version: '8.0.x'\n      - run: dotnet build --configuration Release\n",
 checks:[{l:"Triggers on pull_request to main",f:y=>{const on=y&&y.on;const pr=on&&on.pull_request;return !!pr&&[].concat(pr.branches||[]).includes("main")}},{l:"A step runs dotnet test",f:y=>Object.values((y&&y.jobs)||{}).some(j=>(j.steps||[]).some(s=>s&&typeof s.run==="string"&&/dotnet test/.test(s.run)))}],
 constraints:[{l:"Still triggers on push to main",f:y=>{const p=y&&y.on&&y.on.push;return !!p&&[].concat(p.branches||[]).includes("main")}},{l:"Checkout is still the first step",f:y=>{const j=y&&y.jobs&&y.jobs.build;return !!j&&j.steps&&j.steps[0]&&/actions\/checkout/.test(j.steps[0].uses||"")}}],
 hints:["Add a pull_request key next to push under on:.","pull_request:\n    branches: [ main ]","Add a step: - run: dotnet test --configuration Release"],
 explain:"Running tests on every PR, plus a branch protection rule that requires the check, keeps main releasable."});

T({id:"P1-policies",ksa:["P1","K4"],type:"pick",tier:1,title:"Branch policies for main",
 prompt:"Your team is moving to pull requests in Azure Repos. Choose the branch policies for <code>main</code> that keep it releasable and auditable.",
 items:[["rev","Require a minimum of 1 reviewer (and reset votes on new pushes)"],["wi","Check for linked work items"],["cmt","Check for comment resolution"],["build","Build validation: run the CI pipeline on every PR"],["bypass","Allow everyone to bypass policies when in a hurry"],["self","Allow requestors to approve their own changes"]],
 checks:[{l:"Minimum reviewers",f:s=>s.has("rev")},{l:"Linked work items",f:s=>s.has("wi")},{l:"Comment resolution",f:s=>s.has("cmt")},{l:"Build validation",f:s=>s.has("build")}],
 constraints:[{l:"No bypass for everyone",f:s=>!s.has("bypass")},{l:"No self-approval",f:s=>!s.has("self")}],
 explain:"These four policies give review, traceability (audit), and a green build before merge. Bypass rights should be limited to a small admin group and logged."});

T({id:"P3-review",ksa:["P3","S2","C1c"],type:"scenario",tier:3,title:"Mid-year review: strong but abrasive",
 prompt:"Sam is your most productive developer, but code review comments like 'this is garbage' have made two juniors stop sending him PRs.",
 steps:[
  {q:"How do you prepare?",o:[["Collect specific, dated examples (PR comments) and their effects",3,"Evidence makes feedback fair and concrete."],["Rely on your general impression",0,"Vague and easy to dispute."],["Ask the team for anonymous complaints",1,"Can help, but alone it feels like an ambush."]]},
  {q:"How do you open the conversation?",o:[["'People think you're toxic.'",0,"A label, not a behavior."],["SBI: 'In the March 12 review (situation) you wrote \"this is garbage\" (behavior). Two juniors have since stopped asking you to review (impact).'",3,"Specific and observable, with clear impact."],["Skip it; his output is great",0,"Output doesn't excuse harm to the team."]]},
  {q:"What does the plan look like?",o:[["A concrete goal (review comments follow the team guide), monthly check-ins, recognition of his strengths and an offer to mentor juniors",3,"Clear expectations plus a path to grow."],["Warn him about a performance improvement plan right away",0,"Too early, and it escalates."]]}
 ]});

T({id:"P4-slots",ksa:["P4","K7"],type:"mcq",tier:2,title:"Slot swap safety",
 prompt:"Your App Service staging slot uses a <i>test</i> database connection string. You'll swap staging into production. What must you do so production never points at the test database?",
 options:["Nothing; swaps never move settings","Mark the connection string as a deployment slot setting (sticky) in both slots","Delete the staging slot after each swap","Hard-code the production string in appsettings.json"],
 answer:1,explain:"Slot settings stay with their slot during a swap. Non-sticky settings travel with the app."});

T({id:"P5-cors",ksa:["P5","S1","K9"],type:"mcq",tier:2,title:"CORS with credentials",
 prompt:"The Angular app at <code>https://permits.example.com</code> calls <code>https://api.example.com</code> with cookies (withCredentials). Which API response headers are correct?",
 options:["Access-Control-Allow-Origin: *","Access-Control-Allow-Origin: * and Access-Control-Allow-Credentials: true","Access-Control-Allow-Origin: https://permits.example.com and Access-Control-Allow-Credentials: true (plus Vary: Origin)","No CORS headers; same company, same rules"],
 answer:2,explain:"Browsers reject a wildcard origin with credentials. Echo an allow-listed origin, set Allow-Credentials, and add Vary: Origin for caches."});

T({id:"P5-tls",ksa:["P5","K8"],type:"mcq",tier:1,title:"TLS settings for a public site",
 prompt:"An SSL Labs scan of your organization's IIS server shows TLS 1.0 and 1.1 enabled. What's the right target?",
 options:["Leave them on for old browsers","Allow TLS 1.2 and 1.3 only; disable SSL 3.0, TLS 1.0 and 1.1 (Schannel registry or Group Policy), then rescan","Disable TLS 1.2 to force 1.3 only","Turn off HTTPS for internal pages"],
 answer:1,explain:"TLS 1.2 and 1.3 only is current guidance. On Windows, protocols are set in Schannel (registry or GPO) and need a reboot; rescan with SSL Labs after."});

T({id:"K10-onpush",ksa:["K10","K2"],type:"mcq",tier:2,title:"Angular: list doesn't update",
 prompt:"A component uses <code>ChangeDetectionStrategy.OnPush</code> and receives <code>@Input() permits: Permit[]</code>. The parent runs <code>this.permits.push(newPermit)</code>, but the list on screen doesn't update. Best fix?",
 options:["Call setTimeout to force a refresh","Create a new array in the parent: this.permits = [...this.permits, newPermit] (or use a signal and update it)","Switch every component to Default change detection","Call document.location.reload()"],
 answer:1,explain:"OnPush checks when the input reference changes. Mutating in place keeps the same reference. Immutable updates, or signals, fix it."});

T({id:"K10-a11y",ksa:["K10","P5"],type:"pick",tier:1,title:"Accessibility audit of a form",
 prompt:"Review this permit application form markup. Select every accessibility problem (WCAG 2.2).",
 code:"<input type=\"text\" placeholder=\"Owner name\">\n<div class=\"btn\" onclick=\"submit()\">Submit</div>\n<span style=\"color:#aaa\">Required fields in grey</span>\n<img src=\"map.png\">\n<label for=\"addr\">Address</label><input id=\"addr\" type=\"text\">",
 items:[["ph","Line 1: placeholder used instead of a label"],["div","Line 2: a div used as a button (no keyboard access)"],["color","Line 3: low-contrast grey, and color alone conveys meaning"],["alt","Line 4: image without alt text"],["addr","Line 5: labelled address input"]],
 checks:[{l:"Missing label",f:s=>s.has("ph")},{l:"Non-semantic button",f:s=>s.has("div")},{l:"Color and contrast",f:s=>s.has("color")},{l:"Missing alt text",f:s=>s.has("alt")}],
 constraints:[{l:"Correct markup not flagged",f:s=>!s.has("addr")}],
 explain:"Use real <label> and <button> elements, 4.5:1 text contrast, and don't rely on color alone. Every meaningful image needs alt text."});

T({id:"K5-kanban",ksa:["K5"],type:"mcq",tier:1,title:"Kanban: work piling up",
 prompt:"On your Kanban board, 14 items sit in 'Code Review' while 'Testing' is empty and cycle time has doubled. What's the best first change?",
 options:["Add more developers","Set a WIP limit on Code Review and have people swarm reviews before starting new work","Remove the Code Review column","Start more items so testers have work"],

T({id:"K4-tfvc-git",ksa:["K4"],type:"mcq",tier:1,title:"TFVC to Git migration",
 prompt:"Your organization still keeps a legacy app in TFVC. New Azure DevOps projects can't create TFVC repos by default. What's the sensible plan?",
 options:["Recreate TFVC in a new project by turning the setting back on forever","Migrate to Git with recent history (e.g., Azure Repos import, up to 180 days), keep the TFVC repo read-only for older history, and train the team on pull requests","Email zip files of the code","Stop using version control for the legacy app"],

T({id:"G1-fix-form",ksa:["G1","K10"],type:"html",tier:2,title:"Fix an inaccessible permit form",
 prompt:"Edit this HTML so it meets WCAG 2.1 AA basics: every input has a programmatic label, the submit control is a real button, the image has a text alternative, the required field is marked for assistive tech, and the error message is tied to its input. Keep the field names.",
 starter:"<form id=\"permit\">\n  <h2>Apply for a block party permit</h2>\n  <input type=\"text\" id=\"owner\" name=\"owner\" placeholder=\"Your name\">\n  <input type=\"text\" id=\"street\" name=\"street\" placeholder=\"Street\">\n  <span id=\"street-err\" class=\"error\">Street is required</span>\n  <img src=\"map.png\">\n  <div class=\"btn\" onclick=\"send()\">Submit</div>\n</form>\n",
 checks:[{l:"Every input has a label (label[for], wrapping label, aria-label or aria-labelledby)",f:d=>{const ins=[...d.querySelectorAll("input:not([type=hidden])")];return ins.length>0&&ins.every(i=>(i.id&&d.querySelector('label[for="'+i.id+'"]'))||i.closest("label")||(i.getAttribute("aria-label")||"").trim()||i.getAttribute("aria-labelledby"));}},
  {l:"Submit is a <button> (or input type=submit), not a div",f:d=>!!d.querySelector("button, input[type=submit]")&&!d.querySelector("div[onclick], span[onclick]")},
  {l:"Image has an alt attribute",f:d=>[...d.querySelectorAll("img")].every(i=>i.hasAttribute("alt"))},
  {l:"Street is marked required (required or aria-required)",f:d=>{const s=d.querySelector('[name="street"]');return !!s&&(s.hasAttribute("required")||s.getAttribute("aria-required")==="true");}},
  {l:"Error message linked with aria-describedby (or aria-errormessage)",f:d=>{const s=d.querySelector('[name="street"]');return !!s&&/street-err/.test((s.getAttribute("aria-describedby")||"")+" "+(s.getAttribute("aria-errormessage")||""));}}],
 constraints:[{l:"Inputs owner and street still exist",f:d=>!!d.querySelector('[name="owner"]')&&!!d.querySelector('[name="street"]')},{l:"Placeholder is not the only label (still OK to keep it)",f:d=>true}],
 hints:["Add <label for=\"owner\">Name</label> before each input.","Replace the div with <button type=\"submit\">Submit</button>; add alt=\"Map of the block\" (or alt=\"\" if decorative).","<input id=\"street\" name=\"street\" required aria-describedby=\"street-err\">"],
 explain:"Native labels and buttons give screen readers names and keyboard access for free. aria-describedby makes the error message read with the field. Placeholders disappear on typing and are not labels."});

T({id:"G1-angular-disclosure",ksa:["G1","K10"],type:"html",tier:3,title:"Angular: accessible filter toggle",
 prompt:"This Angular template shows and hides search filters with a clickable div. Rewrite it so keyboard and screen-reader users can operate it: use a native button, expose the expanded state with <code>[attr.aria-expanded]</code>, and point <code>aria-controls</code> at the panel's id. Keep the <code>(click)</code> handler and the <code>@if</code> block.",
 starter:"<div class=\"toggle\" (click)=\"open = !open\">\n  Filters <span class=\"chev\"></span>\n</div>\n@if (open) {\n  <div class=\"panel\">\n    <label for=\"status\">Status</label>\n    <select id=\"status\"><option>Open</option></select>\n  </div>\n}\n",
 checks:[{l:"Toggle is a <button> with the (click) handler",f:d=>[...d.querySelectorAll("button")].some(b=>b.hasAttribute("(click)"))},
  {l:"Button binds [attr.aria-expanded]",f:d=>[...d.querySelectorAll("button")].some(b=>b.hasAttribute("[attr.aria-expanded]"))},

T({id:"G1-dates",ksa:["G1"],type:"mcq",tier:1,title:"ADA Title II compliance date (public sector)",

 options:["April 24, 2026, WCAG 2.0 AA","April 26, 2027, WCAG 2.1 AA","April 26, 2028, WCAG 2.2 AA","There is no deadline; the rule only covers federal agencies"],

T({id:"G1-508",ksa:["G1","P5"],type:"mcq",tier:1,title:"Section 508 vs ADA Title II",

 options:["Agreed; 508 is the legal standard for everyone","Section 508 binds federal agencies and uses WCAG 2.0 AA; a state or local government's obligation is ADA Title II at WCAG 2.1 AA, so ask for a WCAG 2.1 AA conformance report (ACR/VPAT) and test it","Accessibility only applies to public-facing pages, not portals","A 508 statement means no testing is needed"],

T({id:"G1-testplan",ksa:["G1","K10"],type:"pick",tier:1,title:"Accessibility test plan for a release",

T({id:"G2-schema",ksa:["G2","K1","P5"],type:"json",tier:2,title:"Make a table retention-ready",
 prompt:"This is the design for the <code>BusinessLicense</code> table. Update it so it supports the retention schedule (category <code>LIC-03</code>, keep 6 years after expiration), legal holds and PII protection: add a retention category, a retain-until date, a legal-hold flag, mark the SSN column as encrypted and masked, and switch deletes from hard to soft. Keep all existing columns.",
 starter:"{\n  \"table\": \"BusinessLicense\",\n  \"deleteMode\": \"hard\",\n  \"columns\": [\n    { \"name\": \"Id\", \"type\": \"int\" },\n    { \"name\": \"BusinessName\", \"type\": \"nvarchar(200)\" },\n    { \"name\": \"OwnerSsn\", \"type\": \"char(9)\", \"encrypted\": false, \"masked\": false },\n    { \"name\": \"ExpiresOn\", \"type\": \"date\" }\n  ]\n}\n",
 checks:[{l:"Has a retention category column, with LIC-03 as default or documented value",f:(j,raw)=>(j.columns||[]).some(c=>/retention/i.test(c.name))&&/LIC-03/.test(raw)},{l:"Has a retain-until date column",f:j=>(j.columns||[]).some(c=>/retain|purge/i.test(c.name)&&/date/i.test(c.type||""))},{l:"Has a legal-hold flag",f:j=>(j.columns||[]).some(c=>/hold/i.test(c.name)&&/bit|bool/i.test(c.type||""))},{l:"SSN is encrypted and masked",f:j=>{const c=(j.columns||[]).find(x=>x.name==="OwnerSsn");return !!c&&c.encrypted===true&&c.masked===true;}},{l:"Deletes are soft",f:j=>j.deleteMode==="soft"}],
 constraints:[{l:"Original columns kept",f:j=>["Id","BusinessName","OwnerSsn","ExpiresOn"].every(n=>(j.columns||[]).some(c=>c.name===n))}],
 hints:["Add columns like RetentionCategory, RetainUntil and LegalHold.","Types: RetentionCategory varchar(10) default 'LIC-03', RetainUntil date, LegalHold bit.","Set \"encrypted\": true, \"masked\": true on OwnerSsn and \"deleteMode\": \"soft\"."],
 explain:"Retention metadata lets a scheduled purge job delete exactly what the schedule allows, skip anything on legal hold, and log what it purged. SSNs need encryption at rest and masking in the UI (e.g., Always Encrypted or column encryption plus dynamic masking)."});

// ============================== UTILITIES ==============================
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = (d=new Date())=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());};
const addDays=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return todayStr(d);};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
function words(t){return (String(t).trim().match(/\S+/g)||[]).length;}
function avgSentence(t){const s=String(t).split(/[.!?]+\s/).map(x=>x.trim()).filter(Boolean);if(!s.length)return 99;return words(t)/s.length;}
function val(arr,name){if(!Array.isArray(arr))return undefined;const x=arr.find(e=>e&&e.name===name);return x?x.value:undefined;}
function kvRef(v,secret){if(typeof v!=="string")return false;const a=new RegExp("^@Microsoft\\.KeyVault\\(SecretUri=https://kv-permits-prod\\.vault\\.azure\\.net/secrets/"+secret+"(/[\\w]*)?/?\\)$","i");const b=new RegExp("^@Microsoft\\.KeyVault\\(VaultName=kv-permits-prod;\\s*SecretName="+secret+"(;\\s*SecretVersion=\\w+)?\\)$","i");return a.test(v.trim())||b.test(v.trim());}
function xAll(root,name){return Array.from(root.getElementsByTagName(name));}
function stg(y,name){return y&&Array.isArray(y.stages)?y.stages.find(s=>s&&s.stage===name):undefined;}
function seededRand(seed){let s=0;for(const c of String(seed))s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function shuffle(a,rnd=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function flash(msg){const d=document.createElement("div");d.className="flash";d.setAttribute("role","status");d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}

// ---------- YAML subset parser ----------
const leadSp=l=>l.length-l.replace(/^ +/,"").length;
function parseYAML(src){
  const raw=src.replace(/\t/g,"  ").split(/\r?\n/);
  const lines=[];
  raw.forEach((l,ri)=>{const t=stripComment(l);if(!t.trim())return;lines.push({ind:leadSp(t),text:t.trim(),ri});});
  let i=0;
  function stripComment(l){let q=null;for(let k=0;k<l.length;k++){const c=l[k];if(q){if(c===q)q=null;continue;}if(c==='"'||c==="'"){q=c;continue;}if(c==="#"&&(k===0||/\s/.test(l[k-1])))return l.slice(0,k).replace(/\s+$/,"");}return l.replace(/\s+$/,"");}
  function scalar(s){s=s.trim();if(s==="")return null;
    if((s[0]==='"'&&s.endsWith('"'))||(s[0]==="'"&&s.endsWith("'")))return s.slice(1,-1);
    if(s[0]==="["&&s.endsWith("]")){const inner=s.slice(1,-1).trim();return inner?inner.split(",").map(x=>scalar(x)):[];}
    if(s[0]==="{"&&s.endsWith("}")){const o={};s.slice(1,-1).split(",").forEach(p=>{const m=p.match(/^\s*([^:]+):\s*(.*)$/);if(m)o[m[1].trim()]=scalar(m[2]);});return o;}
    if(/^(true|false)$/i.test(s))return s.toLowerCase()==="true";
    if(/^(null|~)$/.test(s))return null;
    if(/^-?\d+(\.\d+)?$/.test(s))return Number(s);
    return s;}
  function block(ind){if(i>=lines.length)return null;return lines[i].text.startsWith("- ")||lines[i].text==="-"?list(lines[i].ind):map(lines[i].ind);}
  function blockScalar(keyInd,ri,style){const out=[];let r=ri+1;let base=null;
    while(r<raw.length){const l=raw[r];if(!l.trim()){out.push("");r++;continue;}const ind=leadSp(l);if(ind<=keyInd)break;if(base===null)base=ind;out.push(l.slice(Math.min(base,ind)));r++;}
    while(i<lines.length&&lines[i].ri<r)i++;
    while(out.length&&out[out.length-1]==="")out.pop();
    return style==="|"?out.join("\n"):out.join(" ");}
  function keyval(text){const m=text.match(/^("[^"]*"|'[^']*'|[^\s:#][^:]*?):(?:\s+(.*))?$/);if(!m)return null;let k=m[1];if(/^["']/.test(k))k=k.slice(1,-1);return [k.trim(),m[2]];}
  function map(ind){const o={};
    while(i<lines.length&&lines[i].ind===ind&&!(lines[i].text.startsWith("- ")||lines[i].text==="-")){
      const ln=lines[i];const kv=keyval(ln.text);if(!kv)throw new Error("Line "+(ln.ri+1)+": expected 'key: value' but found '"+ln.text+"'");
      const [k,v]=kv;i++;
      if(v===undefined||v===""){ if(i<lines.length&&lines[i].ind>ind)o[k]=block(lines[i].ind);
        else if(i<lines.length&&lines[i].ind===ind&&(lines[i].text.startsWith("- ")||lines[i].text==="-"))o[k]=list(ind);
        else o[k]=null;}
      else if(/^[|>][-+]?$/.test(v.trim()))o[k]=blockScalar(ind,ln.ri,v.trim()[0]);
      else o[k]=scalar(v);
    }
    if(i<lines.length&&lines[i].ind>ind)throw new Error("Line "+(lines[i].ri+1)+": unexpected indentation");
    return o;}
  function list(ind){const a=[];
    while(i<lines.length&&lines[i].ind===ind&&(lines[i].text.startsWith("- ")||lines[i].text==="-")){
      const ln=lines[i];const rest=ln.text==="-"?"":ln.text.slice(2).trim();
      if(rest===""){i++;a.push(i<lines.length&&lines[i].ind>ind?block(lines[i].ind):null);continue;}
      const kv=keyval(rest);
      if(kv&&!/^["'\[{]/.test(rest)){const vind=ind+(ln.text.length-ln.text.slice(1).trimStart().length);lines[i]={ind:vind,text:rest,ri:ln.ri};a.push(map(vind));}
      else{i++;a.push(scalar(rest));}
    }
    return a;}
  if(!lines.length)return null;
  const out=block(lines[0].ind);
  if(i<lines.length)throw new Error("Line "+(lines[i].ri+1)+": unexpected indentation");
  return out;
}

function tokenize(l){return (l.match(/\S*"[^"]*"\S*|\S*'[^']*'\S*|\S+/g)||[]).map(t=>t.replace(/["']/g,""));}
function runCommands(text,kind){
  const s=newCmdState(kind);const out=[];
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith("#"));
  for(const line of lines){out.push("> "+line);const t=tokenize(line);
    if(t[0]==="git"){ if(kind!=="git"){out.push("This exercise is a TFVC workspace. Use tf commands.");continue;} gitCmd(s,t.slice(1),out);}
    else if(t[0]==="tf"){ if(kind!=="tf"){out.push("This exercise is a Git repo. Use git commands.");continue;} tfCmd(s,t[1]==="vc"?t.slice(2):t.slice(1),out);}
    else out.push(t[0]+": command not supported in this exercise.");}

function gitCmd(s,a,out){
  const c=a[0];
  const newBranch=(b)=>{if(!b){out.push("fatal: branch name required");return;}if(s.branches[b]){out.push("fatal: a branch named '"+b+"' already exists");return;}s.branches[b]=s.branches[s.cur].slice();s.cur=b;out.push("Switched to a new branch '"+b+"'");};
  if(c==="status"){out.push("On branch "+s.cur);if(s.staged.length)out.push("Changes to be committed:\n  "+s.staged.join("\n  "));if(s.modified.length)out.push("Changes not staged for commit:\n  modified: "+s.modified.join("\n  modified: "));if(!s.staged.length&&!s.modified.length)out.push("nothing to commit, working tree clean");}
  else if(c==="switch"||c==="checkout"){ if(a[1]==="-c"||a[1]==="-b"||a[1]==="--create")newBranch(a[2]);
    else if(s.branches[a[1]]){s.cur=a[1];out.push("Switched to branch '"+a[1]+"'");}
    else out.push("fatal: invalid reference: "+(a[1]||""));}
  else if(c==="branch"){ if(a[1]&&!a[1].startsWith("-")){if(s.branches[a[1]])out.push("fatal: a branch named '"+a[1]+"' already exists");else{s.branches[a[1]]=s.branches[s.cur].slice();out.push("(created branch "+a[1]+"; you are still on "+s.cur+")");}}
    else Object.keys(s.branches).forEach(b=>out.push((b===s.cur?"* ":"  ")+b));}
  else if(c==="add"){const p=a.slice(1);if(!p.length){out.push("Nothing specified, nothing added.");return;}
    if(p.some(x=>x==="."||x==="-A"||x==="--all")){s.staged.push(...s.modified);s.modified=[];}
    else for(const x of p){const m=s.modified.find(f=>f===x||f.endsWith("/"+x));if(m){s.staged.push(m);s.modified=s.modified.filter(f=>f!==m);}else out.push("fatal: pathspec '"+x+"' did not match any files");}}
  else if(c==="commit"){let msg=null;for(let k=1;k<a.length;k++){if(a[k]==="-m"||a[k]==="-am"){msg=a[k+1];if(a[k]==="-am"){s.staged.push(...s.modified);s.modified=[];}}}
    if(!msg){out.push("error: use -m \"message\" in this exercise");return;}
    if(!s.staged.length){out.push("nothing to commit (use \"git add\")");return;}
    const id=Math.random().toString(16).slice(2,9);s.branches[s.cur].push({id,msg,files:s.staged.slice()});out.push("["+s.cur+" "+id+"] "+msg+"\n "+s.staged.length+" file changed");s.staged=[];}
  else if(c==="push"){let up=false;const pos=[];for(const x of a.slice(1)){if(x==="-u"||x==="--set-upstream")up=true;else if(!x.startsWith("-"))pos.push(x);}
    let remote=pos[0],b=pos[1];if(b==="HEAD")b=s.cur;
    if(!remote){ if(s.upstream[s.cur]){b=s.cur;}else{out.push("fatal: The current branch "+s.cur+" has no upstream branch.\nTo push the current branch and set the remote as upstream, use\n    git push --set-upstream origin "+s.cur);return;}}
    else{ if(remote!=="origin"){out.push("fatal: '"+remote+"' does not appear to be a git repository");return;} if(!b)b=s.cur;}
    if(!s.branches[b]){out.push("error: src refspec "+b+" does not match any");return;}
    s.remote[b]=s.branches[b].slice();if(up)s.upstream[b]="origin/"+b;out.push("To origin\n * "+b+" -> "+b+(up?"\nbranch '"+b+"' set up to track 'origin/"+b+"'.":""));}
  else if(c==="log"){s.branches[s.cur].slice().reverse().forEach(x=>out.push(x.id+" "+x.msg));}
  else if(c==="pull"||c==="fetch"){out.push("Already up to date.");}
  else out.push("git "+(c||"")+": not supported in this exercise (try status, switch, add, commit, push, log).");
}
function tfCmd(s,a,out){
  const c=(a[0]||"").toLowerCase();
  const opts=a.slice(1).filter(x=>x.startsWith("/")||x.startsWith("-"));const pos=a.slice(1).filter(x=>!(x.startsWith("/")||x.startsWith("-")));
  if(c==="status"){out.push(s.pending.length?"File name   Change   Local path\n"+s.pending.map(p=>p.split("/").pop()+"   edit   "+p).join("\n"):"There are no pending changes.");}
  else if(c==="shelve"){const name=pos[0];if(!name){out.push("The shelveset name is required in this exercise: tf shelve <name>");return;}
    if(!s.pending.length){out.push("There are no pending changes to shelve.");return;}
    if(s.shelvesets[name]&&!opts.some(o=>/replace/i.test(o))){out.push("A shelveset named "+name+" already exists. Use /replace.");return;}
    s.shelvesets[name]=s.pending.slice();if(opts.some(o=>/move/i.test(o)))s.pending=[];out.push("Shelveset "+name+" successfully created.");}
  else if(c==="checkin"){if(!s.pending.length){out.push("There are no pending changes.");return;}const id=1000+s.changesets.length+1;s.changesets.push({id,files:s.pending.slice()});s.pending=[];out.push("Changeset #"+id+" checked in.");}
  else if(c==="undo"){s.pending=[];out.push("Undoing edit: FeeCalculator.cs");}
  else if(c==="unshelve"){out.push(s.shelvesets[pos[0]]?"Unshelved "+pos[0]:"Shelveset not found.");}
  else if(c==="shelvesets"){out.push(Object.keys(s.shelvesets).join("\n")||"No shelvesets found.");}
  else if(c==="get"){out.push("All files are up to date.");}
  else out.push("tf "+c+": not supported in this exercise (try status, shelve, shelvesets, checkin, undo).");
}

// ---------- HTTP request parser ----------
function parseReq(method,url,headers,body){
  const h={};String(headers).split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*([^:]+):\s*(.*)$/);if(m)h[m[1].trim().toLowerCase()]=m[2].trim();});
  let path=String(url).trim().replace(/^https?:\/\/[^/]+/i,"");let json=null,jsonErr=null;
  if(String(body).trim()){try{json=JSON.parse(body);}catch(e){jsonErr=e.message;}}
  return {method:String(method).toUpperCase(),path,h,body,json,jsonErr};
}

const WORKER_SRC = `self.onmessage=async(e)=>{const {code,tests}=e.data;const logs=[];const con={log:(...a)=>logs.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')),error:(...a)=>logs.push(a.join(' '))};

let workerURL=null;

function addEvidence(item,score,w){S.ev[item]=S.ev[item]||[];S.ev[item].push({s:Math.max(0,Math.min(100,Math.round(score))),w,t:Date.now()});if(S.ev[item].length>40)S.ev[item]=S.ev[item].slice(-40);}
function mastery(id){
  const ev=S.ev[id]||[];if(!ev.length)return 0;
  let num=0,den=0,wsum=0;const n=ev.length;
  ev.forEach((e,k)=>{const r=Math.pow(0.88,n-1-k);num+=e.s*e.w*r;den+=e.w*r;wsum+=e.w;});
  let m=(num/den)*Math.min(1,wsum/2.5);
  const last=ev[n-1].t;const idle=(Date.now()-last)/86400000;
  if(idle>21)m*=Math.pow(0.97,(idle-21)/7);
  return Math.round(m);
}
function isReady(id){return mastery(id)>=80&&!!S.passed[id]&&(S.starBest[id]||0)>=3;}
function fading(id){const ev=S.ev[id]||[];if(!ev.length)return false;return (Date.now()-ev[ev.length-1].t)/86400000>21;}
function streak(){
  const active=d=>{const x=S.days[d];return x&&(x.review+x.task+x.star+(x.read||0))>0;};
  let d=todayStr();if(!active(d))d=addDays(d,-1);
  let n=0,gap=0;
  for(let k=0;k<400;k++){ if(active(d)){n++;gap=0;} else {gap++; if(gap>1)break;} d=addDays(d,-1);}
  return n;
}

function allCards(){return CARDS.concat(S.extraCards);}

function dueCards(filterItem){
  const t=todayStr();const cards=allCards().filter(c=>!filterItem||c.item===filterItem);
  const due=cards.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t);
  const introduced=S.newIntro[t]||0;
  const limit=filterItem?99:Math.max(0,12-introduced);
  const fresh=cards.filter(c=>!S.cards[c.id]);
  return due.concat(filterItem?fresh:fresh.slice(0,limit));

// q: 1 again, 3 hard, 4 good, 5 easy
function gradeCard(card,q){
  const t=todayStr();
  let c=S.cards[card.id];
  if(!c){c={ef:2.5,int:0,reps:0,due:t};S.newIntro[t]=(S.newIntro[t]||0)+1;}
  if(q<3){c.reps=0;c.int=1;}
  else{c.reps++;c.int=c.reps===1?1:c.reps===2?3:Math.round(c.int*c.ef);if(q===3)c.int=Math.max(1,Math.round(c.int*0.7));}
  c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  c.due=addDays(t,c.int);S.cards[card.id]=c;
  addEvidence(card.item,q>=4?100:q===3?60:0,0.5);markDay("review");save();
}

// ---------- recording results ----------
function record(task,res,hintsUsed,opts={}){
  const credit=Math.max(0,1-0.15*hintsUsed);
  const score=Math.round(res.score*credit);
  const w=task.type==="write"?0.5:1;
  task.ksa.forEach(id=>{addEvidence(id,score,w);if(res.pass&&task.type!=="write")S.passed[id]=true;});
  S.best[task.id]=Math.max(S.best[task.id]||0,score);
  if(!res.pass){
    (res.checks||[]).filter(c=>!c.ok).forEach(c=>S.mistakes.unshift({d:todayStr(),task:task.id,title:task.title,check:c.l,ans:(res.answer||"").slice(0,400),ex:task.explain||""}));
    if(!(res.checks||[]).some(c=>!c.ok))S.mistakes.unshift({d:todayStr(),task:task.id,title:task.title,check:"Score below pass mark ("+score+"%)",ans:(res.answer||"").slice(0,400),ex:task.explain||""});
    S.mistakes=S.mistakes.slice(0,300);
    const mid="mk-"+task.id;
    if(!S.extraCards.some(c=>c.id===mid)&&task.explain)S.extraCards.push({id:mid,item:task.ksa[0],q:"From your mistakes log: "+task.title.replace(/<[^>]+>/g,"")+". What's the key point?",a:task.explain});
  }
  markDay("task");save();
  return score;
}

function renderTask(t,box,opts){
  const mock=!!opts.mock;let hintsUsed=0;let done=false;
  box.innerHTML=`<div class="card"><div class="row"><h2 class="grow" style="margin:0">${esc(t.title)}</h2><span class="pill">${typeLabel(t.type)}</span><span class="pill">Tier ${t.tier}</span></div>

   <div class="row" style="margin-top:12px"><button class="primary submit">${t.type==="scenario"?"Next":"Check"}</button>${!mock&&t.hints?`<button class="hintbtn">Hint (${t.hints.length} left, -15% each)</button>`:""}<span class="kbd grow">${t.type==="code"||t.type==="yaml"||t.type==="xml"||t.type==="json"||t.type==="cmd"?"Ctrl+Enter to check":t.type==="html"?"Ctrl+Enter to check":""}</span></div>
   <div class="hints"></div><div class="out" aria-live="polite"></div></div>`;
  const body=$(".body",box),out=$(".out",box),sub=$(".submit",box);
  const hb=$(".hintbtn",box);
  if(hb)hb.onclick=()=>{if(hintsUsed<t.hints.length){$(".hints",box).insertAdjacentHTML("beforeend",`<div class="hint"><b>Hint ${hintsUsed+1}:</b> <span style="white-space:pre-wrap;font-family:${hintsUsed===t.hints.length-1?"ui-monospace,Consolas,monospace":"inherit"}">${esc(t.hints[hintsUsed])}</span></div>`);hintsUsed++;hb.textContent=hintsUsed<t.hints.length?`Hint (${t.hints.length-hintsUsed} left, -15% each)`:"No more hints";if(hintsUsed>=t.hints.length)hb.disabled=true;}};
  let getRes;
  const finish=(res)=>{
    if(done&&mock)return;done=mock;
    const score=record(t,res,hintsUsed,opts);
    if(mock){opts.onDone&&opts.onDone({task:t,score,pass:res.pass});return;}
    out.innerHTML=`<div class="result ${res.pass?"ok":"bad"}"><b>${res.pass?"Passed":"Not yet"}</b> \u00B7 score ${score}%${hintsUsed?` (after ${hintsUsed} hint${hintsUsed>1?"s":""})`:""}
      ${res.checks&&res.checks.length?`<ul class="checks">${res.checks.map(c=>`<li class="${c.ok?"ok":"bad"}">${c.kind==="constraint"?"<span class='muted small'>Must not break:</span> ":""}${esc(c.l)}${c.why?` <span class="muted small">(${esc(c.why)})</span>`:""}</li>`).join("")}</ul>`:""}
      ${res.extra||""}${t.explain?`<p style="margin-bottom:0"><b>Why:</b> ${esc(t.explain)}</p>`:""}</div>
      ${t.model?`<details style="margin-top:10px"><summary>Model answer</summary><p>${esc(t.model)}</p></details>`:""}
      <div class="row" style="margin-top:10px"><a class="btn" href="#/practice">More practice</a>${res.pass?"":`<button class="retry">Try again</button>`}</div>`;
    const rb=$(".retry",out);if(rb)rb.onclick=()=>renderTask(t,box,opts);

  const evalChecks=(arr,kind,...args)=>(arr||[]).map(c=>{let ok=false,why="";try{ok=!!c.f(...args);}catch(e){ok=false;why=e.message;}return {l:c.l,ok,kind,why};});

    let score=succ.length?Math.round(100*sOk/succ.length):100;if(!cOk)score=Math.min(score,50);return {score,pass:sOk===succ.length&&cOk,checks:all,answer};};
  const editor=(starter,rows=14,label="Your answer")=>{const ta=document.createElement("textarea");ta.className="code";ta.spellcheck=false;ta.setAttribute("autocapitalize","off");ta.setAttribute("autocomplete","off");ta.setAttribute("aria-label",label);ta.value=starter||"";ta.rows=rows;
    ta.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey&&!e.ctrlKey){e.preventDefault();const s=ta.selectionStart;ta.setRangeText("  ",s,ta.selectionEnd,"end");}if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();sub.click();}});
    body.appendChild(ta);const rs=document.createElement("button");rs.className="link small";rs.textContent="Reset to starter";rs.onclick=()=>{ta.value=starter||"";};body.appendChild(rs);return ta;};

  if(t.type==="mcq"){

    body.innerHTML=t.rows.map((r,i)=>`<div class="restrow"><span>${esc(r[0])}</span><select aria-label="Method for ${esc(r[0])}" class="rm" data-i="${i}">${["GET","POST","PUT","PATCH","DELETE"].map(x=>`<option>${x}</option>`).join("")}</select><input type="text" aria-label="Path for ${esc(r[0])}" class="rp" data-i="${i}" value="/api/permits" autocapitalize="off" spellcheck="false"><select aria-label="Status for ${esc(r[0])}" class="rs" data-i="${i}">${statuses.map(x=>`<option>${x}</option>`).join("")}</select></div>`).join("");
    getRes=()=>{const checks=t.rows.map((r,i)=>{const mth=body.querySelector(`.rm[data-i="${i}"]`).value,p=body.querySelector(`.rp[data-i="${i}"]`).value.trim(),st=body.querySelector(`.rs[data-i="${i}"]`).value;
      const errs=[];if(mth!==r[1])errs.push("method");if(!r[2].test(p))errs.push("path");if(!r[3].includes(st))errs.push("status");if(/(get|create|delete|update|add|remove)/i.test(p.replace(/^\/api\//,"")))errs.push("verb in path");
      return {l:r[0]+(errs.length?" \u2192 expected "+r[1]+", status "+r[3].join(" or "):""),ok:!errs.length,kind:"success",why:errs.length?"check: "+errs.join(", "):""};});
      return fromChecks(checks,[],"rest table");};
  }
  else if(t.type==="write"){
    const ta=document.createElement("textarea");ta.setAttribute("aria-label","Your answer");ta.style.minHeight="180px";body.appendChild(ta);
    const wc=document.createElement("p");wc.className="small muted";wc.textContent="0 words";body.appendChild(wc);ta.oninput=()=>{wc.textContent=words(ta.value)+" words";};
    body.insertAdjacentHTML("beforeend",`<p style="margin-bottom:4px"><b>Self-check</b> (tick what's true after reading the model answer, shown when you check):</p>`+t.checklist.map((c,i)=>`<label class="opt"><input type="checkbox" data-c="${i}"><span>${esc(c)}</span></label>`).join(""));
    let stage=0,autoRes=null;
    getRes=()=>{ if(!ta.value.trim()){flash("Write your answer first.");return null;}
      if(stage===0){autoRes=evalChecks(t.auto,"success",ta.value);stage=1;
        out.innerHTML=`<div class="result"><b>Automatic checks</b><ul class="checks">${autoRes.map(c=>`<li class="${c.ok?"ok":"bad"}">${esc(c.l)}</li>`).join("")}</ul><p><b>Model answer:</b> ${esc(t.model)}</p><p class="small">Now tick the self-check boxes above that your answer meets, then press <b>Finish</b>.</p></div>`;
        sub.textContent="Finish";if(!mock)return null;}
      const ticks=[...body.querySelectorAll("input[data-c]")].filter(x=>x.checked).length;
      const a=autoRes.filter(c=>c.ok).length/autoRes.length,b=ticks/t.checklist.length;const score=Math.round(100*(0.5*a+0.5*b));
      return {score,pass:score>=70,checks:autoRes.concat([{l:"Self-check: "+ticks+" of "+t.checklist.length,ok:b>=0.75,kind:"success"}]),answer:ta.value};};
  }
  sub.onclick=async()=>{const r=await getRes();if(r)finish(r);};
}

   ${(sit?[["Approach","S",160],["How you'd measure success","R",70]]:[["Situation","S",70],["Task","T",70],["Action","A",120],["Result","R",70]]).map(([k,code,h])=>`<label style="margin-top:8px"><b>${k}</b><textarea data-k="${code}" style="min-height:${h}px"></textarea></label>`).join("")}

  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdateBar(reg);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)showUpdateBar(reg);});});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(err=>console.warn("Service worker not registered:",err&&err.message));
}

// ---------- self-check (dev) ----------
function selfCheck(){const missing=ITEMS.filter(i=>!TASKS.some(t=>t.ksa.includes(i.id))||CARDS.filter(c=>c.item===i.id).length<2||!STAR.some(s=>s.tags.includes(i.id))).map(i=>i.id);if(missing.length)console.warn("Coverage gaps:",missing);else console.log("Coverage OK: all",ITEMS.length,"items have tasks, 2+ cards and a STAR prompt. Tasks:",TASKS.length,"Cards:",CARDS.length);
  const thin=compItemIds().filter(id=>CARDS.filter(c=>c.item===id).length<3||STAR.filter(s=>s.tags.includes(id)).length<2||!TASKS.some(t=>t.ksa.includes(id)&&t.type!=="write"));if(thin.length)console.warn("Competency behaviors needing 3 cards, 2 prompts and a graded task:",thin);
  const noLesson=ITEMS.filter(i=>!LESSONS[i.id]).map(i=>i.id);if(noLesson.length)console.warn("Items without a lesson:",noLesson);
  const dupIds=a=>a.map(x=>x.id).filter((x,i,arr)=>arr.indexOf(x)!==i);const d=[...dupIds(ITEMS),...dupIds(TASKS),...dupIds(STAR),...dupIds(CARDS)];if(d.length)console.warn("Duplicate ids:",d);}
selfCheck();
